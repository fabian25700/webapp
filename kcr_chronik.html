<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KC Rakete - Chronik</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --primary: #e3000b; /* Rot */
            --accent: #c0c0c0; /* Silber */
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --border: #d1d1d1;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --surface: #1e1e1e;
                --text-primary: #ffffff;
                --text-secondary: #b0b0b0;
                --border: #333333;
                --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            }
        }

        /* Zoom deaktiviert, Pan erlaubt */
        html, body { 
            width: 100%; 
            margin: 0;
            touch-action: pan-y; 
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            width: 100%;
            background: var(--surface);
            border-bottom: 2px solid var(--primary);
            text-align: center;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 { margin: 0; font-weight: 800; color: var(--primary); font-size: 1.4rem; text-transform: uppercase; }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 20px 0;
        }

        .timeline {
            position: relative;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: var(--accent);
            top: 0;
            bottom: 0;
            left: 20px;
            margin-left: -2px;
        }

        .event-card {
            padding: 10px 10px 10px 50px;
            position: relative;
        }

        .event-card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            left: 14px;
            background-color: var(--primary);
            border: 2px solid var(--accent);
            top: 25px;
            border-radius: 50%;
            z-index: 1;
        }

        .content {
            padding: 15px;
            background-color: var(--surface);
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .date {
            font-weight: 900;
            color: var(--primary);
            font-size: 0.85rem;
            display: block;
            margin-bottom: 5px;
        }

        .details {
            font-size: 0.95rem;
            line-height: 1.4;
            white-space: pre-wrap; /* Erhält Zeilenumbrüche aus dem JS */
        }

        footer {
            padding: 25px;
            text-align: center;
            font-weight: bold;
            color: #000;
            background: var(--accent);
            width: 100%;
            margin-top: 20px;
            box-sizing: border-box;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>KC Rakete - Chronik</h1>
    </header>

    <div class="container">
        <div class="timeline" id="chronik"></div>
    </div>

    <footer id="stats"></footer>

    <script>
        const data = [
            { d: "18. Oktober 2020", txt: "Erstes Kegeln als KBC Warmer Hans mit den Gründungsmitgliedern: Christoph, Fabian, Jan, Leonard, Marvin, Niklas, Tobias und Yannick" },
            { d: "30. September 2021", txt: "Zweites Kegeln (erstes mit Strafen) und Umbennung in KC Rakete \nBeitritt der Mitglieder: Cengiz und Julian" },
            { d: "1. November 2021", txt: "Erste eigene Aufkleber" },
            { d: "24. Februar 2022", txt: "Abbruch Karnevalskegeln wegen Alkoholpegel" },
            { d: "4. August 2022", txt: "10. Kegeln" },
            { d: "29. Dezember 2022", txt: "1. Kegeltunier im Brauhaus Zur Krone Bergheim \n3. Platz hinter KC Govas & KC Met Schmackes" },
            { d: "20. Oktober 2023", txt: "Beitritt des Mitglieds: Daniel" },
            { d: "3. November 2023", txt: "Neue KC Rakete Polo-Shirts" },
            { d: "17. November 2023", txt: "25. Kegeln" },
            { d: "29. Dezember 2023", txt: "2. Kegeltunier im Brauhaus Zur Krone Bergheim \n3. Platz hinter KC Govas & KC Met Schmackes" },
            { d: "2. April 2024", txt: "Neue KC Rakete Hoodies" },
            { d: "25. April 2024", txt: "Beitritt des Mitglieds: Neitzke" },
            { d: "14. Juni 2024", txt: "1. Kegeltour - Brüssel - mit Schnitzeljagd \nOrganisatoren: Fabian und Christoph \nKC Rakete Mottoshirts, Flachmänner und Jute-Beutel für Teilnehmer" },
            { d: "28. Juni 2024", txt: "Austritt des Mitglieds: Daniel" },
            { d: "31. August 2024", txt: "Erste KC Rakete Fahne" },
            { d: "29. Dezember 2024", txt: "3. Kegeltunier im Brauhaus Zur Krone Bergheim \nmit KC Met Schmackes geteilter 2. Platz hinter KC Govas" },
            { d: "7. Februar 2025", txt: "Wechsel Kegelbahn Em Pittermänchen zum Brauhaus zur Krone" },
            { d: "13. Juni 2025", txt: "2. Kegeltour - Hamburg - mit Beerpong Tunier und Schnitzeljagd \nOrganisatoren: Yannick und Cengiz \nKC Rakete Rucksäcke und Fischerhüte + Kölschgläser für Gewinner" },
            { d: "25. Juli 2025", txt: "Erste Mitgliederversammlung und Beschuss Satzung \"Zur Krone\" \nErster Vorstand: Christoph (Präsident), Niklas (Schriftführer), Yannick (Kassenwart), Fabian (Kassenprüfer)" },
            { d: "15. November 2025", txt: "1. KC Rakete Winterfest \nim Bierbrunnen Bergheim mit 32 Gästen" },
            { d: "27. Dezember 2025", txt: "4. Kegeltunier im Brauhaus Zur Krone Bergheim \n1. Platz vor KC Govas & KC Met Schmackes" },
            { d: "12. Juni 2026", txt: "3. Kegeltour - ?? \nOrganisatoren: Tobias und Christoph" }
        ];

        const footerText = "Heute 11 Mitglieder - 53 Kegelabende";

        function render() {
            const container = document.getElementById('chronik');
            data.forEach(item => {
                const el = document.createElement('div');
                el.className = 'event-card';
                el.innerHTML = `
                    <div class="content">
                        <span class="date">${item.d}</span>
                        <div class="details">${item.txt}</div>
                    </div>
                `;
                container.appendChild(el);
            });
            document.getElementById('stats').innerText = footerText;
        }

        render();
    </script>
</body>
</html>
