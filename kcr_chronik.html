<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KC Rakete - Chronik</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --primary: #e3000b; /* Rot */
            --accent: #c0c0c0; /* Silber */
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --border: #d1d1d1;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --nav-width: 80px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --surface: #1e1e1e;
                --text-primary: #ffffff;
                --text-secondary: #b0b0b0;
                --border: #333333;
                --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            }
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Verhindert Textmarkierung beim schnellen Tippen auf Mobile */
            -webkit-tap-highlight-color: transparent;
        }

        header {
            width: 100%;
            background: var(--surface);
            border-bottom: 2px solid var(--primary);
            text-align: center;
            padding-top: calc(15px + env(safe-area-inset-top));
            padding-bottom: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { margin: 0; font-weight: 800; color: var(--primary); font-size: 1.4rem; text-transform: uppercase; }

        /* Layout-Container für Sidebar + Content */
        .main-layout {
            display: flex;
            width: 100%;
            max-width: 800px;
            position: relative;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Fixes Inhaltsverzeichnis */
        nav#year-nav {
            width: var(--nav-width);
            position: sticky;
            top: 80px;
            height: fit-content;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            text-decoration: none;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: var(--shadow);
            transition: 0.2s;
        }

        .nav-item:active { transform: scale(0.9); background: var(--primary); color: white; }

        /* Timeline Content */
        .container {
            flex: 1;
            padding: 20px;
        }

        .timeline { position: relative; }

        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: var(--accent);
            top: 0;
            bottom: 0;
            left: 20px;
            margin-left: -2px;
        }

        .event-card { padding: 10px 10px 10px 50px; position: relative; scroll-margin-top: 100px; }

        .event-card::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            left: 14px;
            background-color: var(--primary);
            border: 2px solid var(--accent);
            top: 25px;
            border-radius: 50%;
            z-index: 1;
        }

        .event-card.goal::after {
            background-color: var(--surface);
            border: 2px dashed var(--primary);
        }

        .content {
            padding: 15px;
            background-color: var(--surface);
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .date { font-weight: 900; color: var(--primary); font-size: 0.85rem; display: block; margin-bottom: 5px; }
        .details { font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; }
        b { color: var(--text-primary); font-weight: 700; }

        footer {
            padding: 25px;
            text-align: center;
            font-weight: bold;
            background: var(--accent);
            width: 100%;
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* Mobile Anpassung für das Menü */
        @media (max-width: 600px) {
            .main-layout { flex-direction: column; }
            nav#year-nav {
                width: 100%;
                position: sticky;
                top: 60px; /* Unter dem Header */
                flex-direction: row;
                overflow-x: auto;
                background: var(--bg);
                z-index: 90;
                padding: 10px;
                box-sizing: border-box;
                border-bottom: 1px solid var(--border);
            }
            .nav-item { min-width: 60px; }
            .container { padding: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>KC Rakete - Chronik</h1>
    </header>

    <div class="main-layout">
        <!-- Inhaltsverzeichnis wird per JS befüllt -->
        <nav id="year-nav"></nav>

        <div class="container">
            <div class="timeline" id="chronik"></div>
        </div>
    </div>

    <footer id="stats"></footer>

    <script>
        const data = [
            { d: "18. Oktober 2020", txt: "Erstes Kegeln als <b>KBC Warmer Hans</b> mit den Gründungsmitgliedern: Christoph, Fabian, Jan, Leonard, Marvin, Niklas, Tobias und Yannick" },
            { d: "30. September 2021", txt: "Zweites Kegeln (erstes mit Strafen) und Umbennung in <b>KC Rakete</b> \nBeitritt der Mitglieder: Cengiz und Julian" },
            { d: "1. November 2021", txt: "Erste eigene <b>Aufkleber</b>" },
            { d: "24. Februar 2022", txt: "Abbruch <b>Karnevalskegeln</b> wegen Alkoholpegel" },
            { d: "4. August 2022", txt: "<b>10. Kegeln</b>" },
            { d: "29. Dezember 2022", txt: "<b>1. Kegeltunier</b> im Brauhaus Zur Krone Bergheim \n<b>3. Platz</b> hinter KC Govas & KC Met Schmackes" },
            { d: "20. Oktober 2023", txt: "Beitritt des Mitglieds: <b>Daniel</b>" },
            { d: "3. November 2023", txt: "Neue KC Rakete <b>Polo-Shirts</b>" },
            { d: "17. November 2023", txt: "<b>25. Kegeln</b>" },
            { d: "29. Dezember 2023", txt: "<b>2. Kegeltunier</b> im Brauhaus Zur Krone Bergheim \n<b>3. Platz</b> hinter KC Govas & KC Met Schmackes" },
            { d: "2. April 2024", txt: "Neue KC Rakete <b>Hoodies</b>" },
            { d: "25. April 2024", txt: "Beitritt des Mitglieds: <b>Neitzke</b>" },
            { d: "14. Juni 2024", txt: "<b>1. Kegeltour - Brüssel</b> - mit Schnitzeljagd \nOrganisatoren: Fabian und Christoph \nKC Rakete Mottoshirts, Flachmänner und Jute-Beutel für Teilnehmer" },
            { d: "28. Juni 2024", txt: "Austritt des Mitglieds: <b>Daniel</b>" },
            { d: "31. August 2024", txt: "Erste KC Rakete <b>Fahne</b>" },
            { d: "29. Dezember 2024", txt: "<b>3. Kegeltunier</b> im Brauhaus Zur Krone Bergheim \nmit KC Met Schmackes geteilter <b>2. Platz</b> hinter KC Govas" },
            { d: "7. Februar 2025", txt: "Wechsel Kegelbahn <b>Em Pittermänche</b> zum Brauhaus zur Krone" },
            { d: "13. Juni 2025", txt: "<b>2. Kegeltour - Hamburg</b> - mit Beerpong Tunier und Schnitzeljagd \nOrganisatoren: Yannick und Cengiz \nKC Rakete Rucksäcke und Fischerhüte + Kölschgläser für Gewinner" },
            { d: "25. Juli 2025", txt: "Erste Mitgliederversammlung und <b>Beschluss Satzung</b> \"Zur Krone\" \nErster Vorstand: Christoph (Präsident), Niklas (Schriftführer), Yannick (Kassenwart), Fabian (Kassenprüfer)" },
            { d: "15. November 2025", txt: "<b>1. KC Rakete Winterfest</b> \nim Bierbrunnen Bergheim mit 32 Gästen" },
            { d: "27. Dezember 2025", txt: "<b>4. Kegeltunier</b> im Brauhaus Zur Krone Bergheim \n<b>1. Platz</b> vor KC Govas & KC Met Schmackes" },
            { d: "12. Juni 2026", txt: "<b>3. Kegeltour - ??</b> \nOrganisatoren: Tobias und Christoph" },
            { d: "27. Juni 2026", txt: "Erstes <b>KC Rakete Sommerfest</b> im Vereinsheim Thorr mit x Gästen und Überraschungsgast" },
            { d: "Offen", txt: "Eintrag ins <b>Vereinsregister</b> unter dem Namen <b>Kegelclub Rakete e.V.</b>", isGoal: true }
        ];

        const footerText = "Heute 11 Mitglieder - 53 Kegelabende";

        function render() {
            const container = document.getElementById('chronik');
            const nav = document.getElementById('year-nav');
            
            // 1. Daten umkehren für Neu -> Alt
            const reversedData = [...data].reverse();
            
            const yearsSet = new Set();

            reversedData.forEach((item, index) => {
                // Jahr extrahieren für das Inhaltsverzeichnis
                const yearMatch = item.d.match(/\d{4}/);
                const year = yearMatch ? yearMatch[0] : "Zukunft";

                // Event Card erstellen
                const el = document.createElement('div');
                el.className = 'event-card' + (item.isGoal ? ' goal' : '');
                
                // ID vergeben, wenn es der erste Eintrag dieses Jahres ist
                if (!yearsSet.has(year)) {
                    el.id = `year-${year}`;
                    yearsSet.add(year);
                    
                    // Navigations-Punkt erstellen
                    const navItem = document.createElement('a');
                    navItem.href = `#year-${year}`;
                    navItem.className = 'nav-item';
                    navItem.innerText = year;
                    nav.appendChild(navItem);
                }

                el.innerHTML = `
                    <div class="content">
                        <span class="date">${item.d}</span>
                        <div class="details">${item.txt}</div>
                    </div>
                `;
                container.appendChild(el);
            });

            document.getElementById('stats').innerText = footerText;
        }

        render();
    </script>
</body>
</html>
