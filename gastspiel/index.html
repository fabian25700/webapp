<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gastspiel Magazin</title>

    <!-- PDF.js zum Auslesen des PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- PageFlip Bibliothek für den Magazin-Blättereffekt -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --header-bg: rgba(240, 242, 245, 0.95);
            --header-text: #1e293b;
            --header-border: #e2e8f0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--header-text);
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            z-index: 100;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--header-border);
        }

        header h1 {
            color: var(--header-text);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .btn-preorder {
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-preorder:hover {
            background-color: var(--accent-hover);
        }

        .btn-preorder:active {
            transform: scale(0.96);
        }

        .content-main {
            flex: 1;
            margin-top: 60px;
            width: 100%;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 24px;
            overflow: hidden;
        }

        #flipbook-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            background-color: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .page canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        .loading {
            position: absolute;
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 500;
        }

        .magazine-hints {
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gastspiel</h1>
        <!-- Vorbestellen-Button oben rechts -->
        <a href="#vorbestellen" class="btn-preorder" id="preorder-btn">Vorbestellen</a>
    </header>

    <main class="content-main">
        <div class="loading" id="loading-text">Magazin wird geladen...</div>
        <div id="flipbook-container">
            <div id="magazine"></div>
        </div>
        <div class="magazine-hints">Blättern per Wischen oder Klick auf die Ränder</div>
    </main>

    <script>
        const pdfUrl = 'gastspiel.pdf';

        async function initMagazine() {
            const container = document.getElementById('magazine');
            const loadingText = document.getElementById('loading-text');

            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                const totalPages = pdf.numPages;

                const isMobile = window.innerWidth < 768;
                
                // Exaktes A5 Seitenverhältnis (1400x2000 entspricht ca. 0.7)
                const a5AspectRatio = 1400 / 2000; 

                // Deutlich konservativere Platzberechnung, damit überall ein schöner, sichtbarer Rand bleibt
                const maxAvailableWidth = window.innerWidth * (isMobile ? 0.88 : 0.70);
                const maxAvailableHeight = (window.innerHeight - 80) * 0.78;

                let pageWidth, pageHeight;

                if (isMobile) {
                    // Auf Smartphones: Einzelne Seite im Hochformat (A5)
                    pageHeight = maxAvailableHeight;
                    pageWidth = pageHeight * a5AspectRatio;

                    if (pageWidth > maxAvailableWidth) {
                        pageWidth = maxAvailableWidth;
                        pageHeight = pageWidth / a5AspectRatio;
                    }
                } else {
                    // Auf Mac/Desktop: Doppelseite (Breite = 2 x A5-Einzelseite)
                    // Wir leiten die Dimensionen strikt aus der verfügbaren Höhe ab
                    pageHeight = maxAvailableHeight;
                    pageWidth = pageHeight * a5AspectRatio;

                    //
