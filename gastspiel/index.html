<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gastspiel Magazin</title>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --header-bg: rgba(240, 242, 245, 0.95);
            --header-text: #1e293b;
            --header-border: #e2e8f0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--header-text);
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            z-index: 100;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--header-border);
        }

        header h1 {
            color: var(--header-text);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .btn-preorder {
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-preorder:hover {
            background-color: var(--accent-hover);
        }

        .btn-preorder:active {
            transform: scale(0.96);
        }

        .content-main {
            flex: 1;
            margin-top: 60px;
            width: 100%;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .pdf-container {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 85vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe, embed {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gastspiel</h1>
        <!-- Vorbestellen-Button oben rechts -->
        <a href="#vorbestellen" class="btn-preorder" id="preorder-btn">Vorbestellen</a>
    </header>

    <main class="content-main">
        <div class="pdf-container">
            <!-- Nutzt den nativen, extrem stabilen Browser-PDF-Viewer mit exakter A5-Größenanpassung -->
            <iframe src="gastspiel.pdf#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf"></iframe>
        </div>
    </main>

    <script>
        document.getElementById('preorder-btn').addEventListener('click', (e) => {
            // Hier optional den Link zur Vorbestellung einfügen
        });
    </script>
</body>
</html>
