<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gastspiel Magazin</title>

    <!-- PDF.js zum Auslesen des PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- PageFlip Bibliothek für den Magazin-Blättereffekt -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --header-bg: rgba(240, 242, 245, 0.95);
            --header-text: #1e293b;
            --header-border: #e2e8f0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --page-padding: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--header-text);
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: calc(env(safe-area-inset-top) + 12px) 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--header-border);
        }

        header h1 {
            color: var(--header-text);
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .btn-preorder {
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-preorder:hover {
            background-color: var(--accent-hover);
        }

        .btn-preorder:active {
            transform: scale(0.96);
        }

        .content-main {
            flex: 1;
            padding: calc(env(safe-area-inset-top) + 75px) var(--page-padding) calc(env(safe-area-inset-bottom) + 20px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #flipbook-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 4px;
        }

        .page canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        .loading {
            position: absolute;
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 500;
        }

        .magazine-hints {
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gastspiel</h1>
        <!-- Vorbestellen-Button oben rechts -->
        <a href="#vorbestellen" class="btn-preorder" id="preorder-btn">Vorbestellen</a>
    </header>

    <main class="content-main">
        <div class="loading" id="loading-text">Magazin wird geladen...</div>
        <div id="flipbook-container">
            <div id="magazine"></div>
        </div>
        <div class="magazine-hints">Blättern per Wischen oder Klick auf die Ränder</div>
    </main>

    <script>
        const pdfUrl = 'gastspiel.pdf';

        async function initMagazine() {
            const container = document.getElementById('magazine');
            const loadingText = document.getElementById('loading-text');

            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;
                const totalPages = pdf.numPages;

                const isMobile = window.innerWidth < 768;
                // Genügend Abstand (Puffer), damit das Magazin nicht am Rand klebt
                const availableWidth = window.innerWidth - 40;
                const availableHeight = (window.innerHeight - 100) - 40;

                const page1 = await pdf.getPage(1);
                const viewport1 = page1.getViewport({ scale: 1.0 });
                const aspectRatio = viewport1.width / viewport1.height;

                let pageWidth, pageHeight;

                if (isMobile) {
                    pageWidth = Math.min(availableWidth, 450);
                    pageHeight = pageWidth / aspectRatio;
                    if (pageHeight > availableHeight) {
                        pageHeight = availableHeight;
                        pageWidth = pageHeight * aspectRatio;
                    }
                } else {
                    // Auf Desktop/Mac: Doppelseite einpassen mit gutem Rand
                    pageHeight = Math.min(availableHeight, 750);
                    pageWidth = pageHeight * aspectRatio;
                    // Bei Doppelseite prüfen, ob die Gesamtbreite passt
                    if ((pageWidth * 2) > availableWidth) {
                        pageWidth = (availableWidth / 2) * 0.95;
                        pageHeight = pageWidth / aspectRatio;
                    }
                }

                const pageFlip = new St.PageFlip(container, {
                    width: Math.round(pageWidth),
                    height: Math.round(pageHeight),
                    size: isMobile ? "fixed" : "stretch",
                    minWidth: 280,
                    maxWidth: 700,
                    minHeight: 400,
                    maxHeight: 1000,
                    drawShadow: true,
                    showCover: true,
                    mobileScrollSupport: true,
                    usePortrait: isMobile
                });

                const pagesDOM = [];
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const scale = 2.0; // Hohe Auflösung für Retina-Displays
                    const viewport = page.getViewport({ scale: scale });

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;

                    pageDiv.appendChild(canvas);
                    pagesDOM.push(pageDiv);
                }

                pageFlip.loadFromHTML(pagesDOM);
                loadingText.style.display = 'none';

            } catch (error) {
                console.error("Fehler beim Laden des Magazins:", error);
                loadingText.innerText = "Fehler beim Laden der 'gastspiel.pdf'.";
            }
        }

        window.addEventListener('DOMContentLoaded', initMagazine);

        document.getElementById('preorder-btn').addEventListener('click', (e) => {
            // Hier Link zur Vorbestellung hinterlegen, z.B.:
            // window.location.href = 'https://dein-shop-link.de';
        });
    </script>
</body>
</html>
