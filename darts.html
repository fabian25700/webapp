<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cricket Darts</title>
    <style>
        :root {
            --bg-warm: #FFF9F1;
            --card-bg: #FFFFFF;
            --primary: #2D2D2D;
            --accent: #D97706; /* Warmes Bernstein */
            --success: #059669;
            --border: #E5E7EB;
            --text-light: #6B7280;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-warm);
            color: var(--primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Setup Screen */
        #setupScreen {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 40px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .input-group {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 12px;
            font-size: 1.2rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
            text-transform: uppercase;
        }

        button.main-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Game Screen */
        #gameScreen { display: none; width: 100%; padding: 10px; }

        .scoreboard-container {
            overflow-x: auto;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            padding: 12px 5px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            font-size: 1.1rem;
            background: #F3F4F6;
            color: var(--primary);
        }

        .target-col {
            width: 60px;
            font-weight: 900;
            background: var(--primary);
            color: white;
            font-size: 1.3rem;
        }

        /* Darts Symbole & Buttons */
        .hit-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: #F9FAFB;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .hit-btn:active { transform: scale(0.9); }
        .hit-btn.closed { background: var(--accent); color: white; border-color: var(--accent); }

        .points-label {
            font-size: 0.8rem;
            color: var(--success);
            font-weight: bold;
            height: 15px;
            display: block;
            margin-top: 4px;
        }

        .total-score {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--accent);
        }

        .footer-controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        /* PopUp */
        #winPopup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            z-index: 100;
            text-align: center;
            width: 80%;
        }
    </style>
</head>
<body>

    <div id="setupScreen">
        <h1 style="color: var(--accent)">CRICKET</h1>
        <div class="input-group">
            <label>Anzahl Spieler (1-5):</label>
            <input type="number" id="playerCount" value="2" min="1" max="5">
            <div id="nameInputs"></div>
        </div>
        <button class="main-btn" onclick="startGame()">SPIEL STARTEN</button>
    </div>

    <div id="gameScreen">
        <div class="scoreboard-container">
            <table>
                <thead><tr id="headerRow"><th class="target-col">🎯</th></tr></thead>
                <tbody id="gameBody"></tbody>
                <tfoot><tr id="footerRow"><td class="target-col">Σ</td></tr></tfoot>
            </table>
        </div>
        <div class="footer-controls">
            <button onclick="confirmReset()" style="background:none; border:none; color:var(--text-light); text-decoration:underline;">Neues Spiel</button>
        </div>
    </div>

    <div id="winPopup">
        <h2 style="font-size: 2rem">🏆 SIEGER!</h2>
        <h1 id="winnerName" style="font-size: 4rem; color: var(--accent)">---</h1>
        <button class="main-btn" onclick="location.reload()">Neustart</button>
    </div>

    <script>
        let players = [];
        const targets = [20, 19, 18, 17, 16, 15, 25];
        let gameState = JSON.parse(localStorage.getItem('dartsCricketState')) || null;

        // Namen-Inputs generieren
        document.getElementById('playerCount').addEventListener('input', updateNameInputs);
        function updateNameInputs() {
            const count = document.getElementById('playerCount').value;
            const container = document.getElementById('nameInputs');
            container.innerHTML = '';
            for(let i=0; i<Math.min(count, 5); i++) {
                container.innerHTML += `<input type="text" placeholder="P${i+1}" maxlength="3" class="name-in" id="name-${i}">`;
            }
        }
        updateNameInputs();

        function startGame() {
            const count = document.getElementById('playerCount').value;
            players = [];
            for(let i=0; i<count; i++) {
                const val = document.getElementById(`name-${i}`).value || `P${i+1}`;
                players.push(val.toUpperCase());
            }
            
            if(!gameState) {
                gameState = { players: players, data: {} };
                targets.forEach(t => {
                    players.forEach((_, pIdx) => {
                        gameState.data[`${t}-${pIdx}`] = { hits: 0, points: 0 };
                    });
                });
            }
            renderBoard();
        }

        function renderBoard() {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            
            const header = document.getElementById('headerRow');
            const footer = document.getElementById('footerRow');
            const body = document.getElementById('gameBody');
            
            header.innerHTML = '<th class="target-col">🎯</th>';
            footer.innerHTML = '<td class="target-col">Σ</td>';
            body.innerHTML = '';

            gameState.players.forEach((p, i) => {
                header.innerHTML += `<th>${p}</th>`;
                footer.innerHTML += `<td id="total-${i}" class="total-score">0</td>`;
            });

            targets.forEach(t => {
                let row = `<tr><td class="target-col">${t === 25 ? 'B' : t}</td>`;
                gameState.players.forEach((_, pIdx) => {
                    const key = `${t}-${pIdx}`;
                    const cell = gameState.data[key];
                    row += `<td>
                        <div class="hit-btn ${cell.hits >= 3 ? 'closed' : ''}" onclick="registerHit(${t}, ${pIdx})">
                            ${getSym(cell.hits)}
                        </div>
                        <span class="points-label" id="pts-${key}">${cell.points > 0 ? '+' + cell.points : ''}</span>
                    </td>`;
                });
                body.innerHTML += row + `</tr>`;
            });
            updateScores();
        }

        function getSym(h) {
            if (h === 1) return "/";
            if (h === 2) return "X";
            if (h >= 3) return "⦻";
            return "";
        }

        function registerHit(target, pIdx) {
            const key = `${target}-${pIdx}`;
            const cell = gameState.data[key];

            if (cell.hits < 3) {
                cell.hits++;
            } else {
                // Check if others still open
                const othersOpen = gameState.players.some((_, i) => gameState.data[`${target}-${i}`].hits < 3);
                if (othersOpen) {
                    cell.points += target;
                }
            }
            
            localStorage.setItem('dartsCricketState', JSON.stringify(gameState));
            renderBoard();
            checkWinner();
        }

        function updateScores() {
            gameState.players.forEach((_, pIdx) => {
                let sum = 0;
                targets.forEach(t => sum += gameState.data[`${t}-${pIdx}`].points);
                document.getElementById(`total-${pIdx}`).innerText = sum;
            });
        }

        function checkWinner() {
            gameState.players.forEach((_, pIdx) => {
                const allClosed = targets.every(t => gameState.data[`${t}-${pIdx}`].hits >= 3);
                const currentScore = Array.from(targets).reduce((s, t) => s + gameState.data[`${t}-${pIdx}`].points, 0);
                
                const scores = gameState.players.map((_, i) => 
                    targets.reduce((s, t) => s + gameState.data[`${t}-${i}`].points, 0)
                );
                const maxScore = Math.max(...scores);

                if (allClosed && currentScore === maxScore) {
                    document.getElementById('winnerName').innerText = gameState.players[pIdx];
                    document.getElementById('winPopup').style.display = 'block';
                    localStorage.removeItem('dartsCricketState');
                }
            });
        }

        function confirmReset() {
            if(confirm("Spiel wirklich abbrechen?")) {
                localStorage.removeItem('dartsCricketState');
                location.reload();
            }
        }

        // Falls Daten im Speicher, direkt zum Spiel
        if(localStorage.getItem('dartsCricketState')) {
            gameState = JSON.parse(localStorage.getItem('dartsCricketState'));
            startGame();
        }
    </script>
</body>
</html>
