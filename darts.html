<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cricket Darts</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --primary: #2ecc71;
            --accent: #D97706;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.95);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: rgba(51, 65, 85, 0.8);
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Verhindert jegliches Scrollen */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-link { text-decoration: none; color: inherit; cursor: default; }
        h1 { margin: 10px 0; font-weight: 800; letter-spacing: 0.05em; color: var(--accent); font-size: 1.2rem; }
        @media (min-width: 1024px) { .header-link { cursor: pointer; } .header-link:hover { opacity: 0.7; } }

        /* Setup Screen */
        #setupScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 80%;
            width: 90%;
            max-width: 400px;
        }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .player-choice {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 8px;
            background: var(--bg);
            border-radius: 12px;
            font-weight: 600;
        }

        input[type="checkbox"] { transform: scale(1.5); }

        /* Game Screen */
        #gameScreen { 
            display: none; 
            width: 100%; 
            height: calc(100vh - 50px); 
            padding: 5px; 
            flex-direction: column; 
        }

        .table-container {
            background: var(--surface);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            flex-grow: 1;
            display: flex;
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; height: 100%; }

        th, td { border-bottom: 1px solid var(--border); vertical-align: middle; padding: 0; }

        .name-cell { font-size: 0.7rem; font-weight: 800; color: var(--text-secondary); padding-top: 5px; }
        .total-score { font-size: 1.1rem; font-weight: 900; color: var(--accent); padding-bottom: 5px; }

        .target-col {
            width: 45px;
            font-weight: 900;
            background: var(--text-primary);
            color: var(--bg);
            font-size: 1.1rem;
        }

        .hit-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-primary);
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .hit-btn.closed { background: var(--accent); color: white; border: none; }
        .points-label { font-size: 0.7rem; color: var(--primary); font-weight: 700; height: 12px; }

        #winPopup {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center;
        }

        .win-box {
            background: var(--surface); padding: 30px; border-radius: 32px;
            text-align: center; width: 80%; border: 1px solid var(--border);
        }

        .main-btn {
            background: var(--primary); color: white; border: none; padding: 15px;
            border-radius: 16px; font-size: 1rem; font-weight: 700; cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="index.html" class="header-link"><h1>CRICKET</h1></a>

    <div id="setupScreen">
        <div class="card">
            <h2 style="font-size:1rem; margin-top:0">Wer spielt mit?</h2>
            <div id="playerList">
                <label class="player-choice"><input type="checkbox" value="Beate" checked> Beate</label>
                <label class="player-choice"><input type="checkbox" value="Michael" checked> Michael</label>
                <label class="player-choice"><input type="checkbox" value="Niclas" checked> Niclas</label>
                <label class="player-choice"><input type="checkbox" value="Fabian" checked> Fabian</label>
                <label class="player-choice"><input type="checkbox" value="Sally" checked> Sally</label>
            </div>
            <button class="main-btn" style="width:100%; margin-top:15px;" onclick="startGame()">SPIEL STARTEN</button>
        </div>
    </div>

    <div id="gameScreen">
        <div class="table-container">
            <table>
                <thead>
                    <tr id="headerNames">
                        <th class="target-col" rowspan="2">🎯</th>
                        </tr>
                    <tr id="headerScores">
                        </tr>
                </thead>
                <tbody id="gameBody"></tbody>
            </table>
        </div>
        <p onclick="confirmReset()" style="text-align:center; color:var(--text-secondary); margin: 5px; font-size:0.7rem;">Reset</p>
    </div>

    <div id="winPopup">
        <div class="win-box">
            <h1 id="winnerName" style="font-size:3rem; color:var(--accent)">---</h1>
            <p style="color:var(--text-secondary)">hat gewonnen!</p>
            <button class="main-btn" style="width:100%" onclick="location.reload()">NEUSTART</button>
        </div>
    </div>

    <script>
        const nameMapping = {
            "Beate": "BGL", "Michael": "MG", "Niclas": "NG", "Fabian": "FG", "Sally": "SH"
        };
        const targets = [20, 19, 18, 17, 16, 15, 25];
        let activePlayers = [];
        let gameState = JSON.parse(localStorage.getItem('dartsCricketState')) || null;

        function startGame() {
            if(!gameState) {
                const checkboxes = document.querySelectorAll('#playerList input:checked');
                activePlayers = Array.from(checkboxes).map(cb => cb.value);
                if(activePlayers.length === 0) return alert("Wähle mind. einen Spieler");
                
                gameState = { players: activePlayers, data: {} };
                targets.forEach(t => {
                    activePlayers.forEach((_, pIdx) => {
                        gameState.data[`${t}-${pIdx}`] = { hits: 0, points: 0 };
                    });
                });
            }
            renderBoard();
        }

        function renderBoard() {
            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            
            const hNames = document.getElementById('headerNames');
            const hScores = document.getElementById('headerScores');
            const body = document.getElementById('gameBody');
            
            hNames.innerHTML = '<th class="target-col" rowspan="2">🎯</th>';
            hScores.innerHTML = '';
            body.innerHTML = '';

            gameState.players.forEach((p, i) => {
                hNames.innerHTML += `<th class="name-cell">${nameMapping[p] || p}</th>`;
                hScores.innerHTML += `<th id="total-${i}" class="total-score">0</th>`;
            });

            targets.forEach(t => {
                let row = `<tr><td class="target-col">${t === 25 ? 'B' : t}</td>`;
                gameState.players.forEach((_, pIdx) => {
                    const key = `${t}-${pIdx}`;
                    const cell = gameState.data[key];
                    row += `<td onclick="registerHit(${t}, ${pIdx})">
                        <div class="points-label">${cell.points > 0 ? '+' + cell.points : ''}</div>
                        <div class="hit-btn ${cell.hits >= 3 ? 'closed' : ''}">${getSym(cell.hits)}</div>
                    </td>`;
                });
                body.innerHTML += row + `</tr>`;
            });
            updateScores();
        }

        function getSym(h) {
            if (h === 1) return "/";
            if (h === 2) return "X";
            if (h >= 3) return "⦻";
            return "";
        }

        function registerHit(target, pIdx) {
            const key = `${target}-${pIdx}`;
            const cell = gameState.data[key];
            if (cell.hits < 3) {
                cell.hits++;
            } else {
                const othersOpen = gameState.players.some((_, i) => gameState.data[`${target}-${i}`].hits < 3);
                if (othersOpen) cell.points += target;
            }
            localStorage.setItem('dartsCricketState', JSON.stringify(gameState));
            renderBoard();
            checkWinner();
        }

        function updateScores() {
            gameState.players.forEach((_, pIdx) => {
                let sum = 0;
                targets.forEach(t => sum += gameState.data[`${t}-${pIdx}`].points);
                document.getElementById(`total-${pIdx}`).innerText = sum;
            });
        }

        function checkWinner() {
            gameState.players.forEach((_, pIdx) => {
                const allClosed = targets.every(t => gameState.data[`${t}-${pIdx}`].hits >= 3);
                const scores = gameState.players.map((_, i) => targets.reduce((s, t) => s + gameState.data[`${t}-${i}`].points, 0));
                const currentScore = scores[pIdx];
                const maxScore = Math.max(...scores);

                if (allClosed && currentScore === maxScore) {
                    document.getElementById('winnerName').innerText = gameState.players[pIdx];
                    document.getElementById('winPopup').style.display = 'flex';
                    localStorage.removeItem('dartsCricketState');
                }
            });
        }

        function confirmReset() {
            if(confirm("Spiel zurücksetzen?")) {
                localStorage.removeItem('dartsCricketState');
                location.reload();
            }
        }

        if(localStorage.getItem('dartsCricketState')) {
            gameState = JSON.parse(localStorage.getItem('dartsCricketState'));
            startGame();
        }
    </script>
</body>
</html>
