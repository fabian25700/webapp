<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Statistiken</title>
    <style>
        :root {
            --accent: #e67e22;
            --accent-soft: rgba(230, 126, 34, 0.1);
            --success: #27ae60;
            --success-soft: rgba(39, 174, 96, 0.1);
            --danger: #e74c3c;
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #2d3f55;
                --border-light: #253347;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg);
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            border-bottom: 1px solid var(--border-light);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        .header-top { display: flex; align-items: center; gap: 12px; }
        
        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border);
            text-decoration: none; color: var(--text-primary); box-shadow: var(--shadow);
            font-size: 1.1rem;
        }

        header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; }
        .cloud-status { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }

        main { padding: 16px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

        /* KPI Grid */
        .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .kpi-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
            padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px;
        }
        .kpi-value { font-size: 1.6rem; font-weight: 800; color: var(--text-primary); }
        .kpi-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }

        /* Section Block */
        .section-block {
            background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
            padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
        }
        .section-title { font-weight: 800; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }

        /* Wochen-Matrix */
        .matrix-grid { display: flex; flex-direction: column; gap: 10px; }
        .matrix-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .matrix-label { font-size: 0.8rem; font-weight: 600; width: 85px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .matrix-cells { display: flex; gap: 6px; flex: 1; justify-content: flex-end; }
        .matrix-cell { width: 20px; height: 20px; border-radius: 6px; background: var(--border-light); border: 1px solid var(--border); position: relative; transition: all 0.2s; }
        .matrix-cell.ja { background: var(--success); border-color: var(--success); }
        .matrix-cell.nein { background: var(--danger); border-color: var(--danger); opacity: 0.3; }
        
        .days-header { display: flex; margin-bottom: -4px; padding-left: 93px; }
        .day-label { font-size: 0.55rem; font-weight: 700; color: var(--text-secondary); text-align: center; width: 20px; margin-right: 6px; text-transform: uppercase; }

        /* Routine Listen Performance */
        .perf-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
        .perf-item:last-child { border-bottom: none; padding-bottom: 0; }
        .perf-info { display: flex; align-items: center; gap: 10px; }
        .perf-icon { font-size: 1rem; }
        .perf-name { font-size: 0.9rem; font-weight: 700; }
        .perf-bar-wrapper { display: flex; align-items: center; gap: 12px; width: 120px; }
        .perf-bar-bg { flex: 1; height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; }
        .perf-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
        .perf-pct { font-size: 0.75rem; font-weight: 700; width: 32px; text-align: right; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <a href="javascript:history.back()" class="back-btn">&larr;</a>
        <h1>Statistiken</h1>
        <div class="cloud-status" id="cloud-info">Lade Daten...</div>
    </div>
</header>

<main>
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-value" id="kpi-streak">-</div>
            <div class="kpi-label">Aktueller Streak</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value" id="kpi-rate">-</div>
            <div class="kpi-label">Erfüllung (Gesamt)</div>
        </div>
    </div>

    <div class="section-block">
        <div class="section-title">7-Tage Konsistenz Matrix</div>
        <div class="matrix-grid">
            <div class="days-header" id="matrix-days">
                </div>
            <div id="matrix-rows-container" style="display: flex; flex-direction: column; gap: 10px;">
                </div>
        </div>
    </div>

    <div class="section-block">
        <div class="section-title">Routine Auswertung</div>
        <div id="routine-performance-container">
            </div>
    </div>
</main>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvzXJ9VesApgA0RPJ_cnNrfIPYiYIPjB9FQlbITXg3HRcoJPBDlBVHajY4dxKjluoRiQ/exec";
    
    // Icons Mapping passend zur index.html
    const routineIcons = {
        "Morgenroutine": "☀️",
        "Sportroutine": "🏃‍♂️",
        "Gesundheitsroutine": "🥗",
        "Fokusroutine": "🧠",
        "Abendroutine": "🌙",
        "Schlafroutine": "🛌",
        "TwoDayRule": "⚡"
    };

    function fetchStats() {
        fetch(GOOGLE_SCRIPT_URL, { method: "GET", redirect: "follow" })
            .then(res => res.json())
            .then(data => {
                document.getElementById('cloud-info').textContent = "Cloud Live ✓";
                
                // Da wir das gesamte Sheet auslesen wollen, nutzen wir die Struktur von doGet().
                // Um einen 7-Tage-Trend sauber anzuzeigen und KPIs zu berechnen, aggregieren wir die Daten
                renderDashboard(data);
            })
            .catch(err => {
                document.getElementById('cloud-info').textContent = "Fehler";
                console.error(err);
            });
    }

    function renderDashboard(data) {
        // Da die doGet-Methode die letzten drei Einträge als heute, gestern, vorgestern liefert,
        // bauen wir daraus die Logik. Für eine flexiblere Struktur mappen wir die Daten hier direkt:
        const stages = ['vorgestern', 'gestern', 'heute'];
        const routineKeys = Object.keys(data.heute || {});

        if (routineKeys.length === 0) return;

        // 1. Tag-Labels generieren (V, G, H)
        const daysHeader = document.getElementById('matrix-days');
        daysHeader.innerHTML = `<div class="day-label">V</div><div class="day-label">G</div><div class="day-label">H</div>`;

        // 2. Matrix Zeilen aufbauen
        const rowsContainer = document.getElementById('matrix-rows-container');
        rowsContainer.innerHTML = '';

        // Berechnungs-Hilfen für KPIs
        let totalChecks = 0;
        let successfulChecks = 0;
        let currentStreak = 0;

        // Prüfen des heutigen und gestrigen globalen Streaks
        let globalHeute = Object.values(data.heute).every(v => v.toLowerCase() === 'ja') || Object.values(data.heute).filter(v => v.toLowerCase() === 'ja').length >= 5;
        let globalGestern = Object.values(data.gestern).every(v => v.toLowerCase() === 'ja') || Object.values(data.gestern).filter(v => v.toLowerCase() === 'ja').length >= 5;
        let globalVorgestern = Object.values(data.vorgestern).every(v => v.toLowerCase() === 'ja') || Object.values(data.vorgestern).filter(v => v.toLowerCase() === 'ja').length >= 5;

        if (globalHeute) currentStreak++;
        if (globalHeute && globalGestern) currentStreak++;
        if (globalHeute && globalGestern && globalVorgestern) currentStreak++;

        routineKeys.forEach(routine => {
            let routineSuccessCount = 0;
            
            let cellsHtml = stages.map(stage => {
                const status = (data[stage] && data[stage][routine]) ? data[stage][routine].toLowerCase() : 'nein';
                totalChecks++;
                if (status === 'ja') {
                    successfulChecks++;
                    routineSuccessCount++;
                }
                return `<div class="matrix-cell ${status}"></div>`;
            }).join('');

            // Zeile einfügen
            rowsContainer.innerHTML += `
                <div class="matrix-row">
                    <div class="matrix-label">${routine}</div>
                    <div class="matrix-cells">${cellsHtml}</div>
                </div>
            `;

            // 3. Performance Balken einfügen
            const pct = Math.round((routineSuccessCount / stages.length) * 100);
            const icon = routineIcons[routine] || "🎯";
            
            document.getElementById('routine-performance-container').innerHTML += `
                <div class="perf-item">
                    <div class="perf-info">
                        <span class="perf-icon">${icon}</span>
                        <span class="perf-name">${routine}</span>
                    </div>
                    <div class="perf-bar-wrapper">
                        <div class="perf-bar-bg"><div class="perf-bar-fill" style="width: ${pct}%"></div></div>
                        <span class="perf-pct">${pct}%</span>
                    </div>
                </div>
            `;
        });

        // 4. KPIs setzen
        document.getElementById('kpi-streak').textContent = `${currentStreak} Tage`;
        const totalRate = totalChecks > 0 ? Math.round((successfulChecks / totalChecks) * 100) : 0;
        document.getElementById('kpi-rate').textContent = `${totalRate}%`;
    }

    window.onload = fetchStats;
</script>
</body>
</html>
