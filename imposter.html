<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imposter Game</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --primary: #2ecc71;
            --accent: #D97706;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.95);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: rgba(51, 65, 85, 0.8);
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 20px 0; font-weight: 800; color: var(--accent); font-size: 1.5rem; letter-spacing: 0.1em; }

        .container {
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 80%;
        }

        .card {
            background: var(--surface);
            padding: 30px;
            border-radius: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-primary);
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
        }

        .main-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }

        .main-btn:active { transform: scale(0.98); }

        .reveal-btn {
            background: var(--accent);
            user-select: none;
            -webkit-user-select: none;
            margin: 20px 0;
        }

        .word-box {
            background: var(--bg);
            padding: 25px;
            border-radius: 16px;
            margin: 20px 0;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--accent);
            display: none;
            border: 2px dashed var(--accent);
        }

        .player-info {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .result-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 20px;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <h1>IMPOSTER</h1>

    <div class="container">
        <div id="setupScreen" class="card">
            <h2 style="font-size: 1.1rem; margin-top: 0;">Spieler eintragen</h2>
            <input type="text" id="playerInput" class="input-field" value="Beate, Michael, Niclas, Fabian, Sally">
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 20px;">Namen mit Komma trennen</p>
            <button class="main-btn" onclick="initGame()">SPIEL STARTEN</button>
        </div>

        <div id="gameScreen" class="card" style="display:none;">
            <div id="currentPlayer" class="player-info">---</div>
            <p>Halte den Button gedrückt, um dein Wort zu sehen!</p>
            
            <button class="main-btn reveal-btn" 
                onmousedown="showWord()" onmouseup="hideWord()" 
                ontouchstart="showWord()" ontouchend="hideWord()">
                WORT ANZEIGEN
            </button>

            <div id="wordDisplay" class="word-box">---</div>

            <button id="nextBtn" class="main-btn" style="display:none; background: var(--text-primary);" onclick="nextStep()">
                VERSTANDEN
            </button>
            <p class="footer-note">Achte darauf, dass keiner zuschaut!</p>
        </div>

        <div id="resultScreen" class="card" style="display:none;">
            <h2 style="margin-top:0">Diskussion!</h2>
            <p>Beschreibt euer Wort mit nur einem Begriff. Der Imposter versucht zu tarnen.</p>
            <button class="main-btn" onclick="revealImposter()">WER WAR ES?</button>
            <div id="imposterResult" class="result-text"></div>
            <button class="main-btn" style="margin-top:30px; background: var(--text-secondary);" onclick="location.reload()">NEUE RUNDE</button>
        </div>
    </div>

    <script>
        const wordPairs = [
            ["Apfel", "Birne"], ["Auto", "LKW"], ["Strand", "Pool"],
            ["Kaffee", "Tee"], ["Hund", "Wolf"], ["Pizza", "Pasta"],
            ["Flugzeug", "Hubschrauber"], ["Fahrrad", "Motorrad"],
            ["Sonne", "Mond"], ["Berlin", "München"], ["Fußball", "Handball"]
        ];

        let players = [];
        let roles = [];
        let curIdx = 0;
        let imposterName = "";

        function initGame() {
            const input = document.getElementById('playerInput').value;
            players = input.split(',').map(s => s.trim()).filter(s => s !== "");
            
            if(players.length < 3) return alert("Ihr braucht mindestens 3 Spieler!");

            // Zufallswort-Paar
            const pair = wordPairs[Math.floor(Math.random() * wordPairs.length)];
            const normalWord = pair[0];
            const imposterWord = pair[1];

            // Imposter bestimmen
            const imposterIdx = Math.floor(Math.random() * players.length);
            imposterName = players[imposterIdx];

            // Rollen zuweisen
            roles = players.map((p, i) => i === imposterIdx ? imposterWord : normalWord);

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            updateUI();
        }

        function updateUI() {
            document.getElementById('currentPlayer').innerText = players[curIdx];
            document.getElementById('wordDisplay').innerText = roles[curIdx];
            document.getElementById('wordDisplay').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function showWord() {
            document.getElementById('wordDisplay').style.display = 'block';
        }

        function hideWord() {
            document.getElementById('wordDisplay').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextStep() {
            curIdx++;
            if(curIdx < players.length) {
                updateUI();
            } else {
                document.getElementById('gameScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';
            }
        }

        function revealImposter() {
            document.getElementById('imposterResult').innerText = "Der Imposter war: " + imposterName;
        }
    </script>
</body>
</html>
