<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imposter Game</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --primary: #2ecc71;
            --accent: #D97706;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.95);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: rgba(51, 65, 85, 0.8);
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-link { text-decoration: none; color: inherit; cursor: default; }
        h1 { margin: 20px 0; font-weight: 800; color: var(--accent); font-size: 1.5rem; letter-spacing: 0.1em; cursor: pointer; }

        .container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 85%;
        }

        .card {
            background: var(--surface);
            padding: 25px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .menu-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 10px;
            background: var(--bg);
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid transparent;
            text-align: left;
        }

        .main-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .main-btn:active { transform: scale(0.98); }

        .player-info {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .word-box {
            background: var(--bg);
            padding: 30px;
            border-radius: 20px;
            margin: 20px 0;
            font-size: 2rem;
            font-weight: 900;
            color: var(--accent);
            border: 3px solid var(--accent);
            display: none;
        }

        .word-hidden-placeholder {
            background: var(--border);
            padding: 30px;
            border-radius: 20px;
            margin: 20px 0;
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .result-text {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--primary);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <a href="index.html" class="header-link"><h1>IMPOSTER</h1></a>

    <div class="container">
        <div id="setupScreen" class="card">
            <h2 style="font-size:1.1rem; margin-top:0">Spieler auswählen</h2>
            <div id="pList">
                <label class="menu-option"><input type="checkbox" value="Beate" checked> Beate</label>
                <label class="menu-option"><input type="checkbox" value="Michael" checked> Michael</label>
                <label class="menu-option"><input type="checkbox" value="Niclas" checked> Niclas</label>
                <label class="menu-option"><input type="checkbox" value="Fabian" checked> Fabian</label>
                <label class="menu-option"><input type="checkbox" value="Sally" checked> Sally</label>
            </div>
            <button class="main-btn" onclick="startGame()">START</button>
        </div>

        <div id="gameScreen" class="card" style="display:none;">
            <div id="currentPlayer" class="player-info">---</div>
            
            <div id="placeholder" class="word-hidden-placeholder">Wort ist versteckt</div>
            <div id="wordDisplay" class="word-box">---</div>

            <button id="toggleBtn" class="main-btn" style="background: var(--accent);" onclick="toggleWord()">WORT ANZEIGEN</button>
            
            <button id="confirmBtn" class="main-btn" style="display:none; background: var(--text-primary);" onclick="nextPlayer()">VERSTANDEN (NÄCHSTER)</button>
        </div>

        <div id="discussScreen" class="card" style="display:none;">
            <h2 style="margin-top:0">Diskussion!</h2>
            <p style="color: var(--text-secondary)">Beschreibt eure Wörter der Reihe nach.</p>
            <button class="main-btn" onclick="showImposter()">IMPOSTER ENTLARVEN</button>
            <div id="finalResult" class="result-text"></div>
            <button class="main-btn" style="background: var(--text-secondary); margin-top: 20px;" onclick="location.reload()">NEUSTART</button>
        </div>
    </div>

    <script>
        const wordPairs = [
            ["Apfel", "Birne"], ["Auto", "LKW"], ["Strand", "Pool"],
            ["Kaffee", "Tee"], ["Hund", "Wolf"], ["Pizza", "Pasta"],
            ["Sonne", "Mond"], ["Berlin", "München"], ["Fußball", "Handball"]
        ];

        let players = [];
        let roles = [];
        let curIdx = 0;
        let imposterName = "";
        let isShowing = false;

        function startGame() {
            const sel = document.querySelectorAll('#pList input:checked');
            players = Array.from(sel).map(c => c.value);
            
            if(players.length < 3) return alert("Wähle mindestens 3 Spieler aus!");

            const pair = wordPairs[Math.floor(Math.random() * wordPairs.length)];
            const normalWord = pair[0];
            const imposterWord = pair[1];

            const imposterIdx = Math.floor(Math.random() * players.length);
            imposterName = players[imposterIdx];

            roles = players.map((p, i) => i === imposterIdx ? imposterWord : normalWord);

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            renderPlayer();
        }

        function renderPlayer() {
            isShowing = false;
            document.getElementById('currentPlayer').innerText = players[curIdx];
            document.getElementById('wordDisplay').innerText = roles[curIdx];
            document.getElementById('wordDisplay').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            document.getElementById('toggleBtn').innerText = "WORT ANZEIGEN";
            document.getElementById('toggleBtn').style.display = 'block';
            document.getElementById('confirmBtn').style.display = 'none';
        }

        function toggleWord() {
            isShowing = !isShowing;
            const w = document.getElementById('wordDisplay');
            const p = document.getElementById('placeholder');
            const b = document.getElementById('toggleBtn');
            const c = document.getElementById('confirmBtn');

            if(isShowing) {
                w.style.display = 'block';
                p.style.display = 'none';
                b.innerText = "WORT VERDECKEN";
                c.style.display = 'none';
            } else {
                w.style.display = 'none';
                p.style.display = 'block';
                b.style.display = 'none'; // Verstecke den Toggle-Button, damit man nur noch bestätigen kann
                c.style.display = 'block';
            }
        }

        function nextPlayer() {
            curIdx++;
            if(curIdx < players.length) {
                renderPlayer();
            } else {
                document.getElementById('gameScreen').style.display = 'none';
                document.getElementById('discussScreen').style.display = 'block';
            }
        }

        function showImposter() {
            document.getElementById('finalResult').innerText = "Imposter: " + imposterName;
        }
    </script>
</body>
</html>
