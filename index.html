<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Startseite</title>
    <script src="daten.js"></script>
    <style>
        :root {
            --bg: linear-gradient(135deg, #e0e6ed 0%, #f4f6f9 100%);
            --surface: rgba(255, 255, 255, 0.45);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.06);
            --bubble-shadow-hover: 0 12px 40px 0 rgba(31, 38, 135, 0.12);
            --highlight: radial-gradient(circle, rgba(243, 156, 18, 0.25) 0%, rgba(243, 156, 18, 0) 70%);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                --surface: rgba(30, 41, 59, 0.45);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --glass-border: rgba(255, 255, 255, 0.08);
                --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
                --bubble-shadow-hover: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
                --highlight: radial-gradient(circle, rgba(243, 156, 18, 0.3) 0%, rgba(243, 156, 18, 0) 70%);
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: calc(env(safe-area-inset-top) + 24px) 20px 14px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }

        .header-title {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.06em;
            color: var(--text-primary);
        }

        main {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bubble-arena {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bubble-wrapper {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* Hochwertiges Milchglas-Design ohne harten Rahmen */
        .bubble {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-align: center;
            width: var(--bubble-size, 100px);
            height: var(--bubble-size, 100px);
        }

        /* Subtile, rahmenlose Aura für die Top-Favoriten */
        .bubble-wrapper.top-favorit::before {
            content: '';
            position: absolute;
            width: calc(var(--bubble-size, 100px) * 1.5);
            height: calc(var(--bubble-size, 100px) * 1.5);
            background: var(--highlight);
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }

        .bubble:active { 
            transform: scale(0.93) !important; 
            background: rgba(255, 255, 255, 0.6);
        }

        @media (prefers-color-scheme: dark) {
            .bubble:active {
                background: rgba(30, 41, 59, 0.6);
            }
        }

        @media (hover: hover) {
            .bubble-wrapper:hover .bubble {
                background: rgba(255, 255, 255, 0.55);
                box-shadow: var(--bubble-shadow-hover);
                transform: translateY(-4px);
            }
            @media (prefers-color-scheme: dark) {
                .bubble-wrapper:hover .bubble {
                    background: rgba(30, 41, 59, 0.55);
                }
            }
            .bubble-wrapper:hover {
                z-index: 50;
            }
        }

        .bubble-icon {
            font-size: calc(var(--bubble-size, 100px) * 0.26);
            line-height: 1;
            margin-bottom: 4px;
        }

        .bubble-title {
            font-weight: 700;
            color: var(--text-primary);
            font-size: calc(var(--bubble-size, 100px) * 0.12);
            padding: 0 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">FABIANS APP</div>
    </header>

    <main>
        <div id="bubble-arena">
        </div>
    </main>

    <script>
        const APPS = [
            { id: "reisen", title: "Reisen", icon: "✈️", url: "reise_stats.html" },
            { id: "habits", title: "Habits", icon: "📊", url: "habits.html" },
            { id: "alkohol", title: "Alkohol", icon: "🍺", url: "alkohol.html" },
            { id: "alltag", title: "Alltag", icon: "🏠", url: "alltag.html" },
            { id: "gastspiel", title: "Gastspiel", icon: "⚽", url: "gastspiel2.html" },
            { id: "kcrakete", title: "KC Rakete", icon: "🚀", url: "https://bit.ly/m/kcrakete" },
            { id: "test", title: "Test", icon: "🧪", url: "test.html" },
            { id: "test2", title: "Test 2", icon: "⚗️", url: "test2.html" },
            { id: "finanzen", title: "Finanzen", icon: "💰", url: "finanzen.html" },
            { id: "spiele", title: "Spiele", icon: "🎮", url: "spiele.html" },
            { id: "familie", title: "Familie", icon: "🧑‍🧑‍🧒‍🧒", url: "familie.html" },
            { id: "familie", title: "Familie", icon: "🎧", url: "pomo.html" },
            { id: "hopping", title: "Hopping", icon: "⚽", url: "hopping.html" }
        ];

        function getStats() {
            const defaults = {};
            APPS.forEach(app => { defaults[app.id] = { count: 0, lastUsed: 0 }; });
            const stored = localStorage.getItem("fabians_app_stats");
            return stored ? JSON.parse(stored) : defaults;
        }

        function trackClick(id) {
            const stats = getStats();
            if (stats[id]) {
                stats[id].count += 1;
                stats[id].lastUsed = Date.now();
                localStorage.setItem("fabians_app_stats", JSON.stringify(stats));
            }
        }

        function renderMenu() {
            const stats = getStats();
            const now = Date.now();
            const arena = document.getElementById("bubble-arena");
            arena.innerHTML = "";

            const appsWithScores = APPS.map(app => {
                const stat = stats[app.id] || { count: 0, lastUsed: 0 };
                const recency = stat.lastUsed ? (1 / (now - stat.lastUsed + 1)) : 0;
                const score = (stat.count * 0.7) + (recency * 1000000 * 0.3);
                return { ...app, score };
            });

            const sortedApps = [...appsWithScores].sort((a, b) => b.score - a.score);
            
            const scores = sortedApps.map(a => a.score);
            const maxScore = Math.max(...scores);
            const minScore = Math.min(...scores);

            const isMobile = window.innerWidth < 768;
            const isPortrait = window.innerHeight > window.innerWidth;

            const baseSize = isMobile ? 96 : 115;

            const stretchX = isPortrait ? 0.75 : 1.35;
            const stretchY = isPortrait ? 1.45 : 0.75;

            const centerRadius = isMobile ? 65 : 95;
            const outerRadius = isMobile ? 155 : 230;

            let centerAngles = [45, 135, 225, 315].map(a => a + (Math.random() * 15 - 7.5));
            let outerAngles = [0, 45, 90, 135, 180, 225, 270, 315].map(a => a + (Math.random() * 20 - 10));

            centerAngles = centerAngles.sort(() => Math.random() - 0.5);
            outerAngles = outerAngles.sort(() => Math.random() - 0.5);

            const bubblesData = sortedApps.map((app, index) => {
                const isTopFour = index < 4;

                let factor = 1.0;
                if (maxScore !== minScore) {
                    factor = 0.85 + ((app.score - minScore) / (maxScore - minScore)) * 0.55;
                } else if (maxScore > 0) {
                    factor = 1.15;
                }

                const finalSize = Math.round(baseSize * factor);

                let posX, posY;
                if (isTopFour) {
                    const angleRad = (centerAngles[index] * Math.PI) / 180;
                    posX = Math.cos(angleRad) * centerRadius * stretchX;
                    posY = Math.sin(angleRad) * centerRadius * stretchY;
                } else {
                    const angleRad = (outerAngles[(index - 4) % outerAngles.length] * Math.PI) / 180;
                    posX = Math.cos(angleRad) * outerRadius * stretchX;
                    posY = Math.sin(angleRad) * outerRadius * stretchY;
                }

                return {
                    app,
                    isTopFour,
                    size: finalSize,
                    radius: finalSize / 2,
                    x: posX,
                    y: posY
                };
            });

            for (let step = 0; step < 12; step++) {
                for (let i = 0; i < bubblesData.length; i++) {
                    for (let j = i + 1; j < bubblesData.length; j++) {
                        const b1 = bubblesData[i];
                        const b2 = bubblesData[j];

                        const dx = b2.x - b1.x;
                        const dy = b2.y - b1.y;
                        const dist = Math.hypot(dx, dy);
                        const minDist = b1.radius + b2.radius + 8;

                        if (dist < minDist) {
                            const overlap = minDist - dist;
                            const forceX = (dx / (dist || 1)) * (overlap * 0.5);
                            const forceY = (dy / (dist || 1)) * (overlap * 0.5);

                            b1.x -= forceX;
                            b1.y -= forceY;
                            b2.x += forceX;
                            b2.y += forceY;
                        }
                    }
                }
            }

            bubblesData.forEach(b => {
                const wrapper = document.createElement("div");
                wrapper.className = "bubble-wrapper";
                if (b.isTopFour) wrapper.classList.add("top-favorit");
                wrapper.style.transform = `translate(${b.x}px, ${b.y}px)`;

                const bubble = document.createElement("a");
                bubble.href = b.app.url;
                bubble.className = "bubble";
                bubble.style.setProperty("--bubble-size", `${b.size}px`);

                bubble.addEventListener("click", () => trackClick(b.app.id));

                bubble.innerHTML = `
                    <span class="bubble-icon">${b.app.icon}</span>
                    <span class="bubble-title">${b.app.title}</span>
                `;

                wrapper.appendChild(bubble);
                arena.appendChild(wrapper);
            });
        }

        window.addEventListener("DOMContentLoaded", renderMenu);
        window.addEventListener("resize", renderMenu);
    </script>
</body>
</html>
