<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pomodoro</title>
    <style>
        :root {
            --accent: #e67e22;
            --accent-soft: rgba(230, 126, 34, 0.1);
            --success: #27ae60;
            --success-soft: rgba(39, 174, 96, 0.1);
            --danger: #e74c3c;
            --danger-soft: rgba(231, 76, 60, 0.3);
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #2d3f55;
                --border-light: #253347;
            }
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        header {
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0;
            z-index: 100;
            background: var(--bg);
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header-top { 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }
        
        .header-left { 
            display: flex; 
            align-items: center; 
            position: absolute;
            left: 0;
            z-index: 10;
        }

        .back-container { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            text-decoration: none; 
            color: var(--text-primary); 
        }

        .back-btn {
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 32px; 
            height: 32px; 
            border-radius: 9px;
            background: var(--surface); 
            border: 1px solid var(--border);
            color: var(--text-primary); 
            box-shadow: var(--shadow);
            flex-shrink: 0; 
            font-size: 0.9rem;
            line-height: 1;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-primary);
        }

        /* Zweistufiger Toggle Switch */
        .mode-toggle-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .mode-toggle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        main {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 95px;
        }

        .selection-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .rank-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .rank-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rank-btn:active {
            transform: scale(0.96);
        }

        .rank-num {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .rank-penalty {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .rank-btn.p1 { border-color: rgba(39, 174, 96, 0.4); }
        .rank-btn.p1 .rank-num { color: var(--success); }
        
        .rank-btn.p4 { border-color: rgba(231, 76, 60, 0.4); }
        .rank-btn.p4 .rank-num { color: var(--danger); }

        .rank-btn.full-width {
            grid-column: span 2;
        }

        /* Lock Screen Overlay */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        #lock-screen.active {
            display: flex;
        }

        .lock-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .badge-lock {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            margin: 4px 0;
        }

        .todo-callout {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--success);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .congrats-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="header-left">
            <a href="index.html" class="back-container">
                <div class="back-btn">&larr;</div>
            </a>
        </div>
        <div class="header-title">Pomodoro</div>
    </div>
    
    <!-- Zweistufiger Schalter -->
    <div class="mode-toggle-group">
        <div class="mode-toggle-container">
            <button id="toggle-cr" class="toggle-btn active" onclick="setSystem('CR')">CR</button>
            <button id="toggle-copero" class="toggle-btn" onclick="setSystem('Copero')">Copero</button>
        </div>
        <div class="mode-toggle-container">
            <button id="toggle-work" class="toggle-btn active" onclick="setCategory('WORK')">Arbeitszeit</button>
            <button id="toggle-free" class="toggle-btn" onclick="setCategory('FREE')">Freizeit</button>
        </div>
    </div>
</header>

<main>
    <div id="selection-card" class="selection-card">
        <div class="card-title" id="card-title-text">Clash Royale Platzierung</div>
        <div class="rank-grid" id="grid-container">
            <!-- Dynamisch generierte Buttons -->
        </div>
    </div>
</main>

<div id="lock-screen">
    <div class="lock-container">
        <div class="badge-lock" id="lock-badge">🔒 Focus Mode Active</div>
        <div class="timer-display" id="timer">00:00</div>
        <div class="todo-callout" id="todo-text">🚀 Jetzt ToDos rocken!</div>
    </div>
</div>

<script>
    /* ==========================================================================
       ZENTRALE KONFIGURATION DER 4 MÖGLICHKEITEN
       ========================================================================== */
    const CONFIG = {
        CR: {
            WORK: {
                title: "Clash Royale — Arbeitszeit",
                items: [
                    { label: "Platz 1", minutes: 5,  task: "Habit / Aufgabe von dieser Woche", isP1: true },
                    { label: "Platz 2", minutes: 10, task: "Habit / Aufgabe von heute oder morgen" },
                    { label: "Platz 3", minutes: 15, task: "Habit / Aufgabe von heute" },
                    { label: "Platz 4", minutes: 20, task: "Habit / wichtigste Aufgabe von heute", isP4: true }
                ]
            },
            FREE: {
                title: "Clash Royale — Freizeit",
                items: [
                    { label: "Platz 1", minutes: 5,  task: "Freizeit Task", isP1: true },
                    { label: "Platz 2", minutes: 5,  task: "Habit / Aufgabe von dieser Woche" },
                    { label: "Platz 3", minutes: 10, task: "Habit / Aufgabe von heute oder morgen" },
                    { label: "Platz 4", minutes: 15, task: "Habit / Aufgabe von heute", isP4: true }
                ]
            }
        },
        Copero: {
            WORK: {
                title: "Copero Rating — Arbeitszeit",
                items: [
                    { label: "Rating 95-99", seconds: 30, type: "congrats", sub: "Kein Timer", isP1: true, fullWidth: true },
                    { label: "Rating 85-94", minutes: 5,  task: "Habit / Aufgabe von dieser Woche", isP1: true },
                    { label: "Rating 75-84", minutes: 10, task: "Habit / Aufgabe von heute oder morgen" },
                    { label: "Rating 65-74", minutes: 15, task: "Habit / Aufgabe von heute" },
                    { label: "Rating 50-64", minutes: 20, task: "Habit / wichtigste Aufgabe von heute", isP4: true }
                ]
            },
            FREE: {
                title: "Copero Rating — Freizeit",
                items: [
                    { label: "Rating 95-99", seconds: 30, type: "congrats", sub: "Kein Timer", isP1: true, fullWidth: true },
                    { label: "Rating 85-94", minutes: 5,  task: "Freizeit Task", isP1: true },
                    { label: "Rating 75-84", minutes: 5,  task: "Habit / Aufgabe von dieser Woche" },
                    { label: "Rating 65-74", minutes: 10, task: "Habit / Aufgabe von heute oder morgen" },
                    { label: "Rating 50-64", minutes: 15, task: "Habit / Aufgabe von heute", isP4: true }
                ]
            }
        }
    };

    let currentSystem = 'CR';
    let currentCategory = 'WORK';
    let timerInterval = null;

    document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
    });

    function setSystem(sys) {
        currentSystem = sys;
        document.getElementById('toggle-cr').classList.toggle('active', sys === 'CR');
        document.getElementById('toggle-copero').classList.toggle('active', sys === 'Copero');
        renderGrid();
    }

    function setCategory(cat) {
        currentCategory = cat;
        document.getElementById('toggle-work').classList.toggle('active', cat === 'WORK');
        document.getElementById('toggle-free').classList.toggle('active', cat === 'FREE');
        renderGrid();
    }

    function renderGrid() {
        const data = CONFIG[currentSystem][currentCategory];
        document.getElementById('card-title-text').innerText = data.title;

        const grid = document.getElementById('grid-container');
        grid.innerHTML = '';

        data.items.forEach((item, idx) => {
            const btn = document.createElement('div');
            let classes = ['rank-btn'];
            if (item.isP1) classes.push('p1');
            if (item.isP4) classes.push('p4');
            if (item.fullWidth) classes.push('full-width');
            btn.className = classes.join(' ');

            const subText = item.sub ? item.sub : `${item.minutes} Min Sperre`;

            btn.innerHTML = `
                <span class="rank-num">${item.label}</span>
                <span class="rank-penalty">${subText}</span>
            `;

            btn.onclick = () => {
                if (item.type === 'congrats') {
                    startCongrats(item.seconds);
                } else {
                    startLockout(item.minutes, item.task);
                }
            };

            grid.appendChild(btn);
        });
    }

    function startLockout(minutes, task) {
        const endTime = Date.now() + minutes * 60 * 1000;
        localStorage.setItem('pomodoro_end_time', endTime);
        localStorage.setItem('pomodoro_type', 'lockout');
        localStorage.setItem('pomodoro_task', task);
        
        runTimer();
    }

    function startCongrats(seconds) {
        const endTime = Date.now() + seconds * 1000;
        localStorage.setItem('pomodoro_end_time', endTime);
        localStorage.setItem('pomodoro_type', 'congrats');
        
        runTimer();
    }

    function runTimer() {
        const endTime = localStorage.getItem('pomodoro_end_time');
        const type = localStorage.getItem('pomodoro_type');
        if (!endTime) return;

        const lockScreen = document.getElementById('lock-screen');
        const timerDisplay = document.getElementById('timer');
        const todoText = document.getElementById('todo-text');
        const lockBadge = document.getElementById('lock-badge');
        
        lockScreen.classList.add('active');

        if (timerInterval) clearInterval(timerInterval);

        const update = () => {
            const now = Date.now();
            const remainingMs = endTime - now;
            const remainingSeconds = Math.ceil(remainingMs / 1000);

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                localStorage.removeItem('pomodoro_end_time');
                localStorage.removeItem('pomodoro_type');
                localStorage.removeItem('pomodoro_task');
                lockScreen.classList.remove('active');
                document.title = "Pomodoro";
            } else {
                if (type === 'congrats') {
                    lockBadge.innerText = "🎉 Glückwunsch!";
                    timerDisplay.style.display = 'none';
                    todoText.className = "congrats-text";
                    todoText.innerText = "Glückwunsch und spiele erneut mit gleichem Land und tue etwas was dir Spaß macht.";
                    document.title = "Glückwunsch!";
                } else {
                    const task = localStorage.getItem('pomodoro_task') || "🚀 Jetzt ToDos rocken!";
                    lockBadge.innerText = "🔒 Focus Mode Active";
                    timerDisplay.style.display = 'block';
                    todoText.className = "todo-callout";
                    todoText.innerText = task;
                    updateTimerDisplay(remainingSeconds);
                }
            }
        };

        update();
        timerInterval = setInterval(update, 1000);
    }

    function updateTimerDisplay(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        const timeString = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        document.getElementById('timer').innerText = timeString;
        document.title = `(${timeString}) Pomodoro`;
    }

    window.addEventListener('load', () => {
        renderGrid();
        runTimer();
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            runTimer();
        }
    });
</script>

</body>
</html>
