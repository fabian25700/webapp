<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Influencer Rope Cut - Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #f0f2f5; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; width: 100%; text-align: center;
            pointer-events: none; z-index: 10;
        }
        .msg { font-weight: bold; font-size: 1.5rem; color: #4a4a4a; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="msg">Zieh die Maus durch das Seil!</div>
        <div id="status">Füttere den Follower</div>
    </div>

    <script>
        const { Engine, Render, Runner, Composite, Bodies, Constraint, Mouse, Vector } = Matter;

        const engine = Engine.create();
        const world = engine.world;

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#f0f2f5'
            }
        });

        Render.run(render);
        Runner.run(Runner.create(), engine);

        // 1. Das Ziel (Follower)
        const goal = Bodies.circle(window.innerWidth / 2, window.innerHeight - 100, 45, {
            isStatic: true,
            label: 'goal',
            render: { fillStyle: '#ff6b6b' }
        });

        // 2. Das Objekt (Candy/Icon)
        const candy = Bodies.circle(window.innerWidth / 2, 350, 25, {
            restitution: 0.5,
            density: 0.001,
            label: 'candy',
            render: { fillStyle: '#ffd700' }
        });

        // 3. Ein stabileres Seil bauen
        const segments = 10;
        const ropeParts = [];
        let lastBody = null;

        for (let i = 0; i < segments; i++) {
            const isStatic = (i === 0); // Nur das erste Glied ist fest am Himmel
            const segment = Bodies.rectangle(window.innerWidth / 2, 50 + (i * 25), 10, 20, {
                isStatic: isStatic,
                collisionFilter: { group: -1 },
                render: { fillStyle: '#4a4a4a' }
            });
            
            ropeParts.push(segment);
            Composite.add(world, segment);

            if (lastBody) {
                const c = Constraint.create({
                    bodyA: lastBody,
                    bodyB: segment,
                    pointA: { x: 0, y: 10 },
                    pointB: { x: 0, y: -10 },
                    stiffness: 0.7,
                    length: 5,
                    render: { strokeStyle: '#4a4a4a', lineWidth: 4 }
                });
                Composite.add(world, c);
            }
            lastBody = segment;
        }

        // Candy an das letzte Glied hängen
        const finalLink = Constraint.create({
            bodyA: lastBody,
            bodyB: candy,
            pointA: { x: 0, y: 10 },
            stiffness: 0.7,
            render: { strokeStyle: '#4a4a4a', lineWidth: 4 }
        });
        Composite.add(world, [candy, goal, finalLink]);

        // --- CUT LOGIK ---
        const mouse = Mouse.create(render.canvas);

        function checkAndCut() {
            if (mouse.button !== -1 || ('ontouchstart' in window)) {
                const allConstraints = world.constraints;
                for (let i = allConstraints.length - 1; i >= 0; i--) {
                    const c = allConstraints[i];
                    if (!c.bodyA || !c.bodyB) continue;

                    const mousePos = mouse.position;
                    const bodyPos = c.bodyB.position;
                    const dist = Vector.magnitude(Vector.sub(mousePos, bodyPos));

                    if (dist < 30) {
                        Composite.remove(world, c);
                    }
                }
            }
        }

        // Kontinuierliche Prüfung beim Bewegen
        Matter.Events.on(runner, "afterUpdate", checkAndCut);

        // Gewinn-Check
        Matter.Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach(pair => {
                if ((pair.bodyA.label === 'candy' && pair.bodyB.label === 'goal') ||
                    (pair.bodyB.label === 'candy' && pair.bodyA.label === 'goal')) {
                    document.getElementById('status').innerHTML = "<h1 style='color:green'>GEWONNEN!</h1>";
                    setTimeout(() => location.reload(), 1500);
                }
            });
        });

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
