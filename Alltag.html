<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Alltag</title>
    <style>
        :root {
            --accent: #e67e22;
            --accent-soft: rgba(230, 126, 34, 0.1);
            --bg: #f0f2f5;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --surface-2: #162032;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --text-tertiary: #64748b;
                --border: #2d3f55;
                --border-light: #253347;
                --shadow: 0 2px 8px rgba(0,0,0,0.3);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: calc(env(safe-area-inset-bottom) + 32px);
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky; top: 0; z-index: 50;
            background: var(--bg);
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        header h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }

        .date-display { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }

        main { padding: 20px 16px 0; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

        .section-label {
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--text-tertiary); padding: 0 4px;
            margin-top: 16px;
        }

        .nav-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 18px; box-shadow: var(--shadow);
            text-decoration: none; display: flex; align-items: center;
            gap: 14px; padding: 16px 18px; position: relative; overflow: hidden;
            transition: transform 0.12s ease; -webkit-tap-highlight-color: transparent;
        }

        .nav-card:active { transform: scale(0.97); }

        .nav-icon {
            font-size: 1.25rem; width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent-soft); border-radius: 12px;
        }

        .nav-text { flex: 1; }
        .nav-title { font-weight: 700; font-size: 1rem; color: var(--text-primary); }
        .nav-sub { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        .nav-arrow { color: var(--text-tertiary); font-size: 1rem; }

        /* Highlight für aktive Projekte */
        .active-border { border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

    <header>
        <h1>Alltag</h1>
        <div class="date-display" id="current-date"></div>
    </header>

    <main>
        <div class="section-label">Fokus & Leistung</div>

        <a href="reisen.html" class="nav-card">
            <div class="nav-icon">🌎</div>
            <div class="nav-text">
                <div class="nav-title">Reisen</div>
                <div class="nav-sub">Länder, Stats & Abenteuer</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>

        <a href="fitness.html" class="nav-card">
            <div class="nav-icon">🏃‍♂️</div>
            <div class="nav-text">
                <div class="nav-title">Fitness</div>
                <div class="nav-sub">Training & Performance</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>

        <div class="section-label">Management</div>

        <a href="finanzen.html" class="nav-card">
            <div class="nav-icon">📈</div>
            <div class="nav-text">
                <div class="nav-title">Finanzen</div>
                <div class="nav-sub">Asset Management & Cashflow</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>

        <a href="immobilien.html" class="nav-card active-border">
            <div class="nav-icon">🏗️</div>
            <div class="nav-text">
                <div class="nav-title">Projektentwicklung</div>
                <div class="nav-sub">Immobilien & Asset Steuerung</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>

        <div class="section-label">System</div>

        <a href="minimalismus.html" class="nav-card">
            <div class="nav-icon">🌿</div>
            <div class="nav-text">
                <div class="nav-title">Minimalismus</div>
                <div class="nav-sub">Fokus & Ordnung</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>

        <a href="codierung.html" class="nav-card">
            <div class="nav-icon">💻</div>
            <div class="nav-text">
                <div class="nav-title">Systembau</div>
                <div class="nav-sub">Skripte & Automatisierung</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>
    </main>

    <script>
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('de-DE', options);
    </script>
</body>
</html>
