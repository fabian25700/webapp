<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Statistiken</title>
    <style>
        :root {
            --accent: #e67e22;
            --accent-soft: rgba(230, 126, 34, 0.1);
            --success: #27ae60;
            --success-soft: rgba(39, 174, 96, 0.1);
            --danger: #e74c3c;
            --danger-soft: rgba(231, 76, 60, 0.3);
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #2d3f55;
                --border-light: #253347;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg);
            padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
            border-bottom: 1px solid var(--border-light);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        .header-top { display: flex; align-items: center; gap: 12px; }
        
        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 10px;
            background: var(--surface); border: 1px solid var(--border);
            text-decoration: none; color: var(--text-primary); box-shadow: var(--shadow);
            font-size: 1rem;
        }

        header h1 { font-size: 1.1rem; font-weight: 800; flex: 1; }
        .cloud-status { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }

        main { padding: 12px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

        /* KPI Grid */
        .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .kpi-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
            padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; height: 95px;
        }
        .kpi-value { font-size: 1.35rem; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .kpi-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }
        
        /* Tacho KPI Card */
        .gauge-container { position: relative; width: 85px; height: 42px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
        .gauge-arc { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--border-light); border-bottom-color: transparent; border-left-color: transparent; transform: rotate(-45deg); position: absolute; bottom: -38px; }
        .gauge-needle { width: 2px; height: 35px; background: var(--text-primary); position: absolute; bottom: 0; transform-origin: bottom center; transform: rotate(0deg); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .gauge-center { width: 6px; height: 6px; background: var(--text-primary); border-radius: 50%; position: absolute; bottom: -3px; }
        .gauge-labels { display: flex; justify-content: space-between; width: 100%; padding: 0 2px; font-size: 0.55rem; font-weight: 700; color: var(--text-secondary); margin-top: -2px; }

        /* Section Block */
        .section-block {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
            padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
        }
        
        /* Interactive Switch Header */
        .switch-header { display: flex; background: var(--bg); border-radius: 10px; padding: 2px; border: 1px solid var(--border); }
        .switch-tab { flex: 1; text-align: center; font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); padding: 7px 4px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .switch-tab.active { background: var(--surface); color: var(--text-primary); box-shadow: var(--shadow); }

        /* Wochen-Matrix Optimierung gegen Verzerrung */
        .matrix-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .matrix-row { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 32px; }
        .matrix-label { font-size: 0.88rem; font-weight: 700; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
        .matrix-cells { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .matrix-cell { width: 24px; height: 24px; border-radius: 6px; background: var(--border-light); border: 1px solid var(--border); transition: all 0.2s; flex-shrink: 0; }
        .matrix-cell.ja { background: var(--success); border-color: var(--success); }
        .matrix-cell.nein { background: var(--danger-soft); border-color: var(--danger); opacity: 0.3; }
        
        .days-header { display: flex; justify-content: flex-end; gap: 6px; width: 100%; margin-bottom: 2px; height: 16px; align-items: center; }
        .day-label { font-size: 0.6rem; font-weight: 700; color: var(--text-secondary); text-align: center; width: 24px; text-transform: uppercase; flex-shrink: 0; }

        /* Routine Listen Performance */
        .perf-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-light); height: 34px; }
        .perf-item:last-child { border-bottom: none; padding-bottom: 0; }
        .perf-info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .perf-icon { font-size: 0.95rem; flex-shrink: 0; }
        .perf-name { font-size: 0.88rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .perf-bar-wrapper { display: flex; align-items: center; gap: 8px; width: 110px; flex-shrink: 0; }
        .perf-bar-bg { flex: 1; height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; }
        .perf-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
        .perf-pct { font-size: 0.75rem; font-weight: 700; width: 28px; text-align: right; }

        /* Monats/Wochenvergleich */
        .trend-container { display: flex; flex-direction: column; gap: 8px; }
        .trend-row { display: flex; align-items: center; justify-content: space-between; padding: 2px 0; }
        .trend-month-label { font-size: 0.88rem; font-weight: 700; }
        .trend-badge { font-size: 0.7rem; font-weight: 700; padding: 3px 6px; border-radius: 6px; }
        .trend-badge.up { background: var(--success-soft); color: var(--success); }
        .trend-badge.neutral { background: var(--border-light); color: var(--text-secondary); }

        /* Korrelations-Matrix */
        .insight-card { background: var(--bg); border-radius: 10px; border: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
        .insight-title { font-size: 0.82rem; font-weight: 700; }
        .insight-desc { font-size: 0.72rem; color: var(--text-secondary); line-height: 1.3; }
        
        .switch-content { display: none; }
        .switch-content.active { display: flex; flex-direction: column; }

        /* Smartphone-Spezifische Optimierung gegen Umbrüche */
        @media (max-width: 380px) {
            .matrix-label { font-size: 0.78rem; gap: 4px; }
            .perf-name { font-size: 0.78rem; }
            .matrix-cell { width: 20px; height: 20px; border-radius: 5px; }
            .day-label { width: 20px; font-size: 0.55rem; }
            .matrix-cells { gap: 4px; }
            .days-header { gap: 4px; }
            .perf-bar-wrapper { width: 90px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <a href="javascript:history.back()" class="back-btn">&larr;</a>
        <h1>Statistiken</h1>
        <div class="cloud-status" id="cloud-info">Lade Daten...</div>
    </div>
</header>

<main>
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-value" id="kpi-streak">-</div>
            <div class="kpi-label">TwoDayRule Streak</div>
        </div>
        <div class="kpi-card" style="justify-content: flex-start; padding-top: 10px; gap: 2px;">
            <div class="gauge-container">
                <div class="gauge-arc"></div>
                <div class="gauge-needle" id="gauge-needle"></div>
                <div class="gauge-center"></div>
            </div>
            <div class="gauge-labels">
                <span id="gauge-lbl-max">Max</span>
                <span id="gauge-lbl-avg">Ø</span>
                <span>0.0 T</span>
            </div>
            <div class="kpi-label" style="margin-top: 4px;">Erholungs-Zeit</div>
        </div>
    </div>

    <div class="section-block">
        <div class="switch-header">
            <div class="switch-tab active" onclick="switchBlock('mid', 'domino')">Kausalitäten</div>
            <div class="switch-tab" onclick="switchBlock('mid', 'cluster')">Synergien</div>
        </div>
        
        <div id="content-domino" class="switch-content active">
            <div style="display: flex; flex-direction: column; gap: 8px;" id="correlation-container"></div>
        </div>
        
        <div id="content-cluster" class="switch-content">
            <div style="display: flex; flex-direction: column; gap: 8px;" id="cluster-container">
                <div style="font-size: 0.8rem; color: var(--text-secondary);">Berechne Verhaltens-Cluster...</div>
            </div>
        </div>
    </div>

    <div class="section-block">
        <div class="switch-header">
            <div class="switch-tab active" onclick="switchBlock('top', 'matrix')">7-Tage Matrix</div>
            <div class="switch-tab" onclick="switchBlock('top', 'perf')">Routine Auswertung</div>
        </div>
        
        <div id="content-matrix" class="switch-content active">
            <div class="matrix-grid">
                <div class="days-header" id="matrix-days"></div>
                <div id="matrix-rows-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>
        </div>
        
        <div id="content-perf" class="switch-content">
            <div id="routine-performance-container" style="display: flex; flex-direction: column; gap: 2px;"></div>
        </div>
    </div>

    <div class="section-block">
        <div class="switch-header">
            <div class="switch-tab active" onclick="switchBlock('bottom', 'month')">Monatsvergleich</div>
            <div class="switch-tab" onclick="switchBlock('bottom', 'week')">Wochenvergleich</div>
        </div>
        
        <div id="content-month" class="switch-content active">
            <div class="trend-container" id="month-trend-container">
                <div style="font-size: 0.8rem; color: var(--text-secondary);">Berechne historische Monatsdaten...</div>
            </div>
        </div>
        
        <div id="content-week" class="switch-content">
            <div class="trend-container" id="week-trend-container">
                <div style="font-size: 0.8rem; color: var(--text-secondary);">Berechne historische Wochendaten...</div>
            </div>
        </div>
    </div>
</main>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbhl1k_pgXinca2FA2hxqzMJzW--7Hfo54XHtVm_vfrxndA-GFF57UsQ2ILn6drZnu2w/exec";
    
    const routineIcons = {
        "Morgenroutine": "☀️",
        "Sportroutine": "🏃‍♂️",
        "Gesundheitsroutine": "🥗",
        "Fokusroutine": "🧠",
        "Abendroutine": "🌙",
        "Schlafroutine": "🛌",
        "TwoDayRule": "⚡"
    };

    function switchBlock(position, type) {
        if (!event || !event.target) return;
        const header = event.target.parentElement;
        const tabs = header.querySelectorAll('.switch-tab');
        tabs.forEach(tab => tab.classList.remove('active'));
        event.target.classList.add('active');

        if (position === 'top') {
            document.getElementById('content-matrix').classList.remove('active');
            document.getElementById('content-perf').classList.remove('active');
            document.getElementById('content-' + type).classList.add('active');
        } else if (position === 'mid') {
            document.getElementById('content-domino').classList.remove('active');
            document.getElementById('content-cluster').classList.remove('active');
            document.getElementById('content-' + type).classList.add('active');
        } else if (position === 'bottom') {
            document.getElementById('content-month').classList.remove('active');
            document.getElementById('content-week').classList.remove('active');
            document.getElementById('content-' + type).classList.add('active');
        }
    }

    function fetchStats() {
        fetch(GOOGLE_SCRIPT_URL, { method: "GET" })
            .then(res => res.json())
            .then(data => {
                document.getElementById('cloud-info').textContent = "Cloud Live ✓";
                if (!Array.isArray(data) || data.length === 0) {
                    document.getElementById('cloud-info').textContent = "Keine Daten";
                    return;
                }
                renderDashboard(data);
            })
            .catch(err => {
                document.getElementById('cloud-info').textContent = "Fehler";
                console.error(err);
            });
    }

    function formatDateToString(date) {
        const dd = String(date.getDate()).padStart(2, '0');
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const yyyy = date.getFullYear();
        return `${dd}.${mm}.${yyyy}`;
    }

    function parseMonthYear(dateStr) {
        const parts = dateStr.split('.');
        if (parts.length !== 3) return "Unbekannt";
        const dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
        return dateObj.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    }

    function getWeekNumber(dateStr) {
        const parts = dateStr.split('.');
        if (parts.length !== 3) return null;
        const target = new Date(parts[2], parts[1] - 1, parts[0]);
        const dayNr = (target.getDay() + 6) % 7;
        target.setDate(target.getDate() - dayNr + 3);
        const firstThursday = target.valueOf();
        target.setMonth(0, 1);
        if (target.getDay() !== 4) {
            target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
        }
        return 1 + Math.ceil((firstThursday - target) / 604800000);
    }

    function renderDashboard(historyArray) {
        const routineKeys = ["Morgenroutine", "Sportroutine", "Gesundheitsroutine", "Fokusroutine", "Abendroutine", "Schlafroutine", "TwoDayRule"];
        
        // --- 1. 7-TAGE MATRIX ---
        const totalMatrixDays = 7;
        const matrixDates = [];
        const daysHeader = document.getElementById('matrix-days');
        daysHeader.innerHTML = '';

        for (let i = 0; i < totalMatrixDays; i++) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            matrixDates.push(formatDateToString(d));
            
            const dayName = d.toLocaleDateString('de-DE', { weekday: 'short' }).charAt(0);
            daysHeader.innerHTML += `<div class="day-label">${dayName}</div>`;
        }

        let totalChecks = 0;
        let successfulChecks = 0;
        const routineSuccessCounts = {};
        routineKeys.forEach(k => routineSuccessCounts[k] = 0);

        const monthlyData = {};
        const weeklyData = {};

        const chronologicalHistory = [...historyArray].reverse();

        historyArray.forEach(row => {
            if (!row.datum) return;
            
            const monthKey = parseMonthYear(row.datum);
            if (!monthlyData[monthKey]) {
                monthlyData[monthKey] = { total: 0, success: 0 };
            }

            const weekNum = getWeekNumber(row.datum);
            const year = row.datum.split('.')[2];
            const weekKey = weekNum ? `KW ${String(weekNum).padStart(2, '0')} / ${year}` : "Unbekannt";
            if (weekKey !== "Unbekannt" && !weeklyData[weekKey]) {
                weeklyData[weekKey] = { total: 0, success: 0 };
            }

            routineKeys.forEach(routine => {
                if (row.routinen && row.routinen[routine]) {
                    const status = row.routinen[routine].toLowerCase();
                    totalChecks++;
                    monthlyData[monthKey].total++;
                    if (weekKey !== "Unbekannt") weeklyData[weekKey].total++;
                    
                    if (status === "ja") {
                        successfulChecks++;
                        routineSuccessCounts[routine]++;
                        monthlyData[monthKey].success++;
                        if (weekKey !== "Unbekannt") weeklyData[weekKey].success++;
                    }
                }
            });
        });

        // --- 2. MONATSVERGLEICH RENDERN ---
        const trendContainer = document.getElementById('month-trend-container');
        trendContainer.innerHTML = '';
        const sortedMonths = Object.keys(monthlyData).reverse();

        if (sortedMonths.length === 0) {
            trendContainer.innerHTML = `<div style="font-size: 0.8rem; color: var(--text-secondary);">Keine Monatsdaten verfügbar.</div>`;
        } else {
            sortedMonths.forEach((month, idx) => {
                const data = monthlyData[month];
                const pct = data.total > 0 ? Math.round((data.success / data.total) * 100) : 0;
                
                let badgeHtml = `<span class="trend-badge neutral">${pct}% Erfüllung</span>`;
                if (idx < sortedMonths.length - 1) {
                    const prevMonth = sortedMonths[idx + 1];
                    const prevData = monthlyData[prevMonth];
                    const prevPct = prevData.total > 0 ? Math.round((prevData.success / prevData.total) * 100) : 0;
                    const diff = pct - prevPct;
                    
                    if (diff > 0) {
                        badgeHtml = `<span class="trend-badge up">▲ +${diff}% vs. Vormonat (${pct}%)</span>`;
                    } else if (diff < 0) {
                        badgeHtml = `<span class="trend-badge" style="background: rgba(231, 76, 60, 0.1); color: var(--danger);">▼ ${diff}% vs. Vormonat (${pct}%)</span>`;
                    }
                }

                trendContainer.innerHTML += `
                    <div class="trend-row">
                        <span class="trend-month-label">${month}</span>
                        ${badgeHtml}
                    </div>
                `;
            });
        }

        // --- 3. WOCHENVERGLEICH RENDERN ---
        const weekTrendContainer = document.getElementById('week-trend-container');
        weekTrendContainer.innerHTML = '';
        const sortedWeeks = Object.keys(weeklyData).sort().reverse();
        const limitedWeeks = sortedWeeks.slice(0, 4);

        if (limitedWeeks.length === 0) {
            weekTrendContainer.innerHTML = `<div style="font-size: 0.8rem; color: var(--text-secondary);">Keine Wochendaten verfügbar.</div>`;
        } else {
            limitedWeeks.forEach((week, idx) => {
                const data = weeklyData[week];
                const pct = data.total > 0 ? Math.round((data.success / data.total) * 100) : 0;
                
                let badgeHtml = `<span class="trend-badge neutral">${pct}% Erfüllung</span>`;
                if (idx < limitedWeeks.length - 1) {
                    const prevWeek = limitedWeeks[idx + 1];
                    const prevData = weeklyData[prevWeek];
                    const prevPct = prevData.total > 0 ? Math.round((prevData.success / prevData.total) * 100) : 0;
                    const diff = pct - prevPct;
                    
                    if (diff > 0) {
                        badgeHtml = `<span class="trend-badge up">▲ +${diff}% vs. Vorwoche (${pct}%)</span>`;
                    } else if (diff < 0) {
                        badgeHtml = `<span class="trend-badge" style="background: rgba(231, 76, 60, 0.1); color: var(--danger);">▼ ${diff}% vs. Vorwoche (${pct}%)</span>`;
                    }
                }

                weekTrendContainer.innerHTML += `
                    <div class="trend-row">
                        <span class="trend-month-label">${week}</span>
                        ${badgeHtml}
                    </div>
                `;
            });
        }

        // --- 4. KAUSALITÄTEN BERECHNEN ---
        const correlationContainer = document.getElementById('correlation-container');
        correlationContainer.innerHTML = '';

        const insights = [];
        
        routineKeys.forEach(triggerRoutine => {
            routineKeys.forEach(targetRoutine => {
                if (triggerRoutine === targetRoutine) return;

                let triggerJaCount = 0;
                let targetAlsoJaCount = 0;

                for (let i = 1; i < historyArray.length; i++) {
                    const currentRow = historyArray[i]; 
                    const nextDayRow = historyArray[i - 1]; 

                    const isTimeShifted = (triggerRoutine === "Abendroutine" || triggerRoutine === "Schlafroutine");
                    
                    if (isTimeShifted) {
                        if (currentRow.routinen && currentRow.routinen[triggerRoutine] && nextDayRow.routinen && nextDayRow.routinen[targetRoutine]) {
                            if (currentRow.routinen[triggerRoutine].toLowerCase() === 'ja') {
                                triggerJaCount++;
                                if (nextDayRow.routinen[targetRoutine].toLowerCase() === 'ja') {
                                    targetAlsoJaCount++;
                                }
                            }
                        }
                    } else {
                        if (currentRow.routinen && currentRow.routinen[triggerRoutine] && currentRow.routinen[targetRoutine]) {
                            if (currentRow.routinen[triggerRoutine].toLowerCase() === 'ja') {
                                triggerJaCount++;
                                if (currentRow.routinen[targetRoutine].toLowerCase() === 'ja') {
                                    targetAlsoJaCount++;
                                }
                            }
                        }
                    }
                }

                if (triggerJaCount >= 2) {
                    const probability = Math.round((targetAlsoJaCount / triggerJaCount) * 100);
                    if (probability >= 70) {
                        insights.push({
                            trigger: triggerRoutine,
                            target: targetRoutine,
                            prob: probability,
                            isShifted: (triggerRoutine === "Abendroutine" || triggerRoutine === "Schlafroutine")
                        });
                    }
                }
            });
        });

        if (insights.length === 0) {
            correlationContainer.innerHTML = `
                <div class="insight-card">
                    <div class="insight-title">⏳ Datenbasis wird aufgebaut</div>
                    <div class="insight-desc">Sobald Kausalitäten entstehen, siehst du hier deinen mächtigsten Hebel.</div>
                </div>`;
        } else {
            insights.sort((a, b) => b.prob - a.prob);
            insights.slice(0, 3).forEach(ins => {
                const triggerIcon = routineIcons[ins.trigger] || "🎯";
                const targetIcon = routineIcons[ins.target] || "🎯";
                const contextText = ins.isShifted ? "am Folgetag" : "am selben Tag";
                correlationContainer.innerHTML += `
                    <div class="insight-card">
                        <div class="insight-title">${triggerIcon} ${ins.trigger} → ${targetIcon} ${ins.target}</div>
                        <div class="insight-desc">Sichert deine <strong>${ins.target}</strong> ${contextText} mit einer Wahrscheinlichkeit von <strong>${ins.prob}%</strong>.</div>
                    </div>
                `;
            });
        }

        // --- 5. SYNERGIEN BERECHNEN ---
        const clusterContainer = document.getElementById('cluster-container');
        clusterContainer.innerHTML = '';
        const clusters = [];

        for (let i = 0; i < routineKeys.length; i++) {
            for (let j = i + 1; j < routineKeys.length; j++) {
                const r1 = routineKeys[i];
                const r2 = routineKeys[j];
                
                let commonDays = 0;
                let totalActiveDays = historyArray.length;

                historyArray.forEach(row => {
                    if (row.routinen && row.routinen[r1] && row.routinen[r2]) {
                        if (row.routinen[r1].toLowerCase() === 'ja' && row.routinen[r2].toLowerCase() === 'ja') {
                            commonDays++;
                        }
                    }
                });

                if (commonDays >= 2) {
                    const pairProb = Math.round((commonDays / totalActiveDays) * 100);
                    clusters.push({ routine1: r1, routine2: r2, strength: pairProb, count: commonDays });
                }
            }
        }

        if (clusters.length === 0) {
            clusterContainer.innerHTML = `
                <div class="insight-card">
                    <div class="insight-title">⏳ Berechne Synergien...</div>
                    <div class="insight-desc">Hier erscheinen Kombinationen, die du besonders oft zusammen meisterst.</div>
                </div>`;
        } else {
            clusters.sort((a, b) => b.strength - a.strength);
            clusters.slice(0, 3).forEach(c => {
                const icon1 = routineIcons[c.routine1] || "🎯";
                const icon2 = routineIcons[c.routine2] || "🎯";
                clusterContainer.innerHTML += `
                    <div class="insight-card">
                        <div class="insight-title">${icon1} ${c.routine1} + ${icon2} ${c.routine2}</div>
                        <div class="insight-desc">Dieses Routine-Paket tritt in <strong>${c.strength}%</strong> aller aufgezeichneten Tage als geschlossene Einheit auf.</div>
                    </div>
                `;
            });
        }

        // --- 6. TWODAYRULE STREAK BERECHNEN ---
        let currentStreak = 0;
        let checkDate = new Date();
        checkDate.setDate(checkDate.getDate() - 1); 
        
        while (true) {
            const checkDateStr = formatDateToString(checkDate);
            const foundDay = historyArray.find(item => item.datum === checkDateStr);
            
            if (foundDay && foundDay.routinen && foundDay.routinen["TwoDayRule"]) {
                if (foundDay.routinen["TwoDayRule"].toLowerCase() === 'ja') {
                    currentStreak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            } else {
                break;
            }
        }
        document.getElementById('kpi-streak').textContent = `${currentStreak} Tage`;

        // --- 7. DYNAMISCHER TACHO FÜR ERHOLUNGS-ZEIT ---
        let totalRecoveryDays = 0;
        let recoveryTracksCount = 0;
        let maxRecoveryDays = 0;
        let currentGap = 0;
        let trackingGap = false;

        chronologicalHistory.forEach(row => {
            if (row.routinen && row.routinen["TwoDayRule"]) {
                const status = row.routinen["TwoDayRule"].toLowerCase();
                if (status === 'nein') {
                    if (!trackingGap) {
                        trackingGap = true;
                        currentGap = 1;
                    } else {
                        currentGap++;
                    }
                } else if (status === 'ja') {
                    if (trackingGap) {
                        totalRecoveryDays += currentGap;
                        if (currentGap > maxRecoveryDays) maxRecoveryDays = currentGap;
                        recoveryTracksCount++;
                        trackingGap = false;
                        currentGap = 0;
                    }
                }
            }
        });

        const avgRecovery = recoveryTracksCount > 0 ? parseFloat((totalRecoveryDays / recoveryTracksCount).toFixed(1)) : 0.0;
        const finalMax = maxRecoveryDays > 0 ? maxRecoveryDays : 3.0;

        document.getElementById('gauge-lbl-max').textContent = `${finalMax.toFixed(1)} T`;
        document.getElementById('gauge-lbl-avg').textContent = `Ø ${avgRecovery.toFixed(1)}`;

        let degrees = 75; 

        if (recoveryTracksCount > 0 && finalMax > 0) {
            const ratio = avgRecovery / finalMax;
            degrees = 75 - (ratio * 150);
            if (degrees < -75) degrees = -75;
            if (degrees > 75) degrees = 75;
        }

        document.getElementById('gauge-needle').style.transform = `rotate(${degrees}deg)`;

        // --- 8. MATRIX ZEILEN RENDERN ---
        const rowsContainer = document.getElementById('matrix-rows-container');
        rowsContainer.innerHTML = '';

        routineKeys.forEach(routine => {
            let cellsHtml = '';
            
            matrixDates.forEach(dateStr => {
                const dayData = historyArray.find(item => item.datum === dateStr);
                let status = 'nein';
                if (dayData && dayData.routinen && dayData.routinen[routine]) {
                    status = dayData.routinen[routine].toLowerCase();
                }
                cellsHtml += `<div class="matrix-cell ${status}"></div>`;
            });

            const icon = routineIcons[routine] || "🎯";

            rowsContainer.innerHTML += `
                <div class="matrix-row">
                    <div class="matrix-label">
                        <span class="perf-icon">${icon}</span>
                        <span class="perf-name">${routine}</span>
                    </div>
                    <div class="matrix-cells">${cellsHtml}</div>
                </div>
            `;
        });

        // --- 9. PERFORMANCE BALKEN ALL-TIME ---
        const perfContainer = document.getElementById('routine-performance-container');
        perfContainer.innerHTML = '';

        routineKeys.forEach(routine => {
            const routineTotal = historyArray.length;
            const routineSuccess = routineSuccessCounts[routine] || 0;
            const pct = routineTotal > 0 ? Math.round((routineSuccess / routineTotal) * 100) : 0;
            const icon = routineIcons[routine] || "🎯";

            perfContainer.innerHTML += `
                <div class="perf-item">
                    <div class="perf-info">
                        <span class="perf-icon">${icon}</span>
                        <span class="perf-name">${routine}</span>
                    </div>
                    <div class="perf-bar-wrapper">
                        <div class="perf-bar-bg"><div class="perf-bar-fill" style="width: ${pct}%"></div></div>
                        <span class="perf-pct">${pct}%</span>
                    </div>
                </div>
            `;
        });
    }

    window.onload = fetchStats;
</script>
</body>
</html>
