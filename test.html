<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Statistiken</title>
    <style>
        :root {
            --accent: #e67e22;
            --accent-soft: rgba(230, 126, 34, 0.1);
            --success: #27ae60;
            --success-soft: rgba(39, 174, 96, 0.1);
            --danger: #e74c3c;
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #2d3f55;
                --border-light: #253347;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg);
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            border-bottom: 1px solid var(--border-light);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        .header-top { display: flex; align-items: center; gap: 12px; }
        
        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border);
            text-decoration: none; color: var(--text-primary); box-shadow: var(--shadow);
            font-size: 1.1rem;
        }

        header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; }
        .cloud-status { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }

        main { padding: 16px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

        /* KPI Grid */
        .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .kpi-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
            padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px;
        }
        .kpi-value { font-size: 1.6rem; font-weight: 800; color: var(--text-primary); }
        .kpi-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }

        /* Section Block */
        .section-block {
            background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
            padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px;
        }
        .section-title { font-weight: 800; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }

        /* Wochen-Matrix */
        .matrix-grid { display: flex; flex-direction: column; gap: 12px; }
        .matrix-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .matrix-label { font-size: 1.25rem; width: 32px; text-align: center; flex-shrink: 0; }
        .matrix-cells { display: flex; gap: 8px; flex-shrink: 0; justify-content: flex-end; flex: 1; }
        .matrix-cell { width: 26px; height: 26px; border-radius: 7px; background: var(--border-light); border: 1px solid var(--border); position: relative; transition: all 0.2s; }
        .matrix-cell.ja { background: var(--success); border-color: var(--success); }
        .matrix-cell.nein { background: var(--border-light); border-color: var(--border); opacity: 1; }
        
        .days-header { display: flex; margin-bottom: -4px; justify-content: flex-end; gap: 8px; padding-right: 0; }
        .day-label { font-size: 0.6rem; font-weight: 700; color: var(--text-secondary); text-align: center; width: 26px; text-transform: uppercase; }

        /* Routine Listen Performance */
        .perf-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
        .perf-item:last-child { border-bottom: none; padding-bottom: 0; }
        .perf-info { display: flex; align-items: center; gap: 10px; }
        .perf-icon { font-size: 1rem; }
        .perf-name { font-size: 0.9rem; font-weight: 700; }
        .perf-bar-wrapper { display: flex; align-items: center; gap: 12px; width: 120px; }
        .perf-bar-bg { flex: 1; height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; }
        .perf-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
        .perf-pct { font-size: 0.75rem; font-weight: 700; width: 32px; text-align: right; }

        /* Monatsvergleich Styles */
        .trend-container { display: flex; flex-direction: column; gap: 10px; }
        .trend-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
        .trend-month-label { font-size: 0.9rem; font-weight: 700; }
        .trend-badge { font-size: 0.75rem; font-weight: 700; padding: 4px 8px; border-radius: 8px; }
        .trend-badge.up { background: var(--success-soft); color: var(--success); }
        .trend-badge.neutral { background: var(--border-light); color: var(--text-secondary); }

        /* Korrelations-Matrix Styles */
        .insight-card { background: var(--bg); border-radius: 12px; border: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
        .insight-title { font-size: 0.85rem; font-weight: 700; }
        .insight-desc { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.3; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <a href="javascript:history.back()" class="back-btn">&larr;</a>
        <h1>Statistiken</h1>
        <div class="cloud-status" id="cloud-info">Lade Daten...</div>
    </div>
</header>

<main>
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-value" id="kpi-streak">-</div>
            <div class="kpi-label">TwoDayRule Streak</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-value" id="kpi-rate">-</div>
            <div class="kpi-label">Fokus-Metrik</div>
        </div>
    </div>

    <div class="section-block">
        <div class="section-title">7-Tage Konsistenz Matrix</div>
        <div class="matrix-grid">
            <div class="days-header" id="matrix-days"></div>
            <div id="matrix-rows-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <div class="section-block">
        <div class="section-title">Monatsvergleich Trend</div>
        <div class="trend-container" id="month-trend-container">
            <div style="font-size: 0.8rem; color: var(--text-secondary);">Berechne historische Monatsdaten...</div>
        </div>
    </div>

    <div class="section-block">
        <div class="section-title">Dominostein-Analysen (Hebel 4)</div>
        <div style="display: flex; flex-direction: column; gap: 10px;" id="correlation-container">
            <div style="font-size: 0.8rem; color: var(--text-secondary);">Analysiere wechselseitige Abhängigkeiten...</div>
        </div>
    </div>

    <div class="section-block">
        <div class="section-title">Routine Auswertung</div>
        <div id="routine-performance-container"></div>
    </div>
</main>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbhl1k_pgXinca2FA2hxqzMJzW--7Hfo54XHtVm_vfrxndA-GFF57UsQ2ILn6drZnu2w/exec";
    
    const routineIcons = {
        "Morgenroutine": "☀️",
        "Sportroutine": "🏃‍♂️",
        "Gesundheitsroutine": "🥗",
        "Fokusroutine": "🧠",
        "Abendroutine": "🌙",
        "Schlafroutine": "🛌",
        "TwoDayRule": "⚡"
    };

    function fetchStats() {
        fetch(GOOGLE_SCRIPT_URL, { method: "GET" })
            .then(res => res.json())
            .then(data => {
                document.getElementById('cloud-info').textContent = "Cloud Live ✓";
                if (!Array.isArray(data) || data.length === 0) {
                    document.getElementById('cloud-info').textContent = "Keine Daten";
                    return;
                }
                renderDashboard(data);
            })
            .catch(err => {
                document.getElementById('cloud-info').textContent = "Fehler";
                console.error(err);
            });
    }

    function formatDateToString(date) {
        const dd = String(date.getDate()).padStart(2, '0');
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const yyyy = date.getFullYear();
        return `${dd}.${mm}.${yyyy}`;
    }

    function parseMonthYear(dateStr) {
        const parts = dateStr.split('.');
        if (parts.length !== 3) return "Unbekannt";
        const dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
        return dateObj.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });
    }

    function renderDashboard(historyArray) {
        const routineKeys = ["Morgenroutine", "Sportroutine", "Gesundheitsroutine", "Fokusroutine", "Abendroutine", "Schlafroutine", "TwoDayRule"];
        
        // --- 1. 7-TAGE MATRIX ---
        const totalMatrixDays = 7;
        const matrixDates = [];
        const daysHeader = document.getElementById('matrix-days');
        daysHeader.innerHTML = '';

        for (let i = 0; i < totalMatrixDays; i++) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            matrixDates.push(formatDateToString(d));
            
            const dayName = d.toLocaleDateString('de-DE', { weekday: 'short' }).charAt(0);
            daysHeader.innerHTML += `<div class="day-label">${dayName}</div>`;
        }

        let totalChecks = 0;
        let successfulChecks = 0;
        const routineSuccessCounts = {};
        routineKeys.forEach(k => routineSuccessCounts[k] = 0);

        const monthlyData = {};

        historyArray.forEach(row => {
            const monthKey = parseMonthYear(row.datum);
            if (!monthlyData[monthKey]) {
                monthlyData[monthKey] = { total: 0, success: 0 };
            }

            routineKeys.forEach(routine => {
                if (row.routinen && row.routinen[routine]) {
                    const status = row.routinen[routine].toLowerCase();
                    totalChecks++;
                    monthlyData[monthKey].total++;
                    
                    if (status === "ja") {
                        successfulChecks++;
                        routineSuccessCounts[routine]++;
                        monthlyData[monthKey].success++;
                    }
                }
            });
        });

        // --- 2. MONATSVERGLEICH DYNAMISCH RENDERN ---
        const trendContainer = document.getElementById('month-trend-container');
        trendContainer.innerHTML = '';
        const sortedMonths = Object.keys(monthlyData).reverse();

        if (sortedMonths.length === 0) {
            trendContainer.innerHTML = `<div style="font-size: 0.8rem; color: var(--text-secondary);">Noch keine Monatsdaten vorhanden.</div>`;
        } else {
            sortedMonths.forEach((month, idx) => {
                const data = monthlyData[month];
                const pct = data.total > 0 ? Math.round((data.success / data.total) * 100) : 0;
                
                let badgeHtml = `<span class="trend-badge neutral">${pct}% Erfüllung</span>`;
                if (idx < sortedMonths.length - 1) {
                    const prevMonth = sortedMonths[idx + 1];
                    const prevData = monthlyData[prevMonth];
                    const prevPct = prevData.total > 0 ? Math.round((prevData.success / prevData.total) * 100) : 0;
                    const diff = pct - prevPct;
                    
                    if (diff > 0) {
                        badgeHtml = `<span class="trend-badge up">▲ +${diff}% vs. Vormonat (${pct}%)</span>`;
                    } else if (diff < 0) {
                        badgeHtml = `<span class="trend-badge" style="background: rgba(231, 76, 60, 0.1); color: var(--danger);">▼ ${diff}% vs. Vormonat (${pct}%)</span>`;
                    }
                }

                trendContainer.innerHTML += `
                    <div class="trend-row">
                        <span class="trend-month-label">${month}</span>
                        ${badgeHtml}
                    </div>
                `;
            });
        }

        // --- 3. KORRELATIONS-MATRIX BERECHNEN (HEBEL 4 MIT FOLGETAG-LOGIK) ---
        const correlationContainer = document.getElementById('correlation-container');
        correlationContainer.innerHTML = '';

        const insights = [];
        
        routineKeys.forEach(triggerRoutine => {
            routineKeys.forEach(targetRoutine => {
                if (triggerRoutine === targetRoutine) return;

                let triggerJaCount = 0;
                let targetAlsoJaCount = 0;

                // Loop startet bei Index 1, um immer den Folgetag (i - 1) vergleichen zu können
                for (let i = 1; i < historyArray.length; i++) {
                    const currentRow = historyArray[i]; // Früheres Datum (Trigger-Tag)
                    const nextDayRow = historyArray[i - 1]; // Späteres Datum (Folgetag)

                    const isTimeShifted = (triggerRoutine === "Abendroutine" || triggerRoutine === "Schlafroutine");
                    
                    if (isTimeShifted) {
                        if (currentRow.routinen && currentRow.routinen[triggerRoutine] && nextDayRow.routinen && nextDayRow.routinen[targetRoutine]) {
                            if (currentRow.routinen[triggerRoutine].toLowerCase() === 'ja') {
                                triggerJaCount++;
                                if (nextDayRow.routinen[targetRoutine].toLowerCase() === 'ja') {
                                    targetAlsoJaCount++;
                                }
                            }
                        }
                    } else {
                        if (currentRow.routinen && currentRow.routinen[triggerRoutine] && currentRow.routinen[targetRoutine]) {
                            if (currentRow.routinen[triggerRoutine].toLowerCase() === 'ja') {
                                triggerJaCount++;
                                if (currentRow.routinen[targetRoutine].toLowerCase() === 'ja') {
                                    targetAlsoJaCount++;
                                }
                            }
                        }
                    }
                }

                if (triggerJaCount >= 2) {
                    const probability = Math.round((targetAlsoJaCount / triggerJaCount) * 100);
                    if (probability >= 70) {
                        insights.push({
                            trigger: triggerRoutine,
                            target: targetRoutine,
                            prob: probability,
                            isShifted: (triggerRoutine === "Abendroutine" || triggerRoutine === "Schlafroutine")
                        });
                    }
                }
            });
        });

        if (insights.length === 0) {
            correlationContainer.innerHTML = `
                <div class="insight-card">
                    <div class="insight-title">⏳ Datenbasis wird aufgebaut</div>
                    <div class="insight-desc">Sobald du die ersten Routinen auf "ja" setzt und Kausalitäten entstehen, siehst du hier deinen mächtigsten Dominostein.</div>
                </div>`;
        } else {
            insights.sort((a, b) => b.prob - a.prob);
            insights.slice(0, 3).forEach(ins => {
                const triggerIcon = routineIcons[ins.trigger] || "🎯";
                const targetIcon = routineIcons[ins.target] || "🎯";
                const contextText = ins.isShifted ? "am Folgetag" : "am selben Tag";
                correlationContainer.innerHTML += `
                    <div class="insight-card">
                        <div class="insight-title">${triggerIcon} ${ins.trigger} → ${targetIcon} ${ins.target}</div>
                        <div class="insight-desc">Wenn diese Routine sitzt, erfüllst du deine <strong>${ins.target}</strong> ${contextText} mit einer Wahrscheinlichkeit von <strong>${ins.prob}%</strong>. Es ist dein strategischer Hebel.</div>
                    </div>
                `;
            });
        }

        // --- 4. TWODAYRULE STREAK BERECHNEN (HEUTE IGNORIERT, START AB GESTERN) ---
        let currentStreak = 0;
        let checkDate = new Date();
        checkDate.setDate(checkDate.getDate() - 1); // Expliziter Start bei Gestern
        
        while (true) {
            const checkDateStr = formatDateToString(checkDate);
            const foundDay = historyArray.find(item => item.datum === checkDateStr);
            
            if (foundDay && foundDay.routinen && foundDay.routinen["TwoDayRule"]) {
                if (foundDay.routinen["TwoDayRule"].toLowerCase() === 'ja') {
                    currentStreak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            } else {
                break;
            }
        }

        // --- 5. MATRIX ZEILEN RENDERN (NUR EMOJIS, COMPACT & GRÖSSER) ---
        const rowsContainer = document.getElementById('matrix-rows-container');
        rowsContainer.innerHTML = '';

        routineKeys.forEach(routine => {
            let cellsHtml = '';
            
            matrixDates.forEach(dateStr => {
                const dayData = historyArray.find(item => item.datum === dateStr);
                let status = 'nein';
                if (dayData && dayData.routinen && dayData.routinen[routine]) {
                    status = dayData.routinen[routine].toLowerCase();
                }
                cellsHtml += `<div class="matrix-cell ${status}"></div>`;
            });

            const icon = routineIcons[routine] || "🎯";

            rowsContainer.innerHTML += `
                <div class="matrix-row">
                    <div class="matrix-label" title="${routine}">${icon}</div>
                    <div class="matrix-cells">${cellsHtml}</div>
                </div>
            `;
        });

        // --- 6. PERFORMANCE BALKEN ALL-TIME ---
        const perfContainer = document.getElementById('routine-performance-container');
        perfContainer.innerHTML = '';

        routineKeys.forEach(routine => {
            const routineTotal = historyArray.length;
            const routineSuccess = routineSuccessCounts[routine] || 0;
            const pct = routineTotal > 0 ? Math.round((routineSuccess / routineTotal) * 100) : 0;
            const icon = routineIcons[routine] || "🎯";

            perfContainer.innerHTML += `
                <div class="perf-item">
                    <div class="perf-info">
                        <span class="perf-icon">${icon}</span>
                        <span class="perf-name">${routine}</span>
                    </div>
                    <div class="perf-bar-wrapper">
                        <div class="perf-bar-bg"><div class="perf-bar-fill" style="width: ${pct}%"></div></div>
                        <span class="perf-pct">${pct}%</span>
                    </div>
                </div>
            `;
        });

        document.getElementById('kpi-streak').textContent = `${currentStreak} Tage`;
        
        // Die alte Gesamtquote wurde entfernt. Hier kann bei Bedarf eine neue Fokuskennzahl eingetragen werden.
        document.getElementById('kpi-rate').textContent = "Aktiv"; 
    }

    window.onload = fetchStats;
</script>
</body>
</html>
