<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Startseite</title>
    <script src="daten.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --bubble-shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.15);
            --center-glow: radial-gradient(circle, rgba(46, 204, 113, 0.15) 0%, rgba(240, 242, 245, 0) 70%);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.95);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: rgba(51, 65, 85, 0.8);
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
                --bubble-shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.6);
                --center-glow: radial-gradient(circle, rgba(46, 204, 113, 0.1) 0%, rgba(15, 23, 42, 0) 70%);
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s ease;
        }

        header {
            padding: calc(env(safe-area-inset-top) + 24px) 20px 14px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }

        .header-title {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.06em;
            color: var(--text-primary);
        }

        main {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--center-glow);
        }

        #bubble-arena {
            position: relative;
            width: 100%;
            max-width: 750px;
            height: 100%;
            max-height: 750px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bubble {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-align: center;
            
            /* Basisgrößen */
            width: calc(var(--score-factor, 1) * 105px);
            height: calc(var(--score-factor, 1) * 105px);
            min-width: 75px;
            min-height: 75px;
            max-width: 160px;
            max-height: 160px;
        }

        /* Spezial-Indikator für die Top-Karten */
        .bubble.top-favorit {
            border: 1.5px solid rgba(46, 204, 113, 0.4);
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.08), var(--shadow);
        }

        .bubble:active { transform: scale(0.93) !important; }

        @media (hover: hover) {
            .bubble:hover {
                border-color: var(--text-secondary);
                box-shadow: var(--bubble-shadow-hover);
                z-index: 50;
            }
        }

        .bubble-icon {
            font-size: calc(var(--score-factor, 1) * 1.6rem);
            line-height: 1;
            margin-bottom: 4px;
        }

        .bubble-title {
            font-weight: 700;
            color: var(--text-primary);
            font-size: calc(var(--score-factor, 1) * 0.85rem);
            padding: 0 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">FABIANS APP</div>
    </header>

    <main>
        <div id="bubble-arena">
            <!-- Dynamische Kreise -->
        </div>
    </main>

    <script>
        const APPS = [
            { id: "reisen", title: "Reisen", icon: "🌍", url: "reise_stats.html" },
            { id: "habits", title: "Habits", icon: "📊", url: "https://fabian25700.github.io/webapp/habits2.html" },
            { id: "alkohol", title: "Alkohol", icon: "🍷", url: "alkohol.html" },
            { id: "alltag", title: "Alltag", icon: "🏠", url: "Alltag.html" },
            { id: "gastspiel", title: "Gastspiel", icon: "⚽", url: "gastspiel2.html" },
            { id: "kcrakete", title: "KC Rakete", icon: "🚀", url: "https://bit.ly/m/kcrakete" },
            { id: "test", title: "Test", icon: "🧪", url: "test.html" },
            { id: "test2", title: "Test 2", icon: "🧪", url: "test2.html" },
            { id: "spiele", title: "Spiele", icon: "🎮", url: "spiele.html" },
            { id: "familie", title: "Familie", icon: "🏢", url: "familie.html" }
        ];

        function getStats() {
            const defaults = {};
            APPS.forEach(app => { defaults[app.id] = { count: 0, lastUsed: 0 }; });
            const stored = localStorage.getItem("fabians_app_stats");
            return stored ? JSON.parse(stored) : defaults;
        }

        function trackClick(id) {
            const stats = getStats();
            if (stats[id]) {
                stats[id].count += 1;
                stats[id].lastUsed = Date.now();
                localStorage.setItem("fabians_app_stats", JSON.stringify(stats));
            }
        }

        function renderMenu() {
            const stats = getStats();
            const now = Date.now();
            const arena = document.getElementById("bubble-arena");
            arena.innerHTML = "";

            // Scores berechnen
            const appsWithScores = APPS.map(app => {
                const stat = stats[app.id] || { count: 0, lastUsed: 0 };
                const recency = stat.lastUsed ? (1 / (now - stat.lastUsed + 1)) : 0;
                const score = (stat.count * 0.7) + (recency * 1000000 * 0.3);
                return { ...app, score };
            });

            // Gesamte Sortierung nach Score ermitteln
            const sortedApps = [...appsWithScores].sort((a, b) => b.score - a.score);
            
            const scores = sortedApps.map(a => a.score);
            const maxScore = Math.max(...scores);
            const minScore = Math.min(...scores);

            const isMobile = window.innerWidth < 768;

            // Definition der Radien (Zentrum vs. Äußerer Ring)
            const centerRadius = isMobile ? 55 : 85;
            const outerRadius = isMobile ? 125 : 210;

            // Winkelgenerierung für die Verteilung
            // Top 4 im Zentrum
            let centerAngles = [45, 135, 225, 315].map(a => a + (Math.random() * 20 - 10));
            // Die restlichen 6 im äußeren Kreis
            let outerAngles = [0, 60, 120, 180, 240, 300].map(a => a + (Math.random() * 30 - 15));

            // Zufällig durchmischen
            centerAngles = centerAngles.sort(() => Math.random() - 0.5);
            outerAngles = outerAngles.sort(() => Math.random() - 0.5);

            sortedApps.forEach((app, index) => {
                const isTopFour = index < 4;

                // Größenfaktor bestimmen (Wertebereich 0.8 bis 1.5)
                let factor = 1.0;
                if (maxScore !== minScore) {
                    factor = 0.8 + ((app.score - minScore) / (maxScore - minScore)) * 0.7;
                } else if (maxScore > 0) {
                    factor = 1.2;
                }

                const bubble = document.createElement("a");
                bubble.href = app.url;
                bubble.className = "bubble";
                if (isTopFour) bubble.classList.add("top-favorit");
                bubble.style.setProperty("--score-factor", factor);

                // Trigonometrische Positionierung je nach Sektion
                let posX, posY;
                if (isTopFour) {
                    const angleRad = (centerAngles[index] * Math.PI) / 180;
                    posX = Math.cos(angleRad) * centerRadius;
                    posY = Math.sin(angleRad) * centerRadius;
                } else {
                    const angleRad = (outerAngles[index - 4] * Math.PI) / 180;
                    posX = Math.cos(angleRad) * outerRadius;
                    posY = Math.sin(angleRad) * outerRadius;
                }

                bubble.style.transform = `translate(${posX}px, ${posY}px)`;
                bubble.addEventListener("click", () => trackClick(app.id));

                bubble.innerHTML = `
                    <span class="bubble-icon">${app.icon}</span>
                    <span class="bubble-title">${app.title}</span>
                `;

                arena.appendChild(bubble);
            });
        }

        window.addEventListener("DOMContentLoaded", renderMenu);
        window.addEventListener("resize", renderMenu);
    </script>
</body>
</html>
