<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pomodoro</title>
    <style>
        :root {
            --accent: #e67e22;
            --accent-soft: rgba(230, 126, 34, 0.1);
            --success: #27ae60;
            --success-soft: rgba(39, 174, 96, 0.1);
            --danger: #e74c3c;
            --danger-soft: rgba(231, 76, 60, 0.3);
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #2d3f55;
                --border-light: #253347;
            }
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        header {
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0;
            z-index: 100;
            background: var(--bg);
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header-top { 
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }
        
        .header-left { 
            display: flex; 
            align-items: center; 
            position: absolute;
            left: 0;
            z-index: 10;
        }

        .back-container { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            text-decoration: none; 
            color: var(--text-primary); 
        }

        .back-btn {
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 32px; 
            height: 32px; 
            border-radius: 9px;
            background: var(--surface); 
            border: 1px solid var(--border);
            color: var(--text-primary); 
            box-shadow: var(--shadow);
            flex-shrink: 0; 
            font-size: 0.9rem;
            line-height: 1;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-primary);
        }

        main {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 60px;
        }

        /* Toggle Switch Styling */
        .mode-toggle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .toggle-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .selection-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .rank-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .rank-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rank-btn:active {
            transform: scale(0.96);
        }

        .rank-num {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .rank-penalty {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .rank-btn.p1 { border-color: rgba(39, 174, 96, 0.4); }
        .rank-btn.p1 .rank-num { color: var(--success); }
        
        .rank-btn.p4 { border-color: rgba(231, 76, 60, 0.4); }
        .rank-btn.p4 .rank-num { color: var(--danger); }

        /* Lock Screen Overlay */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        #lock-screen.active {
            display: flex;
        }

        .lock-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .badge-lock {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            margin: 4px 0;
        }

        .todo-callout {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--success);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .congrats-text {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="header-left">
            <a href="index.html" class="back-container">
                <div class="back-btn">&larr;</div>
            </a>
        </div>
        <div class="header-title">Pomodoro</div>
    </div>
    <div class="mode-toggle-container">
        <button id="toggle-work" class="toggle-btn active" onclick="switchMode('WORK')">Arbeitszeit</button>
        <button id="toggle-free" class="toggle-btn" onclick="switchMode('FREE')">Freizeit</button>
    </div>
</header>

<main>
    <div id="card-work" class="selection-card">
        <div class="card-title">Arbeitszeit Fokus</div>
        <div class="rank-grid">
            <div class="rank-btn p1" onclick="startLockoutByConfig('WORK', 0)">
                <span class="rank-num" id="work-label-0">Option 1</span>
                <span class="rank-penalty" id="work-sub-0">5 Min Sperre</span>
            </div>
            <div class="rank-btn" onclick="startLockoutByConfig('WORK', 1)">
                <span class="rank-num" id="work-label-1">Option 2</span>
                <span class="rank-penalty" id="work-sub-1">10 Min Sperre</span>
            </div>
            <div class="rank-btn" onclick="startLockoutByConfig('WORK', 2)">
                <span class="rank-num" id="work-label-2">Option 3</span>
                <span class="rank-penalty" id="work-sub-2">15 Min Sperre</span>
            </div>
            <div class="rank-btn p4" onclick="startLockoutByConfig('WORK', 3)">
                <span class="rank-num" id="work-label-3">Option 4</span>
                <span class="rank-penalty" id="work-sub-3">20 Min Sperre</span>
            </div>
        </div>
    </div>

    <div id="card-free" class="selection-card" style="display: none;">
        <div class="card-title">Freizeit Fokus</div>
        <div class="rank-grid">
            <div class="rank-btn p1" onclick="startLockoutByConfig('FREE', 0)">
                <span class="rank-num" id="free-label-0">Option 1</span>
                <span class="rank-penalty" id="free-sub-0">5 Min Sperre</span>
            </div>
            <div class="rank-btn" onclick="startLockoutByConfig('FREE', 1)">
                <span class="rank-num" id="free-label-1">Option 2</span>
                <span class="rank-penalty" id="free-sub-1">10 Min Sperre</span>
            </div>
            <div class="rank-btn" onclick="startLockoutByConfig('FREE', 2)">
                <span class="rank-num" id="free-label-2">Option 3</span>
                <span class="rank-penalty" id="free-sub-2">15 Min Sperre</span>
            </div>
            <div class="rank-btn p4" onclick="startLockoutByConfig('FREE', 3)">
                <span class="rank-num" id="free-label-3">Option 4</span>
                <span class="rank-penalty" id="free-sub-3">20 Min Sperre</span>
            </div>
        </div>
    </div>
</main>

<div id="lock-screen">
    <div class="lock-container">
        <div class="badge-lock" id="lock-badge">🔒 Focus Mode Active</div>
        <div class="timer-display" id="timer">00:00</div>
        <div class="todo-callout" id="todo-text">🚀 Jetzt ToDos rocken!</div>
    </div>
</div>

<script>
    /* ==========================================================================
       ZENTRALE KONFIGURATION: Hier können alle Zeiten & Tasks bearbeitet werden
       ========================================================================== */
    const CONFIG = {
        WORK: [
            { label: "Kurzsprint", minutes: 15, task: "Habit / schnelle Aufgabe erledigen" },
            { label: "Fokus-Block", minutes: 25, task: "Wichtige Aufgabe bearbeiten" },
            { label: "Intensiv",    minutes: 45, task: "Deep Work Session durchziehen" },
            { label: "Marathon",    minutes: 60, task: "Komplexes Projekt ohne Ablenkung" }
        ],
        FREE: [
            { label: "Power Nap",   minutes: 10, task: "Kurz entspannen & Akku aufladen" },
            { label: "Pause",       minutes: 15, task: "Kaffee / Tee trinken & durchatmen" },
            { label: "Aktivpause",  minutes: 20, task: "Spaziergang oder leichtes Stretching" },
            { label: "Feierabend",  minutes: 30, task: "Abschalten und Beine hochlegen" }
        ]
    };

    document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
    });

    let timerInterval = null;

    function renderUI() {
        CONFIG.WORK.forEach((item, index) => {
            const labelEl = document.getElementById(`work-label-${index}`);
            const subEl = document.getElementById(`work-sub-${index}`);
            if (labelEl) labelEl.innerText = item.label;
            if (subEl) subEl.innerText = `${item.minutes} Min Sperre`;
        });

        CONFIG.FREE.forEach((item, index) => {
            const labelEl = document.getElementById(`free-label-${index}`);
            const subEl = document.getElementById(`free-sub-${index}`);
            if (labelEl) labelEl.innerText = item.label;
            if (subEl) subEl.innerText = `${item.minutes} Min Sperre`;
        });
    }

    function switchMode(mode) {
        const workCard = document.getElementById('card-work');
        const freeCard = document.getElementById('card-free');
        const workBtn = document.getElementById('toggle-work');
        const freeBtn = document.getElementById('toggle-free');

        if (mode === 'WORK') {
            workCard.style.display = 'flex';
            freeCard.style.display = 'none';
            workBtn.classList.add('active');
            freeBtn.classList.remove('active');
        } else {
            workCard.style.display = 'none';
            freeCard.style.display = 'flex';
            workBtn.classList.remove('active');
            freeBtn.classList.add('active');
        }
    }

    function startLockoutByConfig(mode, index) {
        const selected = CONFIG[mode][index];
        if (!selected) return;

        const endTime = Date.now() + selected.minutes * 60 * 1000;
        localStorage.setItem('pomodoro_end_time', endTime);
        localStorage.setItem('pomodoro_type', 'lockout');
        localStorage.setItem('pomodoro_task', selected.task);
        
        runTimer();
    }

    function runTimer() {
        const endTime = localStorage.getItem('pomodoro_end_time');
        const type = localStorage.getItem('pomodoro_type');
        if (!endTime) return;

        const lockScreen = document.getElementById('lock-screen');
        const timerDisplay = document.getElementById('timer');
        const todoText = document.getElementById('todo-text');
        const lockBadge = document.getElementById('lock-badge');
        
        lockScreen.classList.add('active');

        if (timerInterval) clearInterval(timerInterval);

        const update = () => {
            const now = Date.now();
            const remainingMs = endTime - now;
            const remainingSeconds = Math.ceil(remainingMs / 1000);

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval);
                localStorage.removeItem('pomodoro_end_time');
                localStorage.removeItem('pomodoro_type');
                localStorage.removeItem('pomodoro_task');
                lockScreen.classList.remove('active');
                document.title = "Pomodoro";
            } else {
                if (type === 'congrats') {
                    lockBadge.innerText = "🎉 Glückwunsch!";
                    timerDisplay.style.display = 'none';
                    todoText.className = "congrats-text";
                    todoText.innerText = "Glückwunsch und spiele erneut mit gleichem Land und tue etwas was dir Spaß macht.";
                    document.title = "Glückwunsch!";
                } else {
                    const task = localStorage.getItem('pomodoro_task') || "🚀 Jetzt ToDos rocken!";
                    lockBadge.innerText = "🔒 Focus Mode Active";
                    timerDisplay.style.display = 'block';
                    todoText.className = "todo-callout";
                    todoText.innerText = task;
                    updateTimerDisplay(remainingSeconds);
                }
            }
        };

        update();
        timerInterval = setInterval(update, 1000);
    }

    function updateTimerDisplay(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        const timeString = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        document.getElementById('timer').innerText = timeString;
        document.title = `(${timeString}) Pomodoro`;
    }

    // Beim Laden der Seite UI rendern und prüfen, ob noch ein Timer läuft
    window.addEventListener('load', () => {
        renderUI();
        runTimer();
    });

    // Sobald der Tab wieder aktiv wird (z. B. nach Standby oder Tab-Wechsel) sofort aktualisieren
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            runTimer();
        }
    });
</script>

</body>
</html>
