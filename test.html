<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Live Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #333333;
            background-color: #ffffff;
            line-height: 1.6;
            padding: 40px 20px;
        }
        .content-container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #444444;
        }
        .loading {
            color: #888888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="content-container">
        <div id="app-content">
            <p class="loading">Inhalte werden live geladen...</p>
        </div>
    </div>

    <script>
        // Deine Page-ID aus der URL extrahiert
        const pageId = "396c36c6fc1f80b8990ae0acaa71786f";
        
        // WICHTIG: Erstelle unter developers.notion.com eine interne Integration,
        // gib ihr Lesezugriff und teile diese Notion-Seite ("Test") mit der Integration.
        const NOTION_API_KEY = "DEIN_NOTION_INTEGRATION_TOKEN";

        async function fetchNotionBlocks() {
            const contentDiv = document.getElementById('app-content');
            
            try {
                // Da GitHub Pages CORS-Einschränkungen unterliegt, nutzen wir einen Proxy für den API-Call
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://api.notion.com/v1/blocks/${pageId}/children`)}`, {
                    headers: {
                        "Authorization": `Bearer ${NOTION_API_KEY}`,
                        "Notion-Version": "2022-06-28"
                    }
                });

                const outerData = await response.json();
                const data = JSON.parse(outerData.contents);
                
                contentDiv.innerHTML = ''; // Container leeren

                if (data.results) {
                    data.results.forEach(block => {
                        let text = "";
                        
                        // Text aus dem jeweiligen Block-Typ extrahieren
                        if (block.type === "paragraph" && block.paragraph.rich_text.length > 0) {
                            text = block.paragraph.rich_text[0].plain_text;
                            const p = document.createElement('p');
                            p.textContent = text;
                            contentDiv.appendChild(p);
                        } else if (block.type === "heading_1" && block.heading_1.rich_text.length > 0) {
                            text = block.heading_1.rich_text[0].plain_text;
                            const h1 = document.createElement('h1');
                            h1.textContent = text;
                            contentDiv.appendChild(h1);
                        }
                        // Weitere Blocktypen (heading_2, heading_3, bulleted_list_item) können hier analog ergänzt werden
                    });
                }

                if (contentDiv.children.length === 0) {
                    contentDiv.innerHTML = '<p class="loading">Keine lesbaren Textblöcke auf dieser Seite gefunden.</p>';
                }

            } catch (error) {
                console.error("Fehler beim Laden:", error);
                contentDiv.innerHTML = '<p class="loading">Fehler beim Abrufen der Live-Daten.</p>';
            }
        }

        fetchNotionBlocks();
    </script>
</body>
</html>
