<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fabians Darts</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.95);
            --primary: #2ecc71;
            --accent: #D97706;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(51, 65, 85, 0.8);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-link { text-decoration: none; color: inherit; cursor: pointer; }
        h1 { margin: 10px 0; font-weight: 800; letter-spacing: 0.05em; color: var(--accent); font-size: 1.2rem; }

        /* Screens */
        .screen { display: none; width: 90%; max-width: 400px; height: 85%; flex-direction: column; justify-content: center; }
        .active-screen { display: flex; }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .menu-option {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .menu-option.selected { border-color: var(--primary); background: rgba(46, 204, 113, 0.1); }

        .main-btn {
            background: var(--primary); color: white; border: none; padding: 15px;
            border-radius: 16px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px;
        }

        /* Game Board Styles */
        #gameScreen { width: 100vw; height: 100vh; max-width: none; padding: 5px; }
        .table-container {
            background: var(--surface); border-radius: 20px; overflow: hidden;
            border: 1px solid var(--border); flex-grow: 1; display: flex;
        }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border-bottom: 1px solid var(--border); text-align: center; }
        
        .target-col { width: 45px; font-weight: 900; background: #1e293b; color: white; }
        .hit-btn {
            width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border);
            background: #1e293b; color: white; font-size: 1.2rem; display: flex;
            align-items: center; justify-content: center; margin: 0 auto;
        }
        .hit-btn.closed { background: var(--accent); border: none; }
        
        /* X01 Styles */
        .x01-score { font-size: 2.5rem; font-weight: 900; color: var(--primary); }
        .input-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .num-btn { background: var(--surface); border: 1px solid var(--border); color: white; padding: 15px; border-radius: 12px; font-size: 1.2rem; }

        #winPopup {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }

        .stat-line { display: flex; justify-content: space-between; width: 100%; margin: 5px 0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <a href="index.html" class="header-link"><h1>DARTS</h1></a>

    <div id="modeScreen" class="screen active-screen">
        <div class="card">
            <h2 style="margin-top:0">Modus wählen</h2>
            <div class="menu-option selected" onclick="selectMode('cricket', this)">
                <span style="font-size:1.5rem">🎯</span>
                <div><strong>Cricket</strong><br><small>20 bis Bull schießen</small></div>
            </div>
            <div class="menu-option" onclick="selectMode('x01', this)">
                <span style="font-size:1.5rem">🔢</span>
                <div><strong>X01</strong><br><small>301 / 501 Punkte</small></div>
            </div>
            <div id="x01-options" style="display:none; margin-left:20px; padding:10px; border-left:2px solid var(--border)">
                <label><input type="radio" name="points" value="301" checked> 301</label>
                <label style="margin-left:15px"><input type="radio" name="points" value="501"> 501</label><br><br>
                <label><input type="checkbox" id="doubleOut"> Double Out</label>
            </div>
            <button class="main-btn" style="width:100%" onclick="nextStep(2)">WEITER</button>
        </div>
    </div>

    <div id="playerScreen" class="screen">
        <div class="card">
            <h2 style="margin-top:0">Wer spielt?</h2>
            <div id="playerList">
                <label class="menu-option"><input type="checkbox" value="Beate" checked> Beate</label>
                <label class="menu-option"><input type="checkbox" value="Michael" checked> Michael</label>
                <label class="menu-option"><input type="checkbox" value="Niclas" checked> Niclas</label>
                <label class="menu-option"><input type="checkbox" value="Fabian" checked> Fabian</label>
                <label class="menu-option"><input type="checkbox" value="Sally" checked> Sally</label>
            </div>
            <button class="main-btn" style="width:100%" onclick="startGame()">SPIEL STARTEN</button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        </div>

    <div id="winPopup">
        <h1 id="winnerTitle" style="font-size:3rem; color:var(--primary); margin-bottom:0">SIEG!</h1>
        <h2 id="winnerName" style="color:white; margin-bottom:30px">Fabian</h2>
        
        <div class="card" style="width:100%; max-width:300px">
            <h3 style="margin-top:0">Statistik</h3>
            <div id="statsContent"></div>
        </div>
        
        <button class="main-btn" style="width:200px; margin-top:20px" onclick="location.reload()">NEUES SPIEL</button>
    </div>

    <script>
        let gameMode = 'cricket';
        let players = [];
        let currentPlayerIdx = 0;
        let gameState = { data: {}, stats: {} };
        const nameMapping = { "Beate": "BGL", "Michael": "MG", "Niclas": "NG", "Fabian": "FG", "Sally": "SH" };

        function selectMode(mode, el) {
            gameMode = mode;
            document.querySelectorAll('.menu-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('x01-options').style.display = mode === 'x01' ? 'block' : 'none';
        }

        function nextStep(step) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            if(step === 2) document.getElementById('playerScreen').classList.add('active-screen');
        }

        function startGame() {
            const checked = document.querySelectorAll('#playerList input:checked');
            players = Array.from(checked).map(c => c.value);
            if(players.length === 0) return;

            nextStep(3);
            document.getElementById('gameScreen').classList.add('active-screen');

            if(gameMode === 'cricket') initCricket();
            else initX01();
        }

        // --- CRICKET LOGIC ---
        function initCricket() {
            const targets = [20, 19, 18, 17, 16, 15, 25];
            players.forEach((p, pIdx) => {
                targets.forEach(t => gameState.data[`${t}-${pIdx}`] = { hits: 0, points: 0 });
                gameState.stats[pIdx] = { totalHits: 0 };
            });
            renderCricket();
        }

        function renderCricket() {
            const targets = [20, 19, 18, 17, 16, 15, 25];
            let html = `<div class="table-container"><table><thead><tr><th class="target-col">🎯</th>`;
            players.forEach(p => html += `<th style="font-size:0.7rem; padding:10px 0">${nameMapping[p]}<br><span id="sc-${players.indexOf(p)}" style="color:var(--accent); font-size:1.1rem">0</span></th>`);
            html += `</tr></thead><tbody>`;
            
            targets.forEach(t => {
                html += `<tr><td class="target-col">${t === 25 ? 'B' : t}</td>`;
                players.forEach((_, pIdx) => {
                    const d = gameState.data[`${t}-${pIdx}`];
                    html += `<td onclick="hitCricket(${t}, ${pIdx})">
                        <div style="font-size:0.6rem; color:var(--primary); height:10px">${d.points > 0 ? '+'+d.points : ''}</div>
                        <div class="hit-btn ${d.hits>=3?'closed':''}">${getSym(d.hits)}</div>
                    </td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table></div><p onclick="location.reload()" style="text-align:center; font-size:0.7rem; color:var(--text-secondary)">Reset</p>`;
            document.getElementById('gameScreen').innerHTML = html;
            updateCricketScores();
        }

        function getSym(h) { return h===1?"/":h===2?"X":h>=3?"⦻":""; }

        function hitCricket(t, pIdx) {
            const d = gameState.data[`${t}-${pIdx}`];
            if(d.hits < 3) d.hits++;
            else if(players.some((_, i) => gameState.data[`${t}-${i}`].hits < 3)) d.points += t;
            
            gameState.stats[pIdx].totalHits++;
            renderCricket();
            checkCricketWin();
        }

        function updateCricketScores() {
            players.forEach((_, i) => {
                let s = 0;
                [20, 19, 18, 17, 16, 15, 25].forEach(t => s += gameState.data[`${t}-${i}`].points);
                document.getElementById(`sc-${i}`).innerText = s;
            });
        }

        function checkCricketWin() {
            players.forEach((p, i) => {
                const allClosed = [20, 19, 18, 17, 16, 15, 25].every(t => gameState.data[`${t}-${i}`].hits >= 3);
                const scores = players.map((_, idx) => {
                    let s = 0;
                    [20, 19, 18, 17, 16, 15, 25].forEach(t => s += gameState.data[`${t}-${idx}`].points);
                    return s;
                });
                if(allClosed && scores[i] === Math.max(...scores)) showWin(p, i);
            });
        }

        // --- X01 LOGIC ---
        let x01Score = 301;
        let isDoubleOut = false;
        function initX01() {
            x01Score = parseInt(document.querySelector('input[name="points"]:checked').value);
            isDoubleOut = document.getElementById('doubleOut').checked;
            players.forEach((p, i) => {
                gameState.data[i] = x01Score;
                gameState.stats[i] = { throws: 0, bestScore: 0 };
            });
            renderX01();
        }

        function renderX01() {
            const p = players[currentPlayerIdx];
            const score = gameState.data[currentPlayerIdx];
            document.getElementById('gameScreen').innerHTML = `
                <div class="card" style="text-align:center">
                    <h2 style="color:var(--text-secondary); margin:0">${p} am Zug</h2>
                    <div class="x01-score">${score}</div>
                    <input type="number" id="dartInput" placeholder="Punkte eingeben" style="width:100%; padding:15px; border-radius:12px; border:none; text-align:center; font-size:1.5rem">
                    <button class="main-btn" style="width:100%" onclick="submitX01()">OK</button>
                    <div style="margin-top:20px; display:flex; justify-content:space-around; font-size:0.8rem">
                        ${players.map((name, i) => `<div style="${i===currentPlayerIdx?'color:var(--primary); font-weight:bold':''}">${nameMapping[name]}: ${gameState.data[i]}</div>`).join('')}
                    </div>
                </div>
            `;
            setTimeout(() => document.getElementById('dartInput').focus(), 100);
        }

        function submitX01() {
            const input = document.getElementById('dartInput');
            const val = parseInt(input.value) || 0;
            if(val > 180) return alert("Max 180!");
            
            const oldScore = gameState.data[currentPlayerIdx];
            const newScore = oldScore - val;

            // Bust Logik
            if(newScore < 0 || (isDoubleOut && newScore === 1)) {
                alert("Überworfen!");
            } else {
                gameState.data[currentPlayerIdx] = newScore;
                if(val > gameState.stats[currentPlayerIdx].bestScore) gameState.stats[currentPlayerIdx].bestScore = val;
                if(newScore === 0) return showWin(players[currentPlayerIdx], currentPlayerIdx);
            }

            currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
            renderX01();
        }

        // --- FINALE ---
        function showWin(name, idx) {
            document.getElementById('winnerName').innerText = name;
            document.getElementById('winPopup').style.display = 'flex';
            
            // Konfetti!
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#2ecc71', '#D97706', '#ffffff'] });

            // Statistik generieren
            let statsHtml = '';
            if(gameMode === 'cricket') {
                statsHtml = `<div class="stat-line"><span>Gesamt-Treffer:</span> <strong>${gameState.stats[idx].totalHits}</strong></div>`;
            } else {
                statsHtml = `<div class="stat-line"><span>Bester Score:</span> <strong>${gameState.stats[idx].bestScore}</strong></div>`;
            }
            document.getElementById('statsContent').innerHTML = statsHtml;
        }
    </script>
</body>
</html>
