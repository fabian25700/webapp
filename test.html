<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darts Cricket & X01</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-warm: #FFF9F1;
            --card-bg: #FFFFFF;
            --primary: #2D2D2D;
            --accent: #D97706;
            --success: #059669;
            --border: #E5E7EB;
            --text-light: #6B7280;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-warm);
            color: var(--primary);
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Verhindert Wischen/Scrollen */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Laptop-Link Logik */
        .header-link { text-decoration: none; color: inherit; cursor: default; }
        @media (min-width: 1024px) { 
            .header-link { cursor: pointer; } 
            .header-link:hover { opacity: 0.7; }
        }

        h1 { margin: 10px 0; font-weight: 800; color: var(--accent); font-size: 1.2rem; }

        /* Screens */
        .screen { display: none; width: 90%; max-width: 400px; flex-direction: column; }
        .active-screen { display: flex; }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .menu-btn {
            background: var(--bg-warm);
            border: 2px solid var(--border);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
        }
        .menu-btn.selected { border-color: var(--accent); background: #FEF3C7; }

        button.main-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Cricket Board */
        #gameScreen { width: 100%; height: 100%; max-width: 100%; padding: 5px; }
        .table-container { background: white; border-radius: 15px; overflow: hidden; border: 1px solid var(--border); flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; height: 100%; }
        th, td { border-bottom: 1px solid var(--border); text-align: center; vertical-align: middle; }
        
        .name-cell { font-size: 0.7rem; font-weight: 800; color: var(--text-light); padding-top: 4px; }
        .total-score-top { font-size: 1.2rem; font-weight: 900; color: var(--accent); padding-bottom: 4px; }
        .target-col { width: 45px; font-weight: 900; background: var(--primary); color: white; font-size: 1.1rem; }
        
        .hit-btn {
            width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
            background: #F9FAFB; font-size: 1.4rem; font-weight: bold; display: flex;
            align-items: center; justify-content: center; margin: 0 auto;
        }
        .hit-btn.closed { background: var(--accent); color: white; border: none; }
        .pts-label { font-size: 0.7rem; color: var(--success); font-weight: bold; height: 12px; }

        /* X01 Board */
        .x01-container { text-align: center; padding: 20px; }
        .x01-big-score { font-size: 4rem; font-weight: 900; color: var(--accent); margin: 10px 0; }
        .num-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .num-btn { background: white; border: 1px solid var(--border); padding: 15px; border-radius: 10px; font-size: 1.3rem; font-weight: bold; }

        /* PopUp */
        #winPopup {
            display: none; position: fixed; inset: 0; background: rgba(255,249,241,0.95);
            z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .stats-table { width: 100%; margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <a href="index.html" class="header-link"><h1>CRICKET & X01</h1></a>

    <div id="screenMode" class="screen active-screen">
        <div class="card">
            <h2 style="margin-top:0">Spielmodus</h2>
            <div class="menu-btn selected" id="optCricket" onclick="setMode('cricket')">Cricket (20-15, Bull)</div>
            <div class="menu-btn" id="optX01" onclick="setMode('x01')">Normales Darts (X01)</div>
            
            <div id="x01Config" style="display:none; padding:10px; border-left:3px solid var(--accent); margin-bottom:15px;">
                <label><input type="radio" name="x01Points" value="301" checked> 301</label>
                <label style="margin-left:15px"><input type="radio" name="x01Points" value="501"> 501</label>
                <br><br>
                <label><input type="checkbox" id="doubleOut"> Double Out (Doppel Aus)</label>
            </div>
            
            <button class="main-btn" onclick="showPlayerSelection()">WEITER</button>
        </div>
    </div>

    <div id="screenPlayers" class="screen">
        <div class="card">
            <h2 style="margin-top:0">Wer spielt?</h2>
            <div id="playerList">
                <label class="menu-btn" style="display:block"><input type="checkbox" value="Beate" checked> Beate</label>
                <label class="menu-btn" style="display:block"><input type="checkbox" value="Michael" checked> Michael</label>
                <label class="menu-btn" style="display:block"><input type="checkbox" value="Niclas" checked> Niclas</label>
                <label class="menu-btn" style="display:block"><input type="checkbox" value="Fabian" checked> Fabian</label>
                <label class="menu-btn" style="display:block"><input type="checkbox" value="Sally" checked> Sally</label>
            </div>
            <button class="main-btn" onclick="initGame()">SPIEL STARTEN</button>
        </div>
    </div>

    <div id="gameScreen" class="screen"></div>

    <div id="winPopup">
        <h2 style="margin:0; color:var(--text-light)">GEWINNER</h2>
        <h1 id="winnerName" style="font-size:3.5rem; color:var(--accent); margin:10px 0">---</h1>
        <div class="card" style="width:100%">
            <h3 style="margin-top:0">Statistik</h3>
            <div id="statsBox"></div>
        </div>
        <button class="main-btn" style="margin-top:20px" onclick="location.reload()">NEUSTART</button>
    </div>

    <script>
        const nameMap = { "Beate": "BGL", "Michael": "MG", "Niclas": "NG", "Fabian": "FG", "Sally": "SH" };
        const targets = [20, 19, 18, 17, 16, 15, 25];
        let currentMode = 'cricket';
        let players = [];
        let currentPlayerIdx = 0;
        let gameState = { data: {}, stats: {} };
        let x01Input = "";

        function setMode(m) {
            currentMode = m;
            document.getElementById('optCricket').classList.toggle('selected', m === 'cricket');
            document.getElementById('optX01').classList.toggle('selected', m === 'x01');
            document.getElementById('x01Config').style.display = m === 'x01' ? 'block' : 'none';
        }

        function showPlayerSelection() {
            document.getElementById('screenMode').classList.remove('active-screen');
            document.getElementById('screenPlayers').classList.add('active-screen');
        }

        function initGame() {
            const checked = document.querySelectorAll('#playerList input:checked');
            players = Array.from(checked).map(c => c.value);
            if(players.length === 0) return alert("Wähle Spieler!");

            document.getElementById('screenPlayers').classList.remove('active-screen');
            document.getElementById('gameScreen').classList.add('active-screen');

            if(currentMode === 'cricket') {
                players.forEach((p, i) => {
                    targets.forEach(t => gameState.data[`${t}-${i}`] = { hits: 0, points: 0 });
                    gameState.stats[i] = { clicks: 0 };
                });
                renderCricket();
            } else {
                const startPts = parseInt(document.querySelector('input[name="x01Points"]:checked').value);
                players.forEach((p, i) => {
                    gameState.data[i] = startPts;
                    gameState.stats[i] = { rounds: 0, lastScores: [] };
                });
                renderX01();
            }
        }

        // --- CRICKET ---
        function renderCricket() {
            let html = `<div class="table-container"><table><thead><tr><th class="target-col">🎯</th>`;
            players.forEach((p, i) => {
                html += `<th><div class="name-cell">${nameMap[p]}</div><div id="sc-${i}" class="total-score-top">0</div></th>`;
            });
            html += `</tr></thead><tbody>`;
            targets.forEach(t => {
                html += `<tr><td class="target-col">${t === 25 ? 'B' : t}</td>`;
                players.forEach((_, pIdx) => {
                    const d = gameState.data[`${t}-${pIdx}`];
                    html += `<td onclick="hitCricket(${t}, ${pIdx})">
                        <div class="pts-label">${d.points > 0 ? '+' + d.points : ''}</div>
                        <div class="hit-btn ${d.hits >= 3 ? 'closed' : ''}">${getSym(d.hits)}</div>
                    </td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table></div><div style="text-align:center; padding:10px" onclick="location.reload()">Reset</div>`;
            document.getElementById('gameScreen').innerHTML = html;
            updateCricketScores();
        }

        function getSym(h) { return h===1?"/":h===2?"X":h>=3?"⦻":""; }

        function hitCricket(t, pIdx) {
            const d = gameState.data[`${t}-${pIdx}`];
            if(d.hits < 3) d.hits++;
            else if(players.some((_, i) => gameState.data[`${t}-${i}`].hits < 3)) d.points += t;
            gameState.stats[pIdx].clicks++;
            renderCricket();
            checkWinCricket();
        }

        function updateCricketScores() {
            players.forEach((_, i) => {
                let s = targets.reduce((acc, t) => acc + gameState.data[`${t}-${i}`].points, 0);
                document.getElementById(`sc-${i}`).innerText = s;
            });
        }

        function checkWinCricket() {
            players.forEach((p, i) => {
                const allClosed = targets.every(t => gameState.data[`${t}-${i}`].hits >= 3);
                const scores = players.map((_, idx) => targets.reduce((acc, t) => acc + gameState.data[`${t}-${idx}`].points, 0));
                if(allClosed && scores[i] === Math.max(...scores)) triggerWin(p, 'cricket', i);
            });
        }

        // --- X01 ---
        function renderX01() {
            const p = players[currentPlayerIdx];
            const score = gameState.data[currentPlayerIdx];
            document.getElementById('gameScreen').innerHTML = `
                <div class="x01-container card">
                    <div style="font-weight:bold; color:var(--text-light)">${p} (Am Zug)</div>
                    <div class="x01-big-score">${score}</div>
                    <div style="font-size:1.5rem; height:2rem; color:var(--accent)">${x01Input || "---"}</div>
                    <div class="num-pad">
                        ${[1,2,3,4,5,6,7,8,9].map(n => `<div class="num-btn" onclick="pressX01(${n})">${n}</div>`).join('')}
                        <div class="num-btn" style="color:red" onclick="pressX01('C')">C</div>
                        <div class="num-btn" onclick="pressX01(0)">0</div>
                        <div class="num-btn" style="color:green" onclick="pressX01('E')">OK</div>
                    </div>
                    <div style="margin-top:20px; display:flex; justify-content:center; gap:10px; font-size:0.8rem">
                        ${players.map((name, i) => `<div style="padding:5px; border-radius:5px; ${i===currentPlayerIdx?'background:#FEF3C7; border:1px solid var(--accent)':''}">${nameMap[name]}: ${gameState.data[i]}</div>`).join('')}
                    </div>
                </div>
            `;
        }

        function pressX01(val) {
            if(val === 'C') x01Input = "";
            else if(val === 'E') {
                if(x01Input === "") return;
                const thrown = parseInt(x01Input);
                const oldScore = gameState.data[currentPlayerIdx];
                const doubleOut = document.getElementById('doubleOut').checked;
                
                if(thrown > 180) { alert("Max 180!"); x01Input = ""; renderX01(); return; }
                
                let newScore = oldScore - thrown;
                
                // Bust Logik
                if(newScore < 0 || (doubleOut && newScore === 1) || (newScore === 0 && doubleOut && thrown % 2 !== 0)) {
                    alert("BUST! (Überworfen)");
                } else {
                    gameState.data[currentPlayerIdx] = newScore;
                    gameState.stats[currentPlayerIdx].rounds++;
                    if(newScore === 0) { triggerWin(players[currentPlayerIdx], 'x01', currentPlayerIdx); return; }
                }
                currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
                x01Input = "";
            } else {
                if(x01Input.length < 3) x01Input += val;
            }
            renderX01();
        }

        function triggerWin(name, mode, pIdx) {
            document.getElementById('winnerName').innerText = name;
            document.getElementById('winPopup').style.display = 'flex';
            
            // Statistik
            let stats = "";
            if(mode === 'cricket') {
                stats = `<div class="stats-table">Total Klicks: ${gameState.stats[pIdx].clicks}</div>`;
            } else {
                stats = `<div class="stats-table">Benötigte Runden: ${gameState.stats[pIdx].rounds}</div>`;
            }
            document.getElementById('statsBox').innerHTML = stats;

            // Konfetti
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#D97706', '#2D2D2D', '#FFF9F1'] });
        }
    </script>
</body>
</html>
