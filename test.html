<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Fabians App</title>
    <script src="daten.js"></script>
    <style>
        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --secondary: #3498db;
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --card-hover: rgba(240, 240, 240, 0.95);
            --arrow-color: #cbd5e1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.95);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: rgba(51, 65, 85, 0.8);
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
                --card-hover: rgba(51, 65, 85, 0.95);
                --arrow-color: #475569;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        header {
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .header-title {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.04em;
            color: var(--text-primary);
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 13px;
            width: 85%;
            max-width: 360px;
            margin: auto;
            z-index: 10;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .menu-card {
            background: var(--surface);
            padding: 18px 22px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.12s ease, background 0.2s ease;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .menu-card:active { transform: scale(0.96); background: var(--card-hover); }
        .icon { font-size: 1.35rem; }
        .title { font-weight: 600; color: var(--text-primary); font-size: 1.05rem; flex-grow: 1; }
        .arrow { color: var(--arrow-color); font-size: 1rem; }

        /* Overlay Styles */
        #games-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        .overlay-content {
            width: 85%;
            max-width: 320px;
            background: var(--surface);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border);
        }

        .overlay-item {
            background: var(--bg);
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            font-weight: 600;
            border: 1px solid var(--border);
        }

        /* Game Elements */
        #game-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: none;
        }

        #score-display {
            position: fixed;
            top: 100px;
            width: 100%;
            text-align: center;
            font-weight: 900;
            color: var(--primary);
            display: none;
            z-index: 100;
            font-size: 3rem;
            opacity: 0.3;
            pointer-events: none;
        }

        #stop-btn {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 16px);
            right: 20px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: #e74c3c;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 500;
            display: none;
        }

        #instructions {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 400;
            pointer-events: none;
        }

        #instructions.visible { display: flex; }

        .instr-box {
            background: var(--surface);
            border-radius: 22px;
            padding: 26px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            animation: fadeInScale 0.3s ease forwards;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .instr-key { 
            display: inline-block; 
            background: var(--bg); 
            border: 1px solid var(--border); 
            padding: 4px 8px; 
            border-radius: 8px; 
            margin: 2px; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">FABIANS APP</div>
    </header>

    <button id="stop-btn" onclick="stopGame()">✕ STOP</button>
    <div id="score-display"><span id="current-score">0</span></div>

    <div class="menu-container" id="main-menu">
        <a href="reise_stats.html" class="menu-card">
            <span class="icon">🌍</span>
            <span class="title">Reisen</span>
            <span class="arrow">→</span>
        </a>
        <a href="Alltag.html" class="menu-card">
            <span class="icon">🏠</span>
            <span class="title">Alltag</span>
            <span class="arrow">→</span>
        </a>
        <div class="menu-card" onclick="toggleOverlay(true)">
            <span class="icon">🎮</span>
            <span class="title">Spiele</span>
            <span class="arrow">→</span>
        </div>
    </div>

    <!-- Spiele Auswahl -->
    <div id="games-overlay" onclick="toggleOverlay(false)">
        <div class="overlay-content" onclick="event.stopPropagation()">
            <h2 style="margin: 0 0 15px 0; text-align: center; color: var(--text-primary)">Spiele</h2>
            <div class="overlay-item" onclick="toggleOverlay(false); prepareGame();">
                <span class="icon">🐍</span> Snake
            </div>
            <a href="darts.html" class="overlay-item">
                <span class="icon">🎯</span> Darts
            </a>
            <button onclick="toggleOverlay(false)" style="margin-top: 10px; background: none; border: none; color: var(--text-secondary);">Schließen</button>
        </div>
    </div>

    <!-- Anleitung -->
    <div id="instructions">
        <div class="instr-box" id="instr-content"></div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score-display");
        const scoreVal = document.getElementById("current-score");
        const stopBtn = document.getElementById("stop-btn");
        const instrEl = document.getElementById("instructions");
        const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

        let gameActive = false;
        let snake, direction, nextDirection, food, gameLoop;
        let score = 0;
        let GRID = 24;

        // Touch Variablen
        let touchStartX = 0;
        let touchStartY = 0;

        const emojis = ["🇩🇪", "🇮🇹", "🇺🇸", "🇯🇵", "🇫🇷", "🇪🇸", "🇬🇧", "🇦🇹", "🇨🇭"];

        function toggleOverlay(show) {
            document.getElementById('games-overlay').style.display = show ? 'flex' : 'none';
        }

        function prepareGame() {
            instrEl.classList.add("visible");
            const content = document.getElementById("instr-content");
            
            if(isTouch) {
                content.innerHTML = `<h2>🐍 Snake</h2><p style="font-size: 2rem;">👆👇👈👉</p><p>Wische in die Richtung,<br>in die du steuern willst!</p>`;
            } else {
                content.innerHTML = `<h2>🐍 Snake</h2><p><span class="instr-key">↑</span><span class="instr-key">↓</span><span class="instr-key">←</span><span class="instr-key">→</span></p><p>Nutze die Pfeiltasten zum Steuern</p>`;
            }

            setTimeout(() => {
                instrEl.classList.remove("visible");
                startGame();
            }, 2200);
        }

        function startGame() {
            gameActive = true;
            canvas.style.display = "block";
            scoreDisplay.style.display = "block";
            stopBtn.style.display = "block";
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Grid an Bildschirmgröße anpassen
            GRID = Math.floor(canvas.width / 15); 
            if(GRID > 32) GRID = 32;

            score = 0;
            scoreVal.innerText = score;

            const startX = Math.floor(canvas.width / 2 / GRID) * GRID;
            const startY = Math.floor(canvas.height / 2 / GRID) * GRID;
            
            snake = [{x: startX, y: startY}];
            direction = {x: 0, y: -GRID};
            nextDirection = {x: 0, y: -GRID};
            
            spawnFood();
            run();
        }

        function run() {
            if (!gameActive) return;
            update();
            draw();
            setTimeout(run, Math.max(50, 120 - (score * 2)));
        }

        function update() {
            direction = nextDirection;
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Wall-Wrap (durch Wände laufen)
            if (head.x < 0) head.x = Math.floor((canvas.width - 1) / GRID) * GRID;
            if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = Math.floor((canvas.height - 1) / GRID) * GRID;
            if (head.y >= canvas.height) head.y = 0;

            // Selbst-Kollision
            if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreVal.innerText = score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Hintergrund-Leuchten
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            ctx.fillStyle = isDark ? "#0f172a" : "#f0f2f5";
            ctx.fillRect(0,0, canvas.width, canvas.height);

            // Food
            ctx.font = `${GRID - 5}px serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(food.s, food.x + GRID/2, food.y + GRID/2);

            // Snake
            snake.forEach((part, i) => {
                ctx.fillStyle = i === 0 ? "#2ecc71" : "#27ae60";
                ctx.beginPath();
                const r = 6;
                ctx.roundRect(part.x + 2, part.y + 2, GRID - 4, GRID - 4, r);
                ctx.fill();
            });
        }

        function spawnFood() {
            const cols = Math.floor(canvas.width / GRID);
            const rows = Math.floor(canvas.height / GRID);
            food = {
                x: Math.floor(Math.random() * cols) * GRID,
                y: Math.floor(Math.random() * rows) * GRID,
                s: emojis[Math.floor(Math.random() * emojis.length)]
            };
        }

        function gameOver() {
            gameActive = false;
            ctx.fillStyle = "#e74c3c";
            ctx.font = "bold 30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2);
            setTimeout(stopGame, 1500);
        }

        function stopGame() {
            gameActive = false;
            canvas.style.display = "none";
            scoreDisplay.style.display = "none";
            stopBtn.style.display = "none";
        }

        // --- STEUERUNG ---

        // Desktop (Pfeiltasten)
        window.addEventListener("keydown", e => {
            if(!gameActive) return;
            if (e.key === "ArrowUp" && direction.y === 0) nextDirection = {x: 0, y: -GRID};
            if (e.key === "ArrowDown" && direction.y === 0) nextDirection = {x: 0, y: GRID};
            if (e.key === "ArrowLeft" && direction.x === 0) nextDirection = {x: -GRID, y: 0};
            if (e.key === "ArrowRight" && direction.x === 0) nextDirection = {x: GRID, y: 0};
        });

        // Mobile (Swipe)
        window.addEventListener("touchstart", e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        window.addEventListener("touchend", e => {
            if(!gameActive) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (Math.abs(dx) > 30) {
                    if (dx > 0 && direction.x === 0) nextDirection = {x: GRID, y: 0};
                    else if (dx < 0 && direction.x === 0) nextDirection = {x: -GRID, y: 0};
                }
            } else {
                if (Math.abs(dy) > 30) {
                    if (dy > 0 && direction.y === 0) nextDirection = {x: 0, y: GRID};
                    else if (dy < 0 && direction.y === 0) nextDirection = {x: 0, y: -GRID};
                }
            }
        }, {passive: true});

    </script>
</body>
</html>
