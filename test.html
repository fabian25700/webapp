<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KC Rakete - Chronik</title>
    <style>
        :root {
            --primary: #e3000b;
            --bg: #f5f5f5;
            --surface: #ffffff;
            --text: #1a1a1a;
            --border: #d1d1d1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --surface: #1e1e1e;
                --text: #ffffff;
                --border: #333333;
            }
        }

        /* Grund-Setup gegen Zerschießen */
        * { box-sizing: border-box; }
        html, body { 
            width: 100%; 
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            font-family: -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* FIXIERTER HEADER-BEREICH */
        .header-nav-unit {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--surface);
            z-index: 1000;
            border-bottom: 2px solid var(--primary);
            padding-top: env(safe-area-inset-top);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 { margin: 10px 0 5px 0; font-size: 1.1rem; color: var(--primary); text-transform: uppercase; }

        /* DER SLIDER (DIE LINIE) */
        .slider-container {
            width: 80%;
            max-width: 400px;
            padding: 15px 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #year-label {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 5px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        /* Die Schiene */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
        }

        /* Der Knopf (Thumb) */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            margin-top: -10px; /* Zentriert den Knopf auf der Linie */
            box-shadow: 0 0 10px rgba(227, 0, 11, 0.4);
            border: 3px solid var(--surface);
        }

        /* CONTENT */
        .scroll-container {
            margin-top: 160px; /* Platz für den fixen Header */
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .timeline-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-left: 3px solid var(--primary);
            padding-left: 30px;
        }

        .event-card {
            background: var(--surface);
            margin-bottom: 40px;
            padding: 15px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            opacity: 0.4;
            transition: opacity 0.4s, transform 0.4s;
            scroll-margin-top: 180px;
        }

        .event-card.active {
            opacity: 1;
            transform: scale(1.03);
            border: 1px solid var(--primary);
        }

        /* Der Punkt auf der Linie */
        .event-card::before {
            content: '';
            position: absolute;
            left: -39px;
            top: 20px;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border-radius: 50%;
            border: 3px solid var(--bg);
        }

        .date { font-weight: bold; color: var(--primary); font-size: 0.9rem; }
        .text { margin-top: 5px; font-size: 1rem; line-height: 1.4; }

        /* DESKTOP ANPASSUNG */
        @media (min-width: 900px) {
            .header-nav-unit {
                width: 200px;
                height: 100vh;
                right: 0;
                left: auto;
                border-bottom: none;
                border-left: 2px solid var(--primary);
                justify-content: center;
            }
            .slider-container {
                transform: rotate(0deg); /* Hier kann man bei Bedarf auf Vertikal drehen */
                width: 150px;
            }
            .scroll-container {
                margin-top: 0;
                margin-right: 200px;
                padding-top: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="header-nav-unit">
        <h1>KC Rakete</h1>
        <div class="slider-container">
            <div id="year-label">2026</div>
            <input type="range" id="chronik-slider" min="0" max="10" value="0">
            <div style="font-size: 0.6rem; margin-top: 10px; opacity: 0.5;">ZIEHEN ZUM REISEN</div>
        </div>
    </div>

    <div class="scroll-container">
        <div class="timeline-wrapper" id="timeline-list">
            <!-- JS befüllt das -->
        </div>
    </div>

    <script>
        const data = [
            { d: "27. Juni 2026", txt: "Erstes <b>KC Rakete Sommerfest</b> im Vereinsheim Thorr" },
            { d: "12. Juni 2026", txt: "3. Kegeltour - Ziel noch Geheim!" },
            { d: "27. Dezember 2025", txt: "4. Kegeltunier: <b>1. Platz!</b> Sieg vor KC Govas." },
            { d: "15. November 2025", txt: "1. KC Rakete Winterfest im Bierbrunnen." },
            { d: "25. Juli 2025", txt: "Mitgliederversammlung & <b>Satzungsbeschluss</b>." },
            { d: "13. Juni 2025", txt: "2. Kegeltour - Hamburg. Elbe, Reeperbahn & Kegeln." },
            { d: "29. Dezember 2024", txt: "3. Kegeltunier: Geteilter 2. Platz." },
            { d: "14. Juni 2024", txt: "1. Kegeltour - Brüssel. Schnitzeljagd & Mottoshirts." },
            { d: "29. Dezember 2023", txt: "2. Kegeltunier: 3. Platz." },
            { d: "4. August 2022", txt: "<b>10. Kegeln</b> - Jubiläumsabend." },
            { d: "30. September 2021", txt: "Umbenennung in <b>KC Rakete</b>." },
            { d: "18. Oktober 2020", txt: "Gründung als <b>KBC Warmer Hans</b>." }
        ];

        const list = document.getElementById('timeline-list');
        const slider = document.getElementById('chronik-slider');
        const label = document.getElementById('year-label');

        function init() {
            list.innerHTML = '';
            data.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'event-card';
                div.id = 'card-' + i;
                div.innerHTML = `<div class="date">${item.d}</div><div class="text">${item.txt}</div>`;
                list.appendChild(div);
            });

            slider.max = data.length - 1;
            slider.value = 0;
            update(0);
        }

        function update(index) {
            // Alle Karten blass machen
            document.querySelectorAll('.event-card').forEach(c => c.classList.remove('active'));
            
            // Aktive Karte hervorheben
            const active = document.getElementById('card-' + index);
            active.classList.add('active');

            // Jahr im Slider-Text anzeigen
            const year = data[index].d.match(/\d{4}/);
            label.innerText = year ? year[0] : "Start";

            // Sanft dorthin scrollen
            active.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        slider.addEventListener('input', (e) => {
            update(e.target.value);
        });

        init();
    </script>
</body>
</html>
