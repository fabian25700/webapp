<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darts App</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --primary: #2ecc71;
            --accent: #D97706;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.95);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: rgba(51, 65, 85, 0.8);
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-link { text-decoration: none; color: inherit; cursor: default; }
        h1 { margin: 10px 0; font-weight: 800; color: var(--accent); font-size: 1.2rem; }

        .setup-container {
            display: flex; flex-direction: column; justify-content: center;
            height: 85%; width: 90%; max-width: 400px;
        }

        .card {
            background: var(--surface); padding: 20px; border-radius: 24px;
            box-shadow: var(--shadow); border: 1px solid var(--border);
        }

        .menu-option {
            display: flex; align-items: center; gap: 10px; padding: 15px;
            margin-bottom: 10px; background: var(--bg); border-radius: 12px;
            font-weight: 700; cursor: pointer; border: 2px solid transparent;
        }
        .menu-option.active { border-color: var(--accent); background: var(--surface); }

        #gameScreen { 
            display: none; width: 100%; height: calc(100vh - 50px); 
            padding: 5px; flex-direction: column; 
        }

        .table-container {
            background: var(--surface); border-radius: 20px; overflow: hidden;
            box-shadow: var(--shadow); border: 1px solid var(--border); flex-grow: 1; display: flex;
        }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border-bottom: 1px solid var(--border); vertical-align: middle; text-align: center; }
        .name-cell { font-size: 0.7rem; font-weight: 800; color: var(--text-secondary); padding-top: 4px; }
        .total-score { font-size: 1.1rem; font-weight: 900; color: var(--accent); padding-bottom: 4px; }
        .target-col { width: 45px; font-weight: 900; background: var(--text-primary); color: var(--bg); font-size: 1.1rem; }
        .hit-btn {
            width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--bg); font-size: 1.2rem; font-weight: bold; display: flex;
            align-items: center; justify-content: center; margin: 0 auto;
        }
        .hit-btn.closed { background: var(--accent); color: white; border: none; }
        .points-label { font-size: 0.7rem; color: var(--primary); font-weight: 700; height: 12px; }

        .x01-header {
            display: flex; justify-content: space-around; background: var(--surface);
            padding: 10px; border-radius: 20px; margin-bottom: 8px; border: 1px solid var(--border);
        }
        .x01-p-card { text-align: center; padding: 5px; border-radius: 10px; flex: 1; }
        .x01-p-card.active { background: rgba(217, 119, 6, 0.1); border: 1px solid var(--accent); }
        .x01-score-big { font-size: 1.6rem; font-weight: 900; color: var(--accent); line-height: 1; }
        .x01-avg { font-size: 0.6rem; color: var(--text-secondary); margin-top: 2px; }
        .checkout-hint { font-size: 0.7rem; color: var(--primary); font-weight: 800; min-height: 14px; margin-top: 2px; }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .num-btn { 
            background: var(--surface); border: 1px solid var(--border); padding: 18px; 
            border-radius: 15px; font-weight: 800; font-size: 1.2rem; color: var(--text-primary);
        }

        #winPopup {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 10000; align-items: center; justify-content: center;
        }
        .win-box { background: var(--surface); padding: 25px; border-radius: 32px; text-align: center; width: 85%; }
        .main-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 16px; font-size: 1rem; font-weight: 700; cursor: pointer; }
        
        .footer-controls { display: flex; justify-content: center; gap: 20px; margin-top: 5px; }
        .control-btn { color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

    <a href="index.html" class="header-link"><h1 id="title">DARTS</h1></a>

    <div id="screenMode" class="setup-container">
        <div class="card">
            <h2 style="font-size:1rem; margin-top:0">Spielmodus</h2>
            <div class="menu-option active" id="optCricket" onclick="selM('cricket')">CRICKET</div>
            <div class="menu-option" id="optX01" onclick="selM('x01')">X01 DARTS</div>
            
            <div id="xSetup" style="display:none; padding:10px; background:var(--bg); border-radius:12px; margin-bottom:10px;">
                <label><input type="radio" name="xS" value="301" checked> 301</label>
                <label style="margin-left:15px"><input type="radio" name="xS" value="501"> 501</label>
                <br><br>
                <label><input type="checkbox" id="xDO"> Double Out</label>
            </div>
            <button class="main-btn" style="width:100%" onclick="toPlayers()">WEITER</button>
        </div>
    </div>

    <div id="screenPlayers" class="setup-container" style="display:none">
        <div class="card">
            <h2 style="font-size:1rem; margin-top:0">Spieler</h2>
            <div id="pList">
                <label class="menu-option"><input type="checkbox" value="Beate" checked> Beate</label>
                <label class="menu-option"><input type="checkbox" value="Michael" checked> Michael</label>
                <label class="menu-option"><input type="checkbox" value="Niclas" checked> Niclas</label>
                <label class="menu-option"><input type="checkbox" value="Fabian" checked> Fabian</label>
                <label class="menu-option"><input type="checkbox" value="Sally" checked> Sally</label>
            </div>
            <button class="main-btn" style="width:100%; margin-top:10px;" onclick="start()">START</button>
        </div>
    </div>

    <div id="gameScreen">
        <div id="gameArea" style="flex-grow:1; display:flex; flex-direction:column;"></div>
        <div class="footer-controls">
            <span class="control-btn" onclick="undo()">↩ Zurück</span>
            <span class="control-btn" onclick="location.reload()">✖ Reset</span>
        </div>
    </div>

    <div id="winPopup">
        <div class="win-box">
            <h1 id="winN" style="font-size:2.2rem; color:var(--accent); margin:0;">---</h1>
            <p style="color:var(--text-secondary); margin-bottom:15px;">GEWONNEN!</p>
            <div id="winStats" style="text-align:left; background:var(--bg); padding:15px; border-radius:15px; font-size:0.85rem;"></div>
            <button class="main-btn" style="width:100%; margin-top:15px;" onclick="location.reload()">NEUSTART</button>
        </div>
    </div>

    <script>
        const names = { "Beate": "BGL", "Michael": "MG", "Niclas": "NG", "Fabian": "FG", "Sally": "SH" };
        const checks = { 170:"T20 T20 BE", 167:"T20 T19 BE", 164:"T20 T18 BE", 161:"T20 T17 BE", 160:"T20 T20 D20", 100:"T20 D20", 80:"T20 D10", 60:"20 D20", 50:"BE", 40:"D20", 32:"D16", 16:"D8", 8:"D4", 4:"D2", 2:"D1" };
        const bad = [179, 178, 176, 175, 173, 172, 169, 166, 163];
        let mode = 'cricket', players = [], state = { data: {}, stats: {}, idx: 0, input: "" }, history = [];

        function selM(m) {
            mode = m;
            document.getElementById('optCricket').classList.toggle('active', m==='cricket');
            document.getElementById('optX01').classList.toggle('active', m==='x01');
            document.getElementById('xSetup').style.display = m==='x01' ? 'block' : 'none';
        }

        function toPlayers() {
            document.getElementById('screenMode').style.display = 'none';
            document.getElementById('screenPlayers').style.display = 'flex';
        }

        function saveHistory() {
            history.push(JSON.stringify({data: state.data, stats: state.stats, idx: state.idx}));
            if(history.length > 50) history.shift();
        }

        function undo() {
            if(!history.length) return;
            const last = JSON.parse(history.pop());
            state.data = last.data;
            state.stats = last.stats;
            state.idx = last.idx;
            state.input = "";
            render();
        }

        function start() {
            const sel = document.querySelectorAll('#pList input:checked');
            players = Array.from(sel).map(c => c.value);
            if(!players.length) return alert("Spieler?");
            
            document.getElementById('screenPlayers').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('title').innerText = mode.toUpperCase();

            if(mode === 'cricket') {
                [20,19,18,17,16,15,25].forEach(t => players.forEach((_,i) => state.data[`${t}-${i}`] = {h:0, p:0}));
            } else {
                const s = parseInt(document.querySelector('input[name="xS"]:checked').value);
                state.conf = { s, do: document.getElementById('xDO').checked };
                players.forEach((_,i) => {
                    state.data[i] = s;
                    state.stats[i] = { d: 0, t: 0, h: 0, r: 0 };
                });
            }
            render();
        }

        function render() {
            const area = document.getElementById('gameArea');
            if(mode === 'cricket') {
                let h = `<div class="table-container"><table><thead><tr><th class="target-col" rowspan="2">🎯</th>`;
                players.forEach((p, i) => h += `<th class="name-cell">${names[p]}</th>`);
                h += `</tr><tr>`;
                players.forEach((_, i) => h += `<th id="sc-${i}" class="total-score">0</th>`);
                h += `</tr></thead><tbody>`;
                [20,19,18,17,16,15,25].forEach(t => {
                    h += `<tr><td class="target-col">${t==25?'B':t}</td>`;
                    players.forEach((_, i) => {
                        const cell = state.data[`${t}-${i}`];
                        h += `<td onclick="hitC(${t},${i})"><div class="points-label">${cell.p>0?'+'+cell.p:''}</div><div class="hit-btn ${cell.h>=3?'closed':''}">${cell.h==1?'/':cell.h==2?'X':cell.h>=3?'⦻':''}</div></td>`;
                    });
                    h += `</tr>`;
                });
                area.innerHTML = h + `</tbody></table></div>`;
                players.forEach((_,i) => {
                    let sum = [20,19,18,17,16,15,25].reduce((a, t) => a + state.data[`${t}-${i}`].p, 0);
                    document.getElementById(`sc-${i}`).innerText = sum;
                });
            } else {
                let h = `<div class="x01-header">`;
                players.forEach((p, i) => {
                    const pts = state.data[i];
                    const avg = state.stats[i].r > 0 ? (state.stats[i].t / state.stats[i].r).toFixed(1) : "0.0";
                    h += `<div class="x01-p-card ${i===state.idx?'active':''}">
                        <div class="name-cell">${names[p]}</div>
                        <div class="x01-score-big">${pts}</div>
                        <div class="x01-avg">Ø ${avg}</div>
                        <div class="checkout-hint">${checks[pts] || (pts<=158?"Checkbar":"")}</div>
                    </div>`;
                });
                h += `</div><div class="card" style="margin:5px auto; text-align:center; width:100%">
                    <div style="font-size:0.7rem; color:var(--text-secondary)">Am Zug: ${players[state.idx]}</div>
                    <div style="font-size:2.5rem; font-weight:900; height:3rem;">${state.input || "0"}</div>
                    <div class="numpad">
                        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="num-btn" onclick="press(${n})">${n}</button>`).join('')}
                        <button class="num-btn" style="color:red" onclick="press('C')">C</button>
                        <button class="num-btn" onclick="press(0)">0</button>
                        <button class="num-btn" style="color:var(--primary)" onclick="sub()">OK</button>
                    </div>
                </div>`;
                area.innerHTML = h;
            }
        }

        function hitC(t, i) {
            saveHistory();
            const c = state.data[`${t}-${i}`];
            if(c.h < 3) c.h++; else if(players.some((_,idx) => state.data[`${t}-${idx}`].h < 3)) c.p += t;
            render(); checkC();
        }

        function press(v) {
            if(v==='C') state.input = ""; else if(state.input.length < 3) state.input += v;
            render();
        }

        function sub() {
            const v = parseInt(state.input) || 0;
            if(v > 180 || bad.includes(v)) { alert("Ungültig!"); state.input = ""; return render(); }
            const cur = state.data[state.idx], nxt = cur - v, s = state.stats[state.idx];
            if(nxt < 0 || (state.conf.do && nxt === 1)) { alert("BUST!"); }
            else {
                saveHistory();
                state.data[state.idx] = nxt;
                s.r++; s.d += 3; s.t += v;
                if(v > s.h) s.h = v;
                if(nxt === 0) return win(players[state.idx], state.idx);
            }
            state.idx = (state.idx + 1) % players.length;
            state.input = ""; render();
        }

        function checkC() {
            players.forEach((p, i) => {
                const closed = [20,19,18,17,16,15,25].every(t => state.data[`${t}-${i}`].h >= 3);
                const scores = players.map((_, idx) => [20,19,18,17,16,15,25].reduce((a,t) => a + state.data[`${t}-${idx}`].p, 0));
                if(closed && scores[i] === Math.max(...scores)) win(p, i);
            });
        }

        function win(p, i) {
            document.getElementById('winN').innerText = p;
            let h = "";
            if(mode === 'x01') {
                const s = state.stats[i];
                h = `<b>Average:</b> ${(s.t/s.r).toFixed(2)}<br><b>Darts:</b> ${s.d}<br><b>High Score:</b> ${s.h}<br><b>Runden:</b> ${s.r}`;
            } else { h = "Alle Felder zu & meiste Punkte!"; }
            document.getElementById('winStats').innerHTML = h;
            document.getElementById('winPopup').style.display = 'flex';
            
            const end = Date.now() + 2000;
            (function f() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, zIndex: 10001 });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, zIndex: 10001 });
                if (Date.now() < end) requestAnimationFrame(f);
            }());
        }
    </script>
</body>
</html>
