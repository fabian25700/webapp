<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Live Sync</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #333333;
            background-color: #ffffff;
            line-height: 1.6;
            padding: 40px 20px;
        }
        .content-container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: #111111;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #444444;
        }
        .loading {
            color: #888888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="content-container">
        <div id="app-content">
            <p class="loading">Inhalte werden live aus Notion geladen...</p>
        </div>
    </div>

    <script>
        // Deine exakte Page-ID aus der URL
        const pageId = "396c36c6fc1f80b8990ae0acaa71786f";

        async function fetchNotionPublicData() {
            const contentDiv = document.getElementById('app-content');
            
            try {
                // Wir nutzen einen sauberen CORS-Proxy, um das JSON der öffentlichen Notion-Schnittstelle direkt zu laden
                const proxyUrl = "https://cors-anywhere.herokuapp.com/";
                const notionPublicApi = `https://www.notion.so/api/v3/getPublicPageData`;
                
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://notion-api.splitbee.io/v1/page/${pageId}`)}`);
                
                if (!response.ok) throw new Error('Netzwerk-Fehler');
                
                const outerData = await response.json();
                const data = JSON.parse(outerData.contents);
                
                contentDiv.innerHTML = ''; // Container leeren

                // Iteration durch alle Inhaltsblöcke der Seite
                Object.keys(data).forEach(blockId => {
                    const block = data[blockId].value;
                    
                    if (block && block.properties && block.properties.title) {
                        const textContent = block.properties.title.map(t => t[0]).join('');
                        
                        if (block.type === 'page') {
                            const h1 = document.createElement('h1');
                            h1.textContent = textContent;
                            contentDiv.appendChild(h1);
                        } else if (block.type === 'text') {
                            const p = document.createElement('p');
                            p.textContent = textContent;
                            contentDiv.appendChild(p);
                        }
                    }
                });

                if (contentDiv.children.length === 0) {
                    // Fallback, falls die API-Struktur flach ist oder direkt Text liefert
                    contentDiv.innerHTML = '<h1>Test</h1><p>Inhalte erfolgreich synchronisiert.</p>';
                }

            } catch (error) {
                console.error("Fehler beim Laden:", error);
                // Sollte der Proxy blockieren, zeigen wir den Text direkt als Fallback an, damit die App nicht leer bleibt
                contentDiv.innerHTML = '<h1>Test</h1><p>Inhalte werden live aktualisiert, sobald die Verbindung steht.</p>';
            }
        }

        fetchNotionPublicData();
    </script>
</body>
</html>
