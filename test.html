<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KC Rakete - Interaktive Chronik</title>
    <style>
        :root {
            --primary: #e3000b;
            --bg: #f5f5f5;
            --surface: #ffffff;
            --text: #1a1a1a;
            --border: #d1d1d1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --surface: #1e1e1e;
                --text: #ffffff;
                --border: #333333;
            }
        }

        body {
            margin: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        header {
            padding: 15px;
            text-align: center;
            background: var(--surface);
            border-bottom: 2px solid var(--primary);
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; color: var(--primary); }

        /* MAIN LAYOUT */
        main {
            display: grid;
            flex: 1;
            overflow: hidden;
            grid-template-areas: "nav" "content";
            grid-template-rows: auto 1fr;
        }

        /* DESKTOP: Nav rechts */
        @media (min-width: 900px) {
            main {
                grid-template-areas: "content nav";
                grid-template-columns: 1fr 120px;
                grid-template-rows: 1fr;
            }
        }

        /* NAVIGATION / SLIDER BEREICH */
        .nav-container {
            grid-area: nav;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        @media (min-width: 900px) {
            .nav-container {
                border-bottom: none;
                border-left: 1px solid var(--border);
            }
        }

        /* Der Slider */
        .slider-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            height: 40px;
            display: flex;
            align-items: center;
        }

        @media (min-width: 900px) {
            .slider-wrapper {
                height: 300px;
                width: 40px;
            }
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--primary);
        }

        @media (min-width: 900px) {
            input[type=range] {
                appearance: slider-vertical;
                width: 40px;
                height: 100%;
            }
        }

        .year-label {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        /* CONTENT BEREICH */
        #content-area {
            grid-area: content;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .timeline-line {
            width: 2px;
            background: var(--primary);
            position: relative;
            margin-top: 20px;
        }

        .event-node {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
            opacity: 0.3;
            transition: opacity 0.3s, transform 0.3s;
        }

        .event-node.active {
            opacity: 1;
            transform: scale(1.02);
        }

        .content-card {
            background: var(--surface);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 5px solid var(--primary);
        }

        .node-dot {
            position: absolute;
            left: -26px;
            top: 20px;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            border: 3px solid var(--bg);
        }

        .date-text { font-size: 0.8rem; font-weight: bold; color: var(--primary); }
        .desc-text { font-size: 1rem; margin-top: 5px; line-height: 1.4; }

    </style>
</head>
<body>

    <header>
        <h1>KC Rakete Chronik</h1>
    </header>

    <main>
        <div class="nav-container">
            <div id="active-year" class="year-label">2026</div>
            <div class="slider-wrapper">
                <input type="range" id="year-slider" min="0" max="100" value="0">
            </div>
            <div style="font-size: 0.7rem; opacity: 0.6; margin-top: 10px;">Zieh mich!</div>
        </div>

        <div id="content-area">
            <div class="timeline-line" id="timeline-target">
                <!-- Content wird per JS generiert -->
            </div>
        </div>
    </main>

    <script>
        const data = [
            { d: "27. Juni 2026", txt: "Erstes Sommerfest Thorr" },
            { d: "12. Juni 2026", txt: "3. Kegeltour" },
            { d: "27. Dezember 2025", txt: "1. Platz beim Weihnachtstunier!" },
            { d: "15. November 2025", txt: "1. KC Rakete Winterfest" },
            { d: "25. Juli 2025", txt: "Satzungsbeschluss & Vorstandswahl" },
            { d: "13. Juni 2025", txt: "2. Kegeltour - Hamburg" },
            { d: "7. Februar 2025", txt: "Wechsel ins Brauhaus zur Krone" },
            { d: "29. Dezember 2024", txt: "3. Kegeltunier - 2. Platz" },
            { d: "14. Juni 2024", txt: "1. Kegeltour - Brüssel" },
            { d: "29. Dezember 2023", txt: "2. Kegeltunier - 3. Platz" },
            { d: "4. August 2022", txt: "10. Kegeln" },
            { d: "30. September 2021", txt: "Umbenennung in KC Rakete" },
            { d: "18. Oktober 2020", txt: "Gründung als KBC Warmer Hans" }
        ];

        const timelineTarget = document.getElementById('timeline-target');
        const slider = document.getElementById('year-slider');
        const yearDisplay = document.getElementById('active-year');
        const contentArea = document.getElementById('content-area');

        function render() {
            timelineTarget.innerHTML = '';
            data.forEach((item, index) => {
                const node = document.createElement('div');
                node.className = 'event-node';
                node.id = `node-${index}`;
                node.innerHTML = `
                    <div class="node-dot"></div>
                    <div class="content-card">
                        <div class="date-text">${item.d}</div>
                        <div class="desc-text">${item.txt}</div>
                    </div>
                `;
                timelineTarget.appendChild(node);
            });

            // Slider Einstellungen
            slider.max = data.length - 1;
            slider.value = 0; // Start bei Neu (oben)
            updateActiveNode(0);
        }

        function updateActiveNode(index) {
            // Alle deaktivieren
            document.querySelectorAll('.event-node').forEach(n => n.classList.remove('active'));
            
            // Aktuelle aktivieren
            const activeNode = document.getElementById(`node-${index}`);
            if(activeNode) {
                activeNode.classList.add('active');
                
                // Jahr im Header anzeigen
                const year = data[index].d.match(/\d{4}/);
                yearDisplay.innerText = year ? year[0] : "Start";

                // Zum Element scrollen
                activeNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        slider.addEventListener('input', (e) => {
            updateActiveNode(e.target.value);
        });

        render();
    </script>
</body>
</html>
