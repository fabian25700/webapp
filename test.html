<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Routine Protokoll</title>
    <style>
        :root {
            --accent: #e67e22;
            --accent-soft: rgba(230, 126, 34, 0.1);
            --success: #27ae60;
            --success-soft: rgba(39, 174, 96, 0.1);
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #2d3f55;
                --border-light: #253347;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg);
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            border-bottom: 1px solid var(--border-light);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        
        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border);
            text-decoration: none; color: var(--text-primary); box-shadow: var(--shadow);
        }

        header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; }

        .progress-container { background: var(--border-light); height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
        .progress-bar { background: var(--accent); height: 100%; transition: width 0.3s ease; }
        .stats-text { font-size: 0.7rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

        main { padding: 16px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

        .category-group { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); position: relative; }
        
        .category-header {
            padding: 16px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; user-select: none; transition: background 0.2s;
        }
        .category-header:active { background: var(--border-light); }

        .category-title { font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 10px; }
        .category-icon { width: 28px; height: 28px; background: var(--accent-soft); color: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        
        .arrow { font-size: 0.8rem; color: var(--text-secondary); transition: transform 0.3s ease; }
        .category-group.open .arrow { transform: rotate(180deg); }

        .category-content { display: none; padding: 0 16px 16px; flex-direction: column; gap: 8px; border-top: 1px solid var(--border-light); padding-top: 16px; }
        .category-group.open .category-content { display: flex; }

        .bucket-card {
            background: var(--bg); border-radius: 12px; border: 1px solid var(--border);
            padding: 14px 16px; display: flex; align-items: center; gap: 14px;
            cursor: pointer; user-select: none; transition: all 0.2s ease;
        }
        .bucket-card:active { transform: scale(0.99); }
        .bucket-card.done { opacity: 0.6; border-style: dashed; }

        .status-circle {
            width: 22px; height: 22px; border-radius: 6px;
            border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .done .status-circle { background: var(--success); border-color: var(--success); }
        .status-circle::after { content: '✓'; color: white; font-size: 13px; font-weight: bold; display: none; }
        .done .status-circle::after { display: block; }

        .location-name { font-weight: 600; font-size: 0.95rem; flex: 1; }
        
        /* Erfolgsanimation für Routinen */
        .success-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--success); display: flex; align-items: center; justify-content: center;
            z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .success-overlay.animate { animation: targetReached 2s forwards; }
        .success-text { color: white; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.1em; }

        @keyframes targetReached {
            0% { opacity: 0; }
            15% { opacity: 0.95; }
            85% { opacity: 0.95; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.02); }
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <a href="index.html" class="back-btn">←</a>
        <h1>Routinen</h1>
        <div class="stats-text" id="stats-summary">0 / 0</div>
    </div>
    <div class="progress-container"><div class="progress-bar" id="progress-bar" style="width: 0%"></div></div>
</header>

<main id="category-container">
    <div class="category-group" data-routine="Abendroutine">
        <div class="category-header" onclick="toggleGroup(this)">
            <div class="category-title">
                <div class="category-icon">🌙</div>
                Abendroutine
                <span class="counter-text" style="font-size: 0.65rem; color: var(--text-secondary); opacity: 0.7"></span>
            </div>
            <div class="arrow">▼</div>
        </div>
        <div class="success-overlay"><div class="success-text">Fokus Gehalten ✓</div></div>
        <div class="category-content" data-habits='[
            "Reflektion & Tagesabschluss im Journal",
            "Digital Detox (Bildschirme aus ab 21:30)",
            "Setup für den nächsten Tag vorbereiten",
            "Lüften & Dehnen für besseren Schlaf",
            "Lesen (Mindestens 15 Seiten)"
        ]'></div>
    </div>

    <div class="category-group" data-routine="2 Day Rule">
        <div class="category-header" onclick="toggleGroup(this)">
            <div class="category-title">
                <div class="category-icon">⚡</div>
                2 Day Rule
                <span class="counter-text" style="font-size: 0.65rem; color: var(--text-secondary); opacity: 0.7"></span>
            </div>
            <div class="arrow">▼</div>
        </div>
        <div class="success-overlay"><div class="success-text">Disziplin Bewiesen ✓</div></div>
        <div class="category-content" data-habits='[
            "Krafttraining / Athletik-Einheit",
            "Deep Work Block durchgezogen",
            "Ernährungsplan strikt eingehalten",
            "Keine unproduktive Ablenkung zugelassen",
            "Finanz- / Immobilien-Umsatz-Task erledigt"
        ]'></div>
    </div>
</main>

<script>
    // Konfiguration der Zielquote (0.8 = 80%)
    const TARGET_RATIO = 0.8;
    
    // Status-Speicher für die Session
    const habitState = {};

    function initApp() {
        const groups = document.querySelectorAll('.category-group');
        
        groups.forEach((group, groupIdx) => {
            const contentDiv = group.querySelector('.category-content');
            const habits = JSON.parse(contentDiv.getAttribute('data-habits'));
            const routineName = group.getAttribute('data-routine');
            
            habitState[routineName] = {
                total: habits.length,
                done: 0,
                animated: false
            };

            contentDiv.innerHTML = habits.map((habit, habitIdx) => {
                const habitId = `${groupIdx}-${habitIdx}`;
                return `
                    <div class="bucket-card" id="card-${habitId}" onclick="toggleHabit('${routineName}', '${habitId}', this)">
                        <div class="status-circle"></div>
                        <div class="location-name">${habit}</div>
                    </div>
                `;
            }).join('');
        });

        updateGlobalProgress();
    }

    function toggleGroup(header) {
        header.parentElement.classList.toggle('open');
    }

    function toggleHabit(routineName, habitId, card) {
        const isDone = card.classList.toggle('done');
        
        if (isDone) {
            habitState[routineName].done++;
        } else {
            habitState[routineName].done--;
            // Erlaubt erneutes Animieren, wenn man wieder unter die Grenze fällt
            habitState[routineName].animated = false; 
        }

        const routine = habitState[routineName];
        const currentRatio = routine.done / routine.total;

        // Trigger für die 80%-Animation
        if (currentRatio >= TARGET_RATIO && !routine.animated) {
            routine.animated = true;
            const overlay = card.closest('.category-group').querySelector('.success-overlay');
            overlay.classList.add('animate');
            setTimeout(() => {
                overlay.classList.remove('animate');
            }, 2000);
        }

        updateGlobalProgress();
    }

    function updateGlobalProgress() {
        let totalHabits = 0;
        let totalDone = 0;

        const groups = document.querySelectorAll('.category-group');
        groups.forEach(group => {
            const routineName = group.getAttribute('data-routine');
            const state = habitState[routineName];
            
            totalHabits += state.total;
            totalDone += state.done;

            // Counter im Header der Routine aktualisieren
            group.querySelector('.counter-text').textContent = `(${state.done}/${state.total})`;
        });

        // Globalen Header aktualisieren
        const percent = totalHabits > 0 ? Math.round((totalDone / totalHabits) * 100) : 0;
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('stats-summary').textContent = `${totalDone} / ${totalHabits} Erledigt`;
    }

    window.onload = initApp;
</script>
</body>
</html>
