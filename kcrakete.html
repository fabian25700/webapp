<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Team Generator - Kegeln</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --primary: #3498db;
            --accent: #e67e22;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.95);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: rgba(51, 65, 85, 0.8);
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin: 20px 0; font-weight: 800; color: var(--accent); font-size: 1.6rem; letter-spacing: 0.05em; }

        .container {
            width: 95%;
            max-width: 450px;
            padding-bottom: 40px;
        }

        .card {
            background: var(--surface);
            padding: 25px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
        }

        .grid-players {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .menu-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            transition: opacity 0.2s;
        }

        .menu-option input:checked + span {
            color: var(--primary);
        }

        .settings-box {
            background: var(--bg);
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 20px;
            border: 1px dashed var(--text-secondary);
        }

        .team-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .radio-btn {
            display: none;
        }

        .radio-label {
            padding: 10px 25px;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
        }

        .radio-btn:checked + .radio-label {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .main-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0px #b35d10;
        }

        .main-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #b35d10;
        }

        .team-result-box {
            margin-top: 15px;
            padding: 15px;
            background: var(--bg);
            border-radius: 15px;
            text-align: left;
            border-left: 6px solid var(--primary);
        }

        .team-title {
            color: var(--primary);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .team-members {
            font-size: 1.15rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <h1>KEGEL-TEAMS</h1>

    <div class="container">
        <!-- SETUP SCREEN -->
        <div id="setupScreen" class="card">
            <div class="settings-box">
                <div style="font-weight: 700; margin-bottom: 10px;">Anzahl der Teams:</div>
                <div class="team-selector">
                    <input type="radio" name="tCount" id="t2" value="2" class="radio-btn" checked>
                    <label for="t2" class="radio-label">2 TEAMS</label>
                    
                    <input type="radio" name="tCount" id="t3" value="3" class="radio-btn">
                    <label for="t3" class="radio-label">3 TEAMS</label>
                </div>
            </div>

            <div style="font-weight: 700; text-align: left; margin-left: 5px;">Spieler auswählen:</div>
            <div class="grid-players" id="pList">
                <!-- Dynamisch befüllt -->
            </div>

            <button class="main-btn" onclick="generateTeams()">TEAMS LOSEN</button>
        </div>

        <!-- RESULT SCREEN -->
        <div id="resultScreen" class="card" style="display:none;">
            <h2 style="margin-top:0">Die Teams stehen!</h2>
            <div id="teamResults"></div>
            
            <button class="main-btn" style="background: var(--text-secondary); box-shadow: 0 4px 0px #475569; margin-top: 25px;" onclick="reset()">ZURÜCK</button>
        </div>
    </div>

    <script>
        const stammSpieler = ["Christoph", "Fabian", "Jan", "Leonard", "Marvin", "Niklas", "Tobias", "Yannick", "Cengiz", "Julian", "Neitzke"];
        const gäste = ["Gastkegler1", "Gastkegler2"];
        
        function init() {
            const pList = document.getElementById('pList');
            
            // Stammspieler (Standardmäßig checked)
            stammSpieler.forEach(name => {
                createCheckbox(pList, name, true);
            });

            // Gäste (Standardmäßig UNchecked)
            gäste.forEach(name => {
                createCheckbox(pList, name, false);
            });
        }

        function createCheckbox(container, name, isChecked) {
            const label = document.createElement('label');
            label.className = 'menu-option';
            label.innerHTML = `
                <input type="checkbox" value="${name}" ${isChecked ? 'checked' : ''}>
                <span>${name}</span>
            `;
            container.appendChild(label);
        }

        function generateTeams() {
            const sel = document.querySelectorAll('#pList input:checked');
            let players = Array.from(sel).map(c => c.value);
            const numTeams = parseInt(document.querySelector('input[name="tCount"]:checked').value);

            if(players.length < numTeams) {
                return alert("Wähle mehr Spieler aus!");
            }

            // Shuffle
            players.sort(() => Math.random() - 0.5);

            // Verteilung
            const teams = Array.from({ length: numTeams }, () => []);
            players.forEach((player, index) => {
                teams[index % numTeams].push(player);
            });

            const resultDiv = document.getElementById('teamResults');
            resultDiv.innerHTML = '';
            
            // Farben für Teams variieren
            const colors = ['#3498db', '#9b59b6', '#2ecc71'];

            teams.forEach((team, i) => {
                const box = document.createElement('div');
                box.className = 'team-result-box';
                box.style.borderLeftColor = colors[i];
                box.innerHTML = `
                    <div class="team-title" style="color: ${colors[i]}">Team ${i + 1}</div>
                    <div class="team-members">${team.join(', ')}</div>
                `;
                resultDiv.appendChild(box);
            });

            document.getElementById('setupScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
        }

        function reset() {
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('setupScreen').style.display = 'block';
        }

        init();
    </script>
</body>
</html>
