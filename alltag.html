<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hausarbeits-Wiki</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --accent: #3498db;
            --accent-soft: rgba(52, 152, 219, 0.1);
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #2d3f55;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { margin-bottom: 32px; text-align: center; }
        h1 { font-size: 1.5rem; font-weight: 800; }
        .nav-grid { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }
        .nav-card {
            background: var(--surface);
            padding: 24px;
            border-radius: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: transform 0.1s;
        }
        .nav-card:active { transform: scale(0.97); }
        .nav-icon {
            font-size: 1.5rem;
            width: 48px;
            height: 48px;
            background: var(--accent-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
        }
        .nav-text div:first-child { font-weight: 700; font-size: 1.1rem; }
        .nav-text div:last-child { font-size: 0.85rem; color: var(--text-secondary); }
    </style>
</head>
<body>
    <header>
        <h1>Hausarbeits-Wiki</h1>
    </header>
    <main class="nav-grid">
        <a href="ernaehrung.html" class="nav-card">
            <div class="nav-icon">🍳</div>
            <div class="nav-text">
                <div>Ernährung</div>
                <div>Kochen & Basics</div>
            </div>
        </a>
        <a href="kleidung.html" class="nav-card">
            <div class="nav-icon">👕</div>
            <div class="nav-text">
                <div>Kleidung</div>
                <div>Waschen & Trocknen</div>
            </div>
        </a>
        <a href="reinigung.html" class="nav-card">
            <div class="nav-icon">🧹</div>
            <div class="nav-text">
                <div>Reinigung</div>
                <div>Spülmaschine & Haushalt</div>
            </div>
        </a>
    </main>
</body>
</html>
