<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Alltag</title>
    <style>
        :root {
            --accent: #e67e22;
            --accent-soft: rgba(230, 126, 34, 0.1);
            --bg: #f0f2f5;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --surface-2: #162032;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --text-tertiary: #64748b;
                --border: #2d3f55;
                --border-light: #253347;
                --shadow: 0 2px 8px rgba(0,0,0,0.3);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: calc(env(safe-area-inset-bottom) + 32px);
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky; top: 0; z-index: 50;
            background: var(--bg);
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border-light);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border);
            text-decoration: none; color: var(--text-primary);
            box-shadow: var(--shadow); transition: all 0.15s;
        }
        .back-btn:active { transform: scale(0.92); opacity: 0.7; }

        header h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; }

        main { padding: 20px 16px 0; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

        .section-label {
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--text-tertiary); padding: 0 4px;
            margin-top: 16px;
        }

        .nav-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 18px; box-shadow: var(--shadow);
            text-decoration: none; display: flex; align-items: center;
            gap: 14px; padding: 16px 18px; position: relative; overflow: hidden;
            transition: transform 0.12s ease; -webkit-tap-highlight-color: transparent;
        }

        .nav-card:active { transform: scale(0.97); }

        .nav-icon {
            font-size: 1.25rem; width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent-soft); border-radius: 12px;
        }

        .nav-text { flex: 1; }
        .nav-title { font-weight: 700; font-size: 1rem; color: var(--text-primary); }
        .nav-sub { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        .nav-arrow { color: var(--text-tertiary); font-size: 1rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">←</a>
        <h1>Alltag</h1>
    </header>

    <main>
        <a href="packliste.html" class="nav-card">
            <div class="nav-icon">🧳</div>
            <div class="nav-text">
                <div class="nav-title">Packlisten</div>
                <div class="nav-sub">Urlaub & Dienstreise</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>

        <a href="ernaehrung.html" class="nav-card">
            <div class="nav-icon">🍳</div>
            <div class="nav-text">
                <div class="nav-title">Ernährung</div>
                <div class="nav-sub">Kochen & Küche</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>

        <a href="kleidung.html" class="nav-card">
            <div class="nav-icon">👕</div>
            <div class="nav-text">
                <div class="nav-title">Kleidung</div>
                <div class="nav-sub">Waschen & Trocknen</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>

        <a href="reinigung.html" class="nav-card">
            <div class="nav-icon">🧹</div>
            <div class="nav-text">
                <div class="nav-title">Reinigung</div>
                <div class="nav-sub">Spülmaschine & Haushalt</div>
            </div>
            <div class="nav-arrow">→</div>
        </a>
    </main>

</body>
</html>
