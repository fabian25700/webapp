<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Budget</title>
    <style>
        :root {
            --bg-color: #2c3e46;
            --card-bg: #374c55;
            --text-color: #ffffff;
            --text-muted: #8fa3ad;
            --primary-expense: #d65a91;
            --primary-income: #3cd070;
            --border-style: 1px dashed #526b75;
            --input-bg: #f5f5f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        header {
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            background-color: #24333a;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .container {
            padding: 15px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        .app-section {
            display: none;
        }

        .app-section.active {
            display: block;
        }

        /* Betragsanzeige */
        .amount-display {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin: 25px 0;
        }

        .amount-display.expense { color: var(--primary-expense); }
        .amount-display.income { color: var(--primary-income); }

        /* Eingabefelder */
        .input-group {
            margin-bottom: 20px;
        }

        .text-input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed #526b75;
            background-color: transparent;
            color: var(--text-color);
            font-size: 16px;
        }

        .text-input::placeholder {
            color: var(--text-muted);
        }

        .number-input {
            width: 100%;
            text-align: center;
            background: transparent;
            border: none;
            color: inherit;
            font-size: 42px;
            font-weight: bold;
            outline: none;
        }

        /* Kategorien Grid */
        .category-title {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .category-btn {
            background-color: transparent;
            border: var(--border-style);
            border-radius: 8px;
            padding: 15px 10px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .category-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .expense .category-btn.selected {
            background-color: var(--primary-expense);
            border-color: var(--primary-expense);
        }

        .income .category-btn.selected {
            background-color: var(--primary-income);
            border-color: var(--primary-income);
        }

        /* Checkbox Options */
        .options-group {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .options-group input[type="checkbox"] {
            accent-color: var(--primary-expense);
            width: 16px;
            height: 16px;
        }

        /* Buttons */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(0,0,0,0.2);
        }

        .expense .submit-btn { background-color: var(--primary-expense); }
        .income .submit-btn { background-color: var(--primary-income); }

        .type-toggle-container {
            display: flex;
            background-color: #24333a;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .type-toggle-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }

        .type-toggle-btn.active.expense-toggle {
            background-color: var(--primary-expense);
            color: white;
        }

        .type-toggle-btn.active.income-toggle {
            background-color: var(--primary-income);
            color: white;
        }

        /* Vorlagen Liste */
        .template-item {
            background-color: #ffffff;
            color: #333333;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .template-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .template-title {
            font-weight: bold;
            font-size: 16px;
        }

        .template-meta {
            font-size: 12px;
            color: #666;
        }

        .template-amount {
            font-weight: bold;
            font-size: 16px;
        }

        .template-amount.expense { color: var(--primary-expense); }
        .template-amount.income { color: var(--primary-income); }

        /* Dashboard Platzhalter */
        .dashboard-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #435b66;
        }

        .dashboard-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }

        /* Navigation Footer */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #24333a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #1c292f;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <header id="view-title">Ausgabe</header>

    <div class="container">
        
        <section id="sect-entry" class="app-section active expense">
            <div class="type-toggle-container">
                <button class="type-toggle-btn active expense-toggle" onclick="setEntryType('expense')">Ausgabe</button>
                <button class="type-toggle-btn income-toggle" onclick="setEntryType('income')">Einnahme</button>
            </div>

            <div class="input-group">
                <input type="number" step="0.01" class="number-input" id="amount" placeholder="-0,00 €" onfocus="clearPlaceholder(this)" onblur="restorePlaceholder(this)">
            </div>

            <div class="input-group">
                <input type="text" class="text-input" id="title" placeholder="Titel eintragen">
            </div>

            <div class="category-title">Kategorie</div>
            
            <div id="grid-expense" class="category-grid">
                <button class="category-btn" onclick="selectCategory(this, 'Kleidung')">
                    <svg viewBox="0 0 24 24"><path d="M12 3c-1.1 0-2 .9-2 2 .5 0 1 .5 1 1v1H9c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2h-2V6c0-.5.5-1 1-1 0-1.1-.9-2-2-2z"/></svg>
                    Kleidung
                </button>
                <button class="category-btn" onclick="selectCategory(this, 'Urlaub')">
                    <svg viewBox="0 0 24 24"><path d="M10 21H4c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v6h-2V5H4v14h6v2zm12-4.5c0-2.5-2.5-4.5-5.5-4.5S11 14 11 16.5s2.5 4.5 5.5 4.5 5.5-2 5.5-4.5z"/></svg>
                    Urlaub
                </button>
                <button class="category-btn" onclick="selectCategory(this, 'Gesundheit')">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.5 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    Gesundheit
                </button>
                <button class="category-btn" onclick="selectCategory(this, 'Freizeit')">
                    <svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 21h2.1l1.9-8.2 2.1 2V21h2v-7.5l-2.1-2 .6-3c1 .8 2.4 1.5 4.1 1.5V8c-1.5 0-2.7-.6-3.5-1.5l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.6.1-.9.2L4.3 5.9V11h2V7.4l2.5-1.1"/></svg>
                    Freizeit
                </button>
                <button class="category-btn" onclick="selectCategory(this, 'Mobilität')">
                    <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1-1.5 1zm11 0c-.83 0-1.5-.67-1.5-1s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1-1.5 1z"/></svg>
                    Mobilität
                </button>
                <button class="category-btn" onclick="selectCategory(this, 'Wohnen')">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    Wohnen
                </button>
                <button class="category-btn" onclick="selectCategory(this, 'Sonstiges')">
                    <svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7c-.83 0-1.5-.67-1.5-1.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
                    Sonstiges
                </button>
            </div>

            <div id="grid-income" class="category-grid" style="display: none;">
                <button class="category-btn" onclick="selectCategory(this, 'Lohn')">
                    <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    Lohn
                </button>
                <button class="category-btn" onclick="selectCategory(this, 'Sonstige')">
                    <svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7c-.83 0-1.5-.67-1.5-1.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
                    Sonstige
                </button>
                <button class="category-btn" onclick="selectCategory(this, 'MG')">
                    <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    MG
                </button>
            </div>

            <div class="options-group">
                <input type="checkbox" id="is_template">
                <label for="is_template">Als Vorlage speichern (Keine Duplikate)</label>
            </div>

            <button class="submit-btn" onclick="submitData()">Speichern</button>
        </section>

        <section id="sect-templates" class="app-section">
            <div id="templates-list">
                <p style="text-align: center; color: var(--text-muted);">Lade Vorlagen...</p>
            </div>
        </section>

        <section id="sect-dashboard" class="app-section">
            <div class="dashboard-card">
                <h3>Juli 2026</h3>
                <hr style="margin: 10px 0; border: none; border-top: 1px solid #526b75;">
                <div class="dashboard-row">
                    <span>Einnahmen</span>
                    <span style="color: var(--primary-income); font-weight: bold;" id="dash-income">0,00 €</span>
                </div>
                <div class="dashboard-row">
                    <span>Ausgaben</span>
                    <span style="color: var(--primary-expense); font-weight: bold;" id="dash-expense">0,00 €</span>
                </div>
                <hr style="margin: 10px 0; border: none; border-top: 1px solid #526b75;">
                <div class="dashboard-row" style="font-weight: bold;">
                    <span>Saldo</span>
                    <span id="dash-saldo">0,00 €</span>
                </div>
            </div>
        </section>
    </div>

    <footer>
        <button class="nav-item active" onclick="switchView('entry', 'Ausgabe')">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Eintragen
        </button>
        <button class="nav-item" onclick="switchView('templates', 'Vorlagen')">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Vorlagen
        </button>
        <button class="nav-item" onclick="switchView('dashboard', 'Statistik')">
            <svg viewBox="0 0 24 24"><path d="M10 20h4V4h-4v16zm-6 0h4v-8H4v8zM16 9v11h4V9h-4z"/></svg>
            Statistik
        </button>
    </footer>

    <iframe id="api-handler" src="geld_api.html" style="display:none;"></iframe>

    <script>
        let currentType = 'expense';
        let selectedCategoryValue = '';
        let apiEndpoint = '';

        // API Endpoint aus der separaten HTML Datei auslesen
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SET_API_URL') {
                apiEndpoint = event.data.url;
                loadTemplatesAndStats();
            }
        });

        function switchView(view, title) {
            document.querySelectorAll('.app-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('sect-' + view).classList.add('active');
            event.currentTarget.classList.add('active');
            
            document.getElementById('view-title').innerText = title;

            if(view === 'templates' || view === 'dashboard') {
                loadTemplatesAndStats();
            }
        }

        function setEntryType(type) {
            currentType = type;
            const sect = document.getElementById('sect-entry');
            const expGrid = document.getElementById('grid-expense');
            const incGrid = document.getElementById('grid-income');
            const amountInput = document.getElementById('amount');
            
            document.querySelectorAll('.type-toggle-btn').forEach(b => b.classList.remove('active'));
            
            if(type === 'expense') {
                sect.className = "app-section active expense";
                expGrid.style.display = 'grid';
                incGrid.style.display = 'none';
                document.querySelector('.expense-toggle').classList.add('active');
                amountInput.placeholder = "-0,00 €";
                document.getElementById('view-title').innerText = "Ausgabe";
            } else {
                sect.className = "app-section active income";
                expGrid.style.style = 'none';
                expGrid.style.display = 'none';
                incGrid.style.display = 'grid';
                document.querySelector('.income-toggle').classList.add('active');
                amountInput.placeholder = "+0,00 €";
                document.getElementById('view-title').innerText = "Einnahme";
            }
            selectedCategoryValue = '';
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
        }

        function selectCategory(btn, cat) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedCategoryValue = cat;
        }

        function clearPlaceholder(input) { input.placeholder = ''; }
        function restorePlaceholder(input) { input.placeholder = currentType === 'expense' ? "-0,00 €" : "+0,00 €"; }

        async function submitData() {
            const amount = document.getElementById('amount').value;
            const title = document.getElementById('title').value;
            const isTemplate = document.getElementById('is_template').checked ? 'ja' : 'nein';

            if(!amount || !selectedCategoryValue || !title) {
                alert('Bitte Betrag, Titel und Kategorie wählen.');
                return;
            }

            const adjustedAmount = currentType === 'expense' ? -Math.abs(amount) : Math.abs(amount);
            
            const now = new Date();
            const datum = now.toLocaleDateString('de-DE');
            const uhrzeit = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});

            const payload = {
                datum: datum,
                uhrzeit: uhrzeit,
                kategorie: selectedCategoryValue,
                titel: title,
                betrag: adjustedAmount,
                vorlage: isTemplate
            };

            if(!apiEndpoint) {
                alert('API URL konnte nicht aus geld_api.html geladen werden.');
                return;
            }

            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                alert('Erfolgreich eingetragen!');
                document.getElementById('amount').value = '';
                document.getElementById('title').value = '';
                document.getElementById('is_template').checked = false;
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('selected'));
                selectedCategoryValue = '';
            } catch(e) {
                console.error(e);
                alert('Fehler beim Speichern.');
            }
        }

        async function loadTemplatesAndStats() {
            if(!apiEndpoint) return;
            try {
                const res = await fetch(apiEndpoint);
                const data = await res.json();
                
                renderTemplates(data);
                renderStats(data);
            } catch(e) {
                console.log("Fehler beim Abruf der Daten oder CORS aktiv.");
            }
        }

        function renderTemplates(rows) {
            const container = document.getElementById('templates-list');
            container.innerHTML = '';
            
            // Filter nach Vorlage == 'ja' und entferne Duplikate basierend auf Titel + Betrag + Kategorie
            const cache = new Set();
            const uniqueTemplates = [];

            rows.forEach(row => {
                if(row.vorlage && row.vorlage.toLowerCase() === 'ja') {
                    const identifier = `${row.titel}_${row.betrag}_${row.kategorie}`;
                    if(!cache.has(identifier)) {
                        cache.add(identifier);
                        uniqueTemplates.push(row);
                    }
                }
            });

            if(uniqueTemplates.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Keine Vorlagen gespeichert.</p>';
                return;
            }

            uniqueTemplates.forEach(t => {
                const val = parseFloat(t.betrag.toString().replace(',','.'));
                const isExpense = val < 0;
                
                const div = document.createElement('div');
                div.className = 'template-item';
                div.onclick = () => fillFromTemplate(t.titel, Math.abs(val), t.kategorie, isExpense ? 'expense' : 'income');
                
                div.innerHTML = `
                    <div class="template-info">
                        <span class="template-title">${t.titel}</span>
                        <span class="template-meta">${t.kategorie}</span>
                    </div>
                    <span class="template-amount ${isExpense ? 'expense' : 'income'}">${val.toFixed(2).replace('.',',')} €</span>
                `;
                container.appendChild(div);
            });
        }

        function fillFromTemplate(titel, betrag, kategorie, type) {
            switchView('entry', type === 'expense' ? 'Ausgabe' : 'Einnahme');
            setEntryType(type);
            document.getElementById('amount').value = betrag;
            document.getElementById('title').value = titel;
            
            // Kategorie-Button automatisch selektieren
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.innerText.trim() === kategorie) {
                    selectCategory(btn, kategorie);
                }
            });
        }

        function renderStats(rows) {
            let income = 0;
            let expense = 0;

            rows.forEach(row => {
                const val = parseFloat(row.betrag.toString().replace(',','.'));
                if(!isNaN(val)) {
                    if(val > 0) income += val;
                    else expense += val;
                }
            });

            const saldo = income + expense;

            document.getElementById('dash-income').innerText = `+${income.toFixed(2).replace('.',',')} €`;
            document.getElementById('dash-expense').innerText = `${expense.toFixed(2).replace('.',',')} €`;
            
            const saldoEl = document.getElementById('dash-saldo');
            saldoEl.innerText = `${saldo.toFixed(2).replace('.',',')} €`;
            saldoEl.style.color = saldo >= 0 ? 'var(--primary-income)' : 'var(--primary-expense)';
        }
    </script>
</body>
</html>
