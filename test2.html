<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Startseite</title>
    <script src="daten.js"></script>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #3498db;
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --card-hover: rgba(240, 240, 240, 0.95);
            --arrow-color: #cbd5e1;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.95);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: rgba(51, 65, 85, 0.8);
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
                --card-hover: rgba(51, 65, 85, 0.95);
                --arrow-color: #475569;
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s ease;
        }

        header {
            padding: calc(env(safe-area-inset-top) + 24px) 20px 14px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-title {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.06em;
            color: var(--text-primary);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin: 0 0 10px 10px;
            font-weight: 700;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .grid-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 768px) {
            .menu-container {
                max-width: 800px;
            }
            .grid-section.top-cards {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
            .grid-section.sub-cards {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
        }

        .menu-card {
            background: var(--surface);
            padding: 16px 20px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .grid-section.top-cards .menu-card {
            padding: 20px 24px;
            border-left: 4px solid var(--primary);
        }

        .menu-card:active { transform: scale(0.97); background: var(--card-hover); }

        @media (hover: hover) {
            .menu-card:hover {
                transform: translateY(-2px);
                border-color: var(--text-secondary);
                background: var(--card-hover);
            }
        }

        .icon { font-size: 1.4rem; line-height: 1; }
        .title { font-weight: 600; color: var(--text-primary); font-size: 1.05rem; flex-grow: 1; }
        .arrow { color: var(--arrow-color); font-size: 1rem; transition: transform 0.2s ease; }
        
        @media (hover: hover) {
            .menu-card:hover .arrow { transform: translateX(4px); }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">FABIANS APP</div>
    </header>

    <main>
        <div class="menu-container">
            <div>
                <div class="section-title">Häufig & Zuletzt genutzt</div>
                <div id="frequent-container" class="grid-section top-cards">
                    </div>
            </div>

            <div style="margin-top: 10px;">
                <div class="section-title">Weitere Anwendungen</div>
                <div id="others-container" class="grid-section sub-cards">
                    </div>
            </div>
        </div>
    </main>

    <script>
        // Definition aller verfügbaren Apps/Links inklusive der Neuzugänge
        const APPS = [
            { id: "reisen", title: "Reisen", icon: "🌍", url: "reise_stats.html" },
            { id: "habits", title: "Habits", icon: "📊", url: "https://fabian25700.github.io/webapp/habits2.html" },
            { id: "alkohol", title: "Alkohol", icon: "🍷", url: "alkohol.html" },
            { id: "alltag", title: "Alltag", icon: "🏠", url: "Alltag.html" },
            { id: "snake", title: "Snake", icon: "🐍", url: "snake.html" },
            { id: "darts", title: "Darts", icon: "🎯", url: "darts.html" },
            { id: "imposter", title: "Imposter", icon: "🕵️‍♂️", url: "imposter.html" },
            { id: "gastspiel", title: "Gastspiel", icon: "⚽", url: "gastspiel2.html" },
            { id: "kcrakete", title: "KC Rakete", icon: "🚀", url: "https://bit.ly/m/kcrakete" },
            { id: "test", title: "Test", icon: "🧪", url: "test.html" },
            { id: "test2", title: "Test 2", icon: "🧪", url: "test2.html" },
            { id: "spiele", title: "Spiele", icon: "🎮", url: "spiele.html" },
            { id: "familie", title: "Familie", icon: "🏢", url: "familie.html" }
        ];

        function getStats() {
            const defaults = {};
            APPS.forEach(app => { defaults[app.id] = { count: 0, lastUsed: 0 }; });
            const stored = localStorage.getItem("fabians_app_stats");
            return stored ? JSON.parse(stored) : defaults;
        }

        function trackClick(id) {
            const stats = getStats();
            if (stats[id]) {
                stats[id].count += 1;
                stats[id].lastUsed = Date.now();
                localStorage.setItem("fabians_app_stats", JSON.stringify(stats));
            }
        }

        function renderMenu() {
            const stats = getStats();
            const now = Date.now();
            
            const sortedApps = [...APPS].sort((a, b) => {
                const statA = stats[a.id] || { count: 0, lastUsed: 0 };
                const statB = stats[b.id] || { count: 0, lastUsed: 0 };
                
                const recencyA = statA.lastUsed ? (1 / (now - statA.lastUsed + 1)) : 0;
                const recencyB = statB.lastUsed ? (1 / (now - statB.lastUsed + 1)) : 0;
                
                const scoreA = (statA.count * 0.7) + (recencyA * 1000000 * 0.3);
                const scoreB = (statB.count * 0.7) + (recencyB * 1000000 * 0.3);
                
                return scoreB - scoreA;
            });

            const frequentApps = sortedApps.slice(0, 4);
            const otherApps = sortedApps.slice(4);

            const freqContainer = document.getElementById("frequent-container");
            const othersContainer = document.getElementById("others-container");

            freqContainer.innerHTML = "";
            othersContainer.innerHTML = "";

            frequentApps.forEach(app => {
                freqContainer.appendChild(createCard(app));
            });

            otherApps.forEach(app => {
                othersContainer.appendChild(createCard(app));
            });
        }

        function createCard(app) {
            const card = document.createElement("a");
            card.href = app.url;
            card.className = "menu-card";
            
            card.addEventListener("click", () => trackClick(app.id));

            card.innerHTML = `
                <span class="icon">${app.icon}</span>
                <span class="title">${app.title}</span>
                <span class="arrow">→</span>
            `;
            return card;
        }

        window.addEventListener("DOMContentLoaded", renderMenu);
    </script>
</body>
</html>
