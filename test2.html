<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#e0e6ed">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <title>Startseite</title>
    <script src="daten.js"></script>
    <style>
        /* ==========================================================
           Farb- & Theme-Variablen (Light/Dark)
           ========================================================== */
        :root {
            --bg-color-1: #e0e6ed;
            --bg-color-2: #f4f6f9;
            --bg: linear-gradient(135deg, var(--bg-color-1) 0%, var(--bg-color-2) 100%);
            --surface: rgba(255, 255, 255, 0.45);
            --surface-modal: rgba(255, 255, 255, 0.85);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.06);
            --bubble-shadow-hover: 0 12px 40px 0 rgba(31, 38, 135, 0.12);
            --highlight: radial-gradient(circle, rgba(243, 156, 18, 0.25) 0%, rgba(243, 156, 18, 0) 70%);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color-1: #0f172a;
                --bg-color-2: #1e293b;
                --bg: linear-gradient(135deg, var(--bg-color-1) 0%, var(--bg-color-2) 100%);
                --surface: rgba(30, 41, 59, 0.45);
                --surface-modal: rgba(30, 41, 59, 0.85);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --glass-border: rgba(255, 255, 255, 0.08);
                --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
                --bubble-shadow-hover: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
                --highlight: radial-gradient(circle, rgba(243, 156, 18, 0.3) 0%, rgba(243, 156, 18, 0) 70%);
            }
        }

        /* ==========================================================
           Basis-Reset & Grundlayout
           ========================================================== */
        * { box-sizing: border-box; }

        html {
            height: 100%;
            background: var(--bg-color-1);
            overscroll-behavior: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            margin: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* Echte fixe Hintergrund-Ebene statt html/body-Hintergrund:
           position:fixed + inset:0 deckt auf iOS zuverlässig den
           GESAMTEN sichtbaren Bereich ab (genau wie .modal-overlay
           das schon tut) - inklusive Notch oben und Home-Indicator
           unten. Ein normaler html/body-Hintergrund folgt dagegen
           der vh/dvh-Layoutgröße, die diese Sicherheitsbereiche auf
           iOS nicht zuverlässig einschließt - das waren die weißen
           Streifen oben/unten. */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: -1;
            pointer-events: none;
        }

        /* ==========================================================
           Header
           ========================================================== */
        header {
            padding: calc(env(safe-area-inset-top) + 12px) 20px 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
        }

        .header-title {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.06em;
            color: var(--text-primary);
        }

        /* ==========================================================
           Bubble-Arena (Hauptbereich mit App-Icons)
           ========================================================== */
        main {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bubble-arena {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bubble-wrapper {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .bubble {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-align: center;
            width: var(--bubble-size, 100px);
            height: var(--bubble-size, 100px);
        }

        .bubble-wrapper.top-favorit::before {
            content: '';
            position: absolute;
            width: calc(var(--bubble-size, 100px) * 1.35);
            height: calc(var(--bubble-size, 100px) * 1.35);
            background: var(--highlight);
            pointer-events: none;
            z-index: -1;
            border-radius: 50%;
        }

        .bubble:active { 
            transform: scale(0.93) !important; 
            background: rgba(255, 255, 255, 0.6);
        }

        @media (prefers-color-scheme: dark) {
            .bubble:active {
                background: rgba(30, 41, 59, 0.6);
            }
        }

        @media (hover: hover) {
            .bubble-wrapper:hover .bubble {
                background: rgba(255, 255, 255, 0.55);
                box-shadow: var(--bubble-shadow-hover);
                transform: translateY(-4px);
            }
            @media (prefers-color-scheme: dark) {
                .bubble-wrapper:hover .bubble {
                    background: rgba(30, 41, 59, 0.55);
                }
            }
            .bubble-wrapper:hover {
                z-index: 50;
            }
        }

        .bubble-icon {
            font-size: calc(var(--bubble-size, 100px) * 0.26);
            line-height: 1;
            margin-bottom: 4px;
        }

        .bubble-title {
            font-weight: 700;
            color: var(--text-primary);
            font-size: calc(var(--bubble-size, 100px) * 0.12);
            padding: 0 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        /* ==========================================================
           Info-Button (unten rechts)
           ========================================================== */
        .info-btn {
            position: fixed;
            /* max() als Absicherung: iOS liefert env(safe-area-inset-bottom)
               beim allerersten Rendern manchmal noch als 0 (bekannter
               WebKit-Bug, da der Browser zunächst nur die Notch oben
               berücksichtigt) - dadurch stand der Button zu hoch.
               max() sorgt zusätzlich für ein Mindest-Abstand. */
            bottom: max(calc(env(safe-area-inset-bottom) + 20px), 20px);
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            z-index: 600;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .info-btn:active {
            transform: scale(0.9);
        }

        /* ==========================================================
           Info-Modal (Statistik-Übersicht)
           ========================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--surface-modal);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            color: var(--text-primary);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .modal-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0 0 16px 0;
            line-height: 1.4;
        }

        .modal-body {
            overflow-y: auto;
            flex: 1;
        }

        .stat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .stat-count {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">FABIANS APP</div>
    </header>

    <main>
        <div id="bubble-arena">
        </div>
    </main>

    <button class="info-btn" id="open-info" aria-label="Informationen">i</button>

    <div class="modal-overlay" id="info-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Aufrufe (7 Tage)</h3>
                <button class="modal-close" id="close-info">&times;</button>
            </div>
            <p class="modal-desc">
                Anzahl der Aufrufe pro App in den letzten 7 Tagen.
            </p>
            <div class="modal-body" id="stats-list">
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================
           App-Daten
           ========================================================== */
        const APPS = [
            { id: "reisen", title: "Reisen", icon: "✈️", url: "reise_stats.html" },
            { id: "habits", title: "Habits", icon: "📊", url: "habits.html" },
            { id: "alkohol", title: "Alkohol", icon: "🍺", url: "alkohol.html" },
            { id: "alltag", title: "Alltag", icon: "🏠", url: "alltag.html" },
            { id: "gastspiel", title: "Gastspiel", icon: "⚽", url: "gastspiel2.html" },
            { id: "kcrakete", title: "KC Rakete", icon: "🚀", url: "https://kcrakete.github.io/webapp/startseite/" },
            { id: "test", title: "Test", icon: "🧪", url: "test.html" },
            { id: "test2", title: "Test 2", icon: "⚗️", url: "test2.html" },
            { id: "finanzen", title: "Finanzen", icon: "💰", url: "finanzen.html" },
            { id: "spiele", title: "Spiele", icon: "🎮", url: "spiele.html" },
            { id: "familie", title: "Familie", icon: "🧑‍🧑‍🧒‍🧒", url: "familie.html" },
            { id: "pomodoro", title: "Pomodoro", icon: "🎧", url: "pomo.html" },
            { id: "hopping", title: "Hopping", icon: "⚽", url: "hopping.html" }
        ];

        /* ==========================================================
           Nutzungsstatistik (localStorage)
           ========================================================== */
        function getTimestamps() {
            const stored = localStorage.getItem("fabians_app_timestamps");
            if (!stored) {
                const oldStored = localStorage.getItem("fabians_app_stats");
                const defaults = {};
                APPS.forEach(app => { defaults[app.id] = []; });
                if (oldStored) {
                    try {
                        const oldStats = JSON.parse(oldStored);
                        const now = Date.now();
                        APPS.forEach(app => {
                            if (oldStats[app.id] && oldStats[app.id].count > 0) {
                                for (let i = 0; i < oldStats[app.id].count; i++) {
                                    defaults[app.id].push(now - i * 1000);
                                }
                            }
                        });
                    } catch(e) {}
                }
                return defaults;
            }
            try {
                return JSON.parse(stored);
            } catch(e) {
                const defaults = {};
                APPS.forEach(app => { defaults[app.id] = []; });
                return defaults;
            }
        }

        function trackClick(id) {
            const timestamps = getTimestamps();
            if (!timestamps[id]) timestamps[id] = [];
            timestamps[id].push(Date.now());
            
            const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
            APPS.forEach(app => {
                if (timestamps[app.id]) {
                    timestamps[app.id] = timestamps[app.id].filter(t => t >= thirtyDaysAgo);
                }
            });
            
            localStorage.setItem("fabians_app_timestamps", JSON.stringify(timestamps));
        }

        function getAppCounts(id, timestamps, now) {
            const list = timestamps[id] || [];
            const t24h = now - (24 * 60 * 60 * 1000);
            const t7d = now - (7 * 24 * 60 * 60 * 1000);
            const t14d = now - (14 * 24 * 60 * 60 * 1000);
            const t30d = now - (30 * 24 * 60 * 60 * 1000);

            let c24h = 0, c7d = 0, c14d = 0, c30d = 0;
            list.forEach(t => {
                if (t >= t24h) c24h++;
                if (t >= t7d) c7d++;
                if (t >= t14d) c14d++;
                if (t >= t30d) c30d++;
            });

            return { c24h, c7d, c14d, c30d };
        }

        /* ==========================================================
           Statistik-Modal (Anzeige der Aufrufzahlen)
           ========================================================== */
        function renderStatsModal() {
            const timestamps = getTimestamps();
            const now = Date.now();
            const statsList = document.getElementById("stats-list");
            statsList.innerHTML = "";

            const appData = APPS.map(app => {
                const counts = getAppCounts(app.id, timestamps, now);
                return { ...app, c7d: counts.c7d, c30d: counts.c30d };
            });

            appData.sort((a, b) => {
                if (b.c7d !== a.c7d) return b.c7d - a.c7d;
                return b.c30d - a.c30d;
            });

            appData.forEach(app => {
                const item = document.createElement("div");
                item.className = "stat-item";
                item.innerHTML = `
                    <div class="stat-info">
                        <span>${app.icon}</span>
                        <span>${app.title}</span>
                    </div>
                    <div class="stat-count">${app.c7d} Aufruf${app.c7d === 1 ? '' : 'e'}</div>
                `;
                statsList.appendChild(item);
            });
        }

        /* ==========================================================
           Bubble-Layout (Sortierung, Größenberechnung, Kollisions-
           auflösung / "Physik")
           ========================================================== */
        function renderMenu() {
            const timestamps = getTimestamps();
            const now = Date.now();
            const arena = document.getElementById("bubble-arena");
            arena.innerHTML = "";

            const appsWithScores = APPS.map(app => {
                const c = getAppCounts(app.id, timestamps, now);
                const score = c.c14d + (2 * c.c7d) + (4 * c.c24h);
                return { ...app, score, counts: c };
            });

            const sortedApps = [...appsWithScores].sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                if (b.counts.c30d !== a.counts.c30d) return b.counts.c30d - a.counts.c30d;
                return a.title.localeCompare(b.title);
            });

            const containerWidth = arena.clientWidth || window.innerWidth;
            const containerHeight = arena.clientHeight || (window.innerHeight - 80);

            const isMobile = containerWidth < 768;

            let minSize, maxSize, gap;

            if (isMobile) {
                const availableArea = containerWidth * containerHeight * 0.28;
                const avgAreaPerBubble = availableArea / 13;
                const baseDiameter = Math.sqrt(avgAreaPerBubble / Math.PI) * 2;
                
                minSize = Math.max(Math.round(baseDiameter * 0.8), 70);
                maxSize = Math.min(Math.round(baseDiameter * 1.35), 115);
                gap = 10;
            } else {
                minSize = 105;
                maxSize = 150;
                gap = 20;
            }

            const scores = sortedApps.map(a => a.score);
            const maxScore = Math.max(...scores);
            const minScore = Math.min(...scores);

            let slots;
            if (isMobile) {
                slots = [
                    { x:  0.00, y: -0.16 },
                    { x: -0.22, y: -0.27 },
                    { x:  0.22, y: -0.27 },
                    { x: -0.23, y: -0.05 },
                    { x:  0.23, y: -0.05 },
                    { x:  0.00, y:  0.06 },
                    { x: -0.25, y:  0.16 },
                    { x:  0.25, y:  0.16 },
                    { x:  0.00, y: -0.37 },
                    { x: -0.24, y:  0.32 },
                    { x:  0.24, y:  0.32 },
                    { x:  0.00, y:  0.27 },
                    { x:  0.00, y:  0.39 }
                ];
            } else {
                slots = [
                    { x:  0.00, y: -0.02 },
                    { x: -0.16, y: -0.16 },
                    { x:  0.16, y: -0.16 },
                    { x: -0.17, y:  0.12 },
                    { x:  0.17, y:  0.12 },
                    { x:  0.00, y:  0.20 },
                    { x: -0.32, y: -0.02 },
                    { x:  0.32, y: -0.02 },
                    { x: -0.31, y: -0.22 },
                    { x:  0.31, y: -0.22 },
                    { x: -0.31, y:  0.20 },
                    { x:  0.31, y:  0.20 },
                    { x:  0.00, y: -0.30 }
                ];
            }

            const bubblesData = sortedApps.map((app, index) => {
                const isTopFour = index < 4;

                let factor = 0.5;
                if (maxScore !== minScore) {
                    factor = (app.score - minScore) / (maxScore - minScore);
                } else if (maxScore > 0) {
                    factor = 1.0;
                }

                const finalSize = Math.round(minSize + factor * (maxSize - minSize));
                const pos = slots[index] || { x: 0, y: 0 };

                return {
                    app,
                    isTopFour,
                    size: finalSize,
                    radius: finalSize / 2,
                    x: pos.x * containerWidth,
                    y: pos.y * containerHeight,
                    rank: index
                };
            });

            for (let step = 0; step < 80; step++) {
                for (let i = 0; i < bubblesData.length; i++) {
                    const b = bubblesData[i];
                    const pullFactor = 0.03 + (13 - b.rank) * 0.003;
                    b.x -= b.x * pullFactor;
                    b.y -= b.y * pullFactor;
                }

                for (let i = 0; i < bubblesData.length; i++) {
                    for (let j = i + 1; j < bubblesData.length; j++) {
                        const b1 = bubblesData[i];
                        const b2 = bubblesData[j];

                        const dx = b2.x - b1.x;
                        const dy = b2.y - b1.y;
                        const dist = Math.hypot(dx, dy) || 0.1;
                        const minDist = b1.radius + b2.radius + gap;

                        if (dist < minDist) {
                            const overlap = minDist - dist;
                            const weight1 = b2.radius / (b1.radius + b2.radius);
                            const weight2 = b1.radius / (b1.radius + b2.radius);

                            const forceX = (dx / dist) * overlap;
                            const forceY = (dy / dist) * overlap;

                            b1.x -= forceX * weight1;
                            b1.y -= forceY * weight1;
                            b2.x += forceX * weight2;
                            b2.y += forceY * weight2;
                        }
                    }
                }
            }

            const padding = 12;
            const minX = -containerWidth / 2 + padding;
            const maxX = containerWidth / 2 - padding;
            const minY = -containerHeight / 2 + padding;
            const maxY = containerHeight / 2 - padding;

            bubblesData.forEach(b => {
                if (b.x - b.radius < minX) b.x = minX + b.radius;
                if (b.x + b.radius > maxX) b.x = maxX - b.radius;
                if (b.y - b.radius < minY) b.y = minY + b.radius;
                if (b.y + b.radius > maxY) b.y = maxY - b.radius;
            });

            bubblesData.forEach(b => {
                const wrapper = document.createElement("div");
                wrapper.className = "bubble-wrapper";
                if (b.isTopFour) wrapper.classList.add("top-favorit");
                wrapper.style.transform = `translate(${Math.round(b.x)}px, ${Math.round(b.y)}px)`;

                const bubble = document.createElement("a");
                bubble.href = b.app.url;
                bubble.className = "bubble";
                bubble.style.setProperty("--bubble-size", `${b.size}px`);

                bubble.addEventListener("click", () => trackClick(b.app.id));

                bubble.innerHTML = `
                    <span class="bubble-icon">${b.app.icon}</span>
                    <span class="bubble-title">${b.app.title}</span>
                `;

                wrapper.appendChild(bubble);
                arena.appendChild(wrapper);
            });
        }

        /* ==========================================================
           Event-Listener (Modal, Layout-Neuberechnung)
           ========================================================== */
        const modal = document.getElementById("info-modal");
        const openBtn = document.getElementById("open-info");
        const closeBtn = document.getElementById("close-info");

        openBtn.addEventListener("click", () => {
            renderStatsModal();
            modal.classList.add("active");
        });

        closeBtn.addEventListener("click", () => {
            modal.classList.remove("active");
        });

        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.classList.remove("active");
            }
        });

        window.addEventListener("DOMContentLoaded", renderMenu);
        window.addEventListener("resize", renderMenu);

        // iOS liefert env(safe-area-inset-bottom) beim allerersten Malen
        // manchmal noch als 0 (Fokus liegt zunächst nur auf der Notch
        // oben) - ein erzwungener Reflow direkt nach dem Laden bringt
        // Safari dazu, den unteren Sicherheitsbereich neu zu berechnen,
        // damit der Info-Button korrekt tief genug sitzt.
        window.addEventListener("load", () => {
            void document.body.offsetHeight;
        });
    </script>

    <script>
        document.addEventListener('click', function(e) {
            var a = e.target.closest('a');
            if (a && a.href) {
                e.preventDefault();
                window.location.href = a.href;
            }
        }, false);
    </script>
</body>
</html>
