<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Core Protokoll</title>
    <style>
        :root {
            --accent: #e67e22;
            --accent-soft: rgba(230, 126, 34, 0.1);
            --success: #27ae60;
            --success-soft: rgba(39, 174, 96, 0.1);
            --danger: #e74c3c;
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: #2d3f55;
                --border-light: #253347;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg);
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            border-bottom: 1px solid var(--border-light);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }

        .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        
        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border);
            text-decoration: none; color: var(--text-primary); box-shadow: var(--shadow);
        }

        header h1 { font-size: 1.15rem; font-weight: 800; flex: 1; }

        .progress-container { background: var(--border-light); height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 5px; }
        .progress-bar { background: var(--success); height: 100%; transition: width 0.3s ease; }
        .stats-text { font-size: 0.7rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

        main { padding: 16px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

        .category-group { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); position: relative; }
        
        .category-header {
            padding: 16px; display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; user-select: none; transition: background 0.2s;
        }
        .category-header:active { background: var(--border-light); }

        .category-title { font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 10px; }
        .category-icon { width: 28px; height: 28px; background: var(--accent-soft); color: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        
        .arrow { font-size: 0.8rem; color: var(--text-secondary); transition: transform 0.3s ease; }
        .category-group.open .arrow { transform: rotate(180deg); }

        .category-content { display: none; padding: 0 16px 16px; flex-direction: column; gap: 8px; border-top: 1px solid var(--border-light); padding-top: 16px; }
        .category-group.open .category-content { display: flex; }

        .bucket-card {
            background: var(--bg); border-radius: 12px; border: 1px solid var(--border);
            padding: 14px 16px; display: flex; align-items: center; gap: 14px;
            cursor: pointer; user-select: none; transition: all 0.2s ease;
        }
        .bucket-card:active { transform: scale(0.99); }
        .bucket-card.done { opacity: 0.6; border-style: dashed; }

        .status-circle {
            width: 22px; height: 22px; border-radius: 6px;
            border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .done .status-circle { background: var(--success); border-color: var(--success); }
        .status-circle::after { content: '✓'; color: white; font-size: 13px; font-weight: bold; display: none; }
        .done .status-circle::after { display: block; }

        .location-name { font-weight: 600; font-size: 0.95rem; flex: 1; }
        
        .yesterday-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-left: 6px; }
        .yesterday-dot.ja { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .yesterday-dot.nein { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

        .cloud-status { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.05em; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <a href="index.html" class="back-btn">&larr;</a>
        <h1>Core Routinen</h1>
        <div class="cloud-status" id="cloud-info">Lade Vortag...</div>
    </div>
    <div class="progress-container"><div class="progress-bar" id="progress-bar" style="width: 0%"></div></div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
        <div class="stats-text" id="stats-summary">0 / 0 Unterpunkte</div>
        <div style="font-size: 0.6rem; color: var(--text-secondary); font-weight: 600; text-transform: uppercase;">Punkte: Vortagsstatus</div>
    </div>
</header>

<main id="category-container">
    <div class="category-group" data-routine="Morgenroutine">
        <div class="category-header" onclick="toggleGroup(this)">
            <div class="category-title">
                <div class="category-icon">☀️</div>
                Morgenroutine <span class="yesterday-dot" id="dot-Morgenroutine"></span>
                <span class="counter-text" style="font-size: 0.65rem; color: var(--text-secondary); margin-left: 6px;"></span>
            </div>
            <div class="arrow">▼</div>
        </div>
        <div class="category-content" data-habits='["Aufstehen ohne Snooze", "Hydration (500ml Wasser)", "10 Min Tageslicht tanken", "Kalt duschen", "Mindset-Fokus (Journal)"]'></div>
    </div>

    <div class="category-group" data-routine="Sportroutine">
        <div class="category-header" onclick="toggleGroup(this)">
            <div class="category-title">
                <div class="category-icon">🏃‍♂️</div>
                Sportroutine <span class="yesterday-dot" id="dot-Sportroutine"></span>
                <span class="counter-text" style="font-size: 0.65rem; color: var(--text-secondary); margin-left: 6px;"></span>
            </div>
            <div class="arrow">▼</div>
        </div>
        <div class="category-content" data-habits='["Athletik- / Krafteinheit", "Dehnen & Mobility", "Schritte-Ziel erreicht", "Erholungs-Check", "Protein-Zufuhr gedeckt"]'></div>
    </div>

    <div class="category-group" data-routine="Gesundheitsroutine">
        <div class="category-header" onclick="toggleGroup(this)">
            <div class="category-title">
                <div class="category-icon">🥗</div>
                Gesundheitsroutine <span class="yesterday-dot" id="dot-Gesundheitsroutine"></span>
                <span class="counter-text" style="font-size: 0.65rem; color: var(--text-secondary); margin-left: 6px;"></span>
            </div>
            <div class="arrow">▼</div>
        </div>
        <div class="category-content" data-habits='["Ernährungsplan eingehalten", "Supplements genommen", "Kein verarbeiteter Zucker", "Genug Wasser getrunken", "Intervallfasten-Fenster"]'></div>
    </div>

    <div class="category-group" data-routine="Fokusroutine">
        <div class="category-header" onclick="toggleGroup(this)">
            <div class="category-title">
                <div class="category-icon">🧠</div>
                Fokusroutine <span class="yesterday-dot" id="dot-Fokusroutine"></span>
                <span class="counter-text" style="font-size: 0.65rem; color: var(--text-secondary); margin-left: 6px;"></span>
            </div>
            <div class="arrow">▼</div>
        </div>
        <div class="category-content" data-habits='["Deep Work Block 1", "Deep Work Block 2", "Kein Social Media während Fokus", "Immobilien-Task erledigt", "Schreibtisch clean gehalten"]'></div>
    </div>

    <div class="category-group" data-routine="Abendroutine">
        <div class="category-header" onclick="toggleGroup(this)">
            <div class="category-title">
                <div class="category-icon">🌙</div>
                Abendroutine <span class="yesterday-dot" id="dot-Abendroutine"></span>
                <span class="counter-text" style="font-size: 0.65rem; color: var(--text-secondary); margin-left: 6px;"></span>
            </div>
            <div class="arrow">▼</div>
        </div>
        <div class="category-content" data-habits='["Tagesabschluss-Journal", "Digital Detox ab 21:30", "Klamotten/Setup für morgen", "Lesen (15 Seiten)", "Licht gedimmt"]'></div>
    </div>

    <div class="category-group" data-routine="Schlafroutine">
        <div class="category-header" onclick="toggleGroup(this)">
            <div class="category-title">
                <div class="category-icon">🛌</div>
                Schlafroutine <span class="yesterday-dot" id="dot-Schlafroutine"></span>
                <span class="counter-text" style="font-size: 0.65rem; color: var(--text-secondary); margin-left: 6px;"></span>
            </div>
            <div class="arrow">▼</div>
        </div>
        <div class="category-content" data-habits='["Kein Koffein nach 14:00", "Zimmer gelüftet & kühl", "Keine schweren Mahlzeiten spät", "Magnesium genommen", "Fixe Aufstehzeit vorbereitet"]'></div>
    </div>

    <div class="category-group" data-routine="TwoDayRule">
        <div class="category-header" onclick="toggleGroup(this)">
            <div class="category-title">
                <div class="category-icon">⚡</div>
                2-Day Rule <span class="yesterday-dot" id="dot-TwoDayRule"></span>
                <span class="counter-text" style="font-size: 0.65rem; color: var(--text-secondary); margin-left: 6px;"></span>
            </div>
            <div class="arrow">▼</div>
        </div>
        <div class="category-content" data-habits='["Keinen Tag komplett geskippt", "Disziplin-Notfallplan gehalten", "Mindset im Fokus gehalten"]'></div>
    </div>
</main>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyivviwQeUVE3Wn6KGvAgPctIvA3j4J1qqLSrE8IBLkMGnv_3V8IrW5TnHlOs7ktgqfxA/exec";
    
    const TARGET_RATIO = 0.8;
    const habitState = {};
    let allIdsList = [];

    function checkMidnightReset() {
        const todayStr = new Date().toDateString();
        const savedDate = localStorage.getItem('routine_date');
        if (savedDate && savedDate !== todayStr) {
            localStorage.removeItem('routine_storage');
        }
        localStorage.setItem('routine_date', todayStr);
    }

    function getSavedStates() {
        const saved = localStorage.getItem('routine_storage');
        return saved ? JSON.parse(saved) : {};
    }

    function initApp() {
        checkMidnightReset();
        const savedStates = getSavedStates();
        const groups = document.querySelectorAll('.category-group');
        allIdsList = [];
        
        groups.forEach((group, groupIdx) => {
            const contentDiv = group.querySelector('.category-content');
            const habits = JSON.parse(contentDiv.getAttribute('data-habits'));
            const routineName = group.getAttribute('data-routine');
            
            habitState[routineName] = { total: habits.length, done: 0 };

            contentDiv.innerHTML = habits.map((habit, habitIdx) => {
                const habitId = `${groupIdx}-${habitIdx}`;
                allIdsList.push(habitId);
                const isChecked = savedStates[habitId] || false;
                
                if (isChecked) { habitState[routineName].done++; }

                return `
                    <div class="bucket-card ${isChecked ? 'done' : ''}" id="card-${habitId}" onclick="toggleHabit('${routineName}', '${habitId}', this)">
                        <div class="status-circle"></div>
                        <div class="location-name">${habit}</div>
                    </div>
                `;
            }).join('');
        });

        updateGlobalProgress();
        fetchYesterdayStatus();
    }

    function toggleGroup(header) {
        header.parentElement.classList.toggle('open');
    }

    function toggleHabit(routineName, habitId, card) {
        const isDone = card.classList.toggle('done');
        
        const currentData = getSavedStates();
        currentData[habitId] = isDone;
        localStorage.setItem('routine_storage', JSON.stringify(currentData));
        
        if (isDone) { habitState[routineName].done++; } else { habitState[routineName].done--; }

        updateGlobalProgress();

        const routine = habitState[routineName];
        const achievedStatus = (routine.done / routine.total) >= TARGET_RATIO ? "ja" : "nein";
        
        syncModuleToCloud(routineName, achievedStatus);
    }

    function updateGlobalProgress() {
        let totalHabits = 0;
        let totalDone = 0;

        const groups = document.querySelectorAll('.category-group');
        groups.forEach(group => {
            const routineName = group.getAttribute('data-routine');
            const state = habitState[routineName];
            
            totalHabits += state.total;
            totalDone += state.done;

            group.querySelector('.counter-text').textContent = `(${state.done}/${state.total})`;
        });

        const percent = totalHabits > 0 ? Math.round((totalDone / totalHabits) * 100) : 0;
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('stats-summary').textContent = `${totalDone} / ${totalHabits} Unterpunkte`;
    }

    function fetchYesterdayStatus() {
        fetch(GOOGLE_SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                document.getElementById('cloud-info').textContent = "Cloud Live ✓";
                Object.keys(data).forEach(routineName => {
                    const dot = document.getElementById("dot-" + routineName);
                    if (dot) {
                        const status = data[routineName].toLowerCase();
                        dot.className = "yesterday-dot " + status;
                    }
                });
            })
            .catch(err => {
                document.getElementById('cloud-info').textContent = "Vortag-Fehler";
                console.error(err);
            });
    }

    function syncModuleToCloud(routineName, statusString) {
        document.getElementById('cloud-info').textContent = "Synchronisiere...";

        const payload = {
            routine: routineName,
            status: statusString
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            document.getElementById('cloud-info').textContent = "Cloud aktualisiert ✓";
        })
        .catch(err => {
            document.getElementById('cloud-info').textContent = "Sync Fehler";
            console.error(err);
        });
    }

    window.onload = initApp;
</script>
</body>
</html>
