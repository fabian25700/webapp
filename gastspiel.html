<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gastspiel</title>
    <style>
        :root {
            /* Hintergrundfarbe einheitlich auf die dunkle Canva-Ladefarbe oder das App-Design abgestimmt */
            --bg-color: #0f172a; 
            --header-bg: rgba(15, 23, 42, 0.95);
            --header-text: #f1f5f9;
            --header-border: #1e293b;
            --btn-bg: #1e293b;
            --btn-border: #2d3f55;
            --btn-text: #f1f5f9;
        }

        /* Heller Modus Anpassung (optional, hier für Einheitlichkeit auch dunkel gehalten während Load) */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f0f2f5;
                --header-bg: rgba(240, 242, 245, 0.95);
                --header-text: #1e293b;
                --header-border: #e2e8f0;
                --btn-bg: #ffffff;
                --btn-border: #e2e8f0;
                --btn-text: #1e293b;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--header-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--header-border);
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            text-decoration: none;
            color: var(--btn-text);
            font-size: 1.2rem;
            transition: transform 0.1s ease;
        }

        .back-btn:active { transform: scale(0.9); }

        header h1 {
            color: var(--header-text);
            font-size: 1.2rem;
            font-weight: 800;
        }

        .content-main {
            flex: 1;
            /* Nahtloser Übergang zum Header */
            margin-top: calc(env(safe-area-inset-top) + 60px); 
            display: flex;
            justify-content: center;
            align-items: center;
            /* Maximale Ausnutzung des Screens */
            padding: 0; 
        }

        .embed-wrapper {
            width: 100%;
            height: 100%;
            /* Verhindert das Aufblitzen von Passport-Grün: */
            background: var(--bg-color); 
            position: relative;
            display: flex;
            justify-content: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Erlaubt flüssiges Swipen auf Mobile */
            -webkit-overflow-scrolling: touch; 
        }

        /* Mac/Desktop Optimierung: Leichtes Padding für Ästhetik */
        @media (min-width: 1024px) {
            .content-main {
                padding: 20px 40px;
            }
            .embed-wrapper {
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                max-width: 1400px;
                height: 90%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="familie.html" class="back-btn">←</a>
        <h1>Gastspiel</h1>
    </header>

    <main class="content-main">
        <div class="embed-wrapper">
            <iframe 
                id="canva-frame"
                src="https://www.canva.com/design/DAG9SuUa3TM/jwOqqS2xwYnfBF1m4NHqMg/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
            </iframe>
        </div>
    </main>

    <script>
        // Fokus-Management für Mac (Pfeiltasten-Support verbessern)
        window.onload = () => {
            const frame = document.getElementById('canva-frame');
            frame.focus();
            
            // Falls der User irgendwo hinklickt, Fokus zurück zum Iframe
            document.body.addEventListener('click', () => {
                frame.focus();
            }, true);
        };

        // Automatisches Nachladen bei Orientierungswechsel (Handy)
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                window.scrollTo(0, 0);
            }, 200);
        });
    </script>
</body>
</html>
