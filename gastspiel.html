<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gastspiel</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --header-bg: rgba(240, 242, 245, 0.95);
            --header-text: #1e293b;
            --header-border: #e2e8f0;
            --btn-bg: #ffffff;
            --btn-border: #e2e8f0;
            --btn-text: #1e293b;
            --page-padding: 16px; /* Abstand zum Rand */
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --header-bg: rgba(15, 23, 42, 0.95);
                --header-text: #f1f5f9;
                --header-border: #1e293b;
                --btn-bg: #1e293b;
                --btn-border: #2d3f55;
                --btn-text: #f1f5f9;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: calc(env(safe-area-inset-top) + 16px) 20px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--header-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--header-border);
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            text-decoration: none;
            color: var(--btn-text);
        }

        header h1 {
            color: var(--header-text);
            font-size: 1.15rem;
            font-weight: 800;
        }

        .content-main {
            flex: 1;
            /* Abstand nach oben (Header) + Padding unten/links/rechts */
            padding: calc(env(safe-area-inset-top) + 85px) var(--page-padding) calc(env(safe-area-inset-bottom) + 20px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .embed-wrapper {
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            position: relative;
            border-radius: 16px; /* Abgerundete Ecken für den "Karten-Look" */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        @media (prefers-color-scheme: dark) {
            .embed-wrapper {
                box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Mac Anpassung */
        @media (min-width: 1024px) {
            .embed-wrapper {
                max-width: 1200px;
                max-height: 800px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="familie.html" class="back-btn">←</a>
        <h1>Gastspiel</h1>
    </header>

    <main class="content-main">
        <div class="embed-wrapper">
            <iframe 
                id="canva-frame"
                src="https://www.canva.com/design/DAG9SuUa3TM/jwOqqS2xwYnfBF1m4NHqMg/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
            </iframe>
        </div>
    </main>

    <script>
        window.onload = () => {
            document.getElementById('canva-frame').focus();
        };
    </script>
</body>
</html>
