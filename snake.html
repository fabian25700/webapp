<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🐍 Snake</title>
    <script src="daten.js"></script>
    <style>
        :root {
            --primary: #2ecc71;
            --bg: #f0f2f5;
            --surface: rgba(255, 255, 255, 0.95);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.8);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --surface: rgba(30, 41, 59, 0.95);
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border: rgba(51, 65, 85, 0.8);
                --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s ease;
        }

        #nav-header {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 16px);
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 500;
            pointer-events: none;
        }

        .btn {
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            pointer-events: auto;
            cursor: pointer;
        }

        .btn:active { transform: scale(0.95); }

        #stop-btn { display: none; }

        #game-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            display: block;
        }

        #score-display {
            position: fixed;
            top: 100px;
            width: 100%;
            text-align: center;
            font-weight: 900;
            color: var(--primary);
            z-index: 100;
            font-size: 2.2rem;
            opacity: 0.5;
            pointer-events: none;
        }

        #instructions {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 400;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #instructions.visible { opacity: 1; }

        .instr-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 26px 32px;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            animation: fadeInScale 0.35s ease;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.88); }
            to   { opacity: 1; transform: scale(1); }
        }

        .instr-box h2 { margin: 0 0 10px 0; font-size: 1.2rem; font-weight: 800; color: var(--text-primary); }
        .instr-box p { margin: 0 0 6px 0; font-size: 0.88rem; color: var(--text-secondary); line-height: 1.5; }
        .instr-key { display: inline-block; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 3px 8px; font-size: 0.78rem; font-weight: 700; color: var(--text-primary); margin: 2px; }
        .instr-touch { font-size: 1.6rem; margin: 6px 0; }
    </style>
</head>
<body>

    <div id="nav-header">
        <a href="index.html" id="back-btn" class="btn">← Zurück</a>
        <button id="stop-btn" class="btn" onclick="stopGame()">■ STOP</button>
    </div>

    <div id="score-display"><span id="current-score">0</span></div>

    <div id="instructions">
        <div class="instr-box" id="instr-content"></div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score-display");
        const scoreVal = document.getElementById("current-score");
        const instrEl = document.getElementById("instructions");
        const instrContent = document.getElementById("instr-content");
        const stopBtn = document.getElementById("stop-btn");
        const backBtn = document.getElementById("back-btn");

        let gameActive = false;
        let snake, direction, nextDirection, food;
        let score = 0;

        const laender = (typeof MEINE_REISEN !== 'undefined')
            ? MEINE_REISEN.map(r => r.flagge || "📍")
            : ["🇩🇪","🇮🇹","🇺🇸"];

        const GRID = 32;
        const SPEED_START = 110;
        const SPEED_MIN = 45;
        const SPEED_STEP = 5;

        // Startet die Anleitung direkt beim Laden der Seite
        window.addEventListener("DOMContentLoaded", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            showInstructions();
        });

        function showInstructions() {
            if (!isTouchDevice) {
                instrContent.innerHTML = `<h2>🐍 Snake</h2><p>Pfeiltasten zum Steuern</p><p><span class="instr-key">↑</span> <span class="instr-key">↓</span> <span class="instr-key">←</span> <span class="instr-key">→</span></p>`;
            } else {
                instrContent.innerHTML = `<h2>🐍 Snake</h2><div class="instr-touch">👆</div><p>Wische in die Richtung,<br>in die du steuern willst.</p>`;
            }
            instrEl.classList.add("visible");
            setTimeout(() => { 
                instrEl.classList.remove("visible"); 
                startGame(); 
            }, 2500);
        }

        function startGame() {
            gameActive = true;
            backBtn.style.display = "none";
            stopBtn.style.display = "block";
            score = 0;
            scoreVal.innerText = score;

            const startX = Math.floor(canvas.width / 2 / GRID) * GRID;
            const startY = Math.floor(canvas.height / 2 / GRID) * GRID;
            snake = [{ x: startX, y: startY }, { x: startX - GRID, y: startY }, { x: startX - GRID * 2, y: startY }];
            direction = { x: GRID, y: 0 };
            nextDirection = { x: GRID, y: 0 };
            spawnFood();
            runLoop();
        }

        function runLoop() {
            if (!gameActive) return;
            draw();
            setTimeout(runLoop, Math.max(SPEED_MIN, SPEED_START - score * SPEED_STEP));
        }

        function stopGame() {
            gameActive = false;
            stopBtn.style.display = "none";
            backBtn.style.display = "block";
            
            // Spielfeld leeren und Hintergrund zeichnen
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            ctx.fillStyle = isDark ? "var(--bg)" : "var(--bg)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            showInstructions();
        }

        function spawnFood() {
            const cols = Math.floor(canvas.width / GRID);
            const rows = Math.floor(canvas.height / GRID);
            let pos;
            do {
                pos = { x: Math.floor(Math.random() * cols) * GRID, y: Math.floor(Math.random() * rows) * GRID };
            } while (snake.some(s => s.x === pos.x && s.y === pos.y));
            food = { ...pos, symbol: laender[Math.floor(Math.random() * laender.length)] };
        }

        function draw() {
            direction = nextDirection;
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (head.x < 0) head.x = Math.floor((canvas.width - 1) / GRID) * GRID;
            if (head.x >= canvas.width) head.x = 0;
            if (head.y < 0) head.y = Math.floor((canvas.height - 1) / GRID) * GRID;
            if (head.y >= canvas.height) head.y = 0;

            if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) { score++; scoreVal.innerText = score; spawnFood(); }
            else { snake.pop(); }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            ctx.fillStyle = isDark ? "rgba(15,23,42,0.7)" : "rgba(240,242,245,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = `${GRID - 4}px sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(food.symbol, food.x + GRID / 2, food.y + GRID / 2);

            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? "#2ecc71" : `rgba(46, 204, 113, ${Math.max(0.3, 1 - i * 0.05)})`;
                ctx.beginPath();
                ctx.roundRect(s.x + 2, s.y + 2, GRID - 4, GRID - 4, 8);
                ctx.fill();
            });
        }

        function gameOver() {
            gameActive = false;
            ctx.fillStyle = "#e74c3c";
            ctx.font = "bold 32px -apple-system";
            ctx.textAlign = "center";
            ctx.fillText(`💀 ${score} Länder`, canvas.width / 2, canvas.height / 2);
            setTimeout(stopGame, 1500);
        }

        window.addEventListener("keydown", (e) => {
            if (!gameActive) return;
            const d = direction;
            if ((e.key === "ArrowUp" || e.key === "w") && d.y === 0) nextDirection = { x: 0, y: -GRID };
            if ((e.key === "ArrowDown" || e.key === "s") && d.y === 0) nextDirection = { x: 0, y: GRID };
            if ((e.key === "ArrowLeft" || e.key === "a") && d.x === 0) nextDirection = { x: -GRID, y: 0 };
            if ((e.key === "ArrowRight" || e.key === "d") && d.x === 0) nextDirection = { x: GRID, y: 0 };
        });

        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener("touchstart", (e) => {
            if (!gameActive) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
            if (!gameActive) return;
            e.preventDefault(); 
        }, { passive: false });

        window.addEventListener("touchend", (e) => {
            if (!gameActive) return;
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);
            
            if (Math.max(absDx, absDy) < 20) return; 

            const d = direction;
            if (absDx > absDy) {
                if (dx > 0 && d.x === 0) nextDirection = { x: GRID, y: 0 };
                else if (dx < 0 && d.x === 0) nextDirection = { x: -GRID, y: 0 };
            } else {
                if (dy > 0 && d.y === 0) nextDirection = { x: 0, y: GRID };
                else if (dy < 0 && d.y === 0) nextDirection = { x: 0, y: -GRID };
            }
        }, { passive: true });

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
