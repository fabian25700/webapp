<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#b31217">
  <title>KC Rakete</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: pan-x pan-y;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #a3a3a3;
      color: #ffffff;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #4a4a4a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-bottom: 30px;
    }

    /* Header mit rot-weißem Schachbrettmuster */
    .header-banner {
      width: 100%;
      height: calc(160px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      background-color: #b31217;
      background-image: 
        linear-gradient(45deg, #a3a3a3 25%, transparent 25%), 
        linear-gradient(-45deg, #a3a3a3 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #a3a3a3 75%), 
        linear-gradient(-45deg, transparent 75%, #a3a3a3 75%);
      background-size: 80px 80px;
      background-position: 0 0, 0 40px, 40px -40px, -40px 0px;
      position: relative;
    }

    /* Wölbung des Hauptinhalts */
    .content-card {
      width: 100%;
      background-color: #4a4a4a;
      margin-top: -30px;
      border-top-left-radius: 50% 20px;
      border-top-right-radius: 50% 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px 20px 20px;
      position: relative;
      z-index: 1;
    }

    /* Profil-Logo */
    .avatar-container {
      margin-top: -50px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: #000000;
      border: 3px solid #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .avatar-container img {
      width: 70%;
      height: auto;
      object-fit: contain;
    }

    /* Titel & Untertitel */
    .title {
      font-size: 26px;
      font-weight: bold;
      margin-top: 15px;
      text-align: center;
      color: #ffffff;
    }

    .subtitle {
      font-size: 14px;
      color: #dddddd;
      margin-top: 5px;
      margin-bottom: 20px;
      text-align: center;
      font-style: italic;
    }

    /* Termine Box */
    .events-box {
      width: 100%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      padding: 20px 15px;
      text-align: center;
      margin-bottom: 20px;
      background-color: rgba(0, 0, 0, 0.05);
    }

    .events-title {
      font-size: 28px;
      font-weight: normal;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .events-list p {
      font-size: 15px;
      line-height: 1.5;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .events-list p:last-child {
      margin-bottom: 0;
    }

    /* Buttons Grid (2-spaltig) */
    .button-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 25px;
      padding: 12px 8px;
      font-size: 14px;
      text-align: center;
      background-color: transparent;
      transition: background-color 0.2s, transform 0.1s;
      min-height: 50px;
    }

    .btn:active {
      background-color: rgba(255, 255, 255, 0.2);
      transform: scale(0.98);
    }

    /* Footer / Instagram */
    .footer {
      margin-top: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 10px;
    }

    .instagram-link {
      display: inline-block;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .instagram-link:active {
      opacity: 1;
    }

    .instagram-icon {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-banner"></div>

    <div class="content-card">
      <div class="avatar-container">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="#e63946">
          <path d="M12 2.5s-2 1.5-2 4v2.5L8 12v9.5c0 .8.7 1.5 1.5 1.5h5c.8 0 1.5-.7 1.5-1.5V12l-2-3V6.5c0-2.5-2-4-2-4z"/>
        </svg>
      </div>

      <h1 class="title">KC Rakete</h1>
      <p class="subtitle">Und niemals vergessen - KC Rakete!</p>

      <div class="events-box">
        <h2 class="events-title">Nächste Termine</h2>
        <div class="events-list">
          <p>Kegeln: jeden vierten Freitag, 18 Uhr, Zur Krone</p>
          <p>Kegeltour: 26. Mai bis 30. Mai 2027</p>
          <p>Kegelturnier: 2026 offen</p>
        </div>
      </div>

      <div class="button-grid">
        <a href="kcr_teams.html" class="btn">Teams auslosen</a>
        <a href="kcr_kallen.html" class="btn">Ewige Kallen Tabelle</a>
        <a href="#" class="btn">Kegelabgabenordnung</a>
        <a href="kcr_chronik.html" class="btn">Chronik</a>
        <a href="kcr_bot.html" class="btn">KC Bot</a>
        <a href="#" class="btn">Strafenkatalog</a>
      </div>

      <div class="footer">
        <a href="https://www.instagram.com/kcrakete" target="_blank" class="instagram-link" aria-label="Instagram">
          <svg class="instagram-icon" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
