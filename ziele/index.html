<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8fafc">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <title>Ziele</title>
    <style>
        :root {
            --accent: #d97706;
            --accent-soft: rgba(217, 119, 6, 0.12);
            --accent-glow: rgba(217, 119, 6, 0.25);
            --success: #10b981;
            --success-soft: rgba(16, 185, 129, 0.12);
            --danger: #ef4444;
            --danger-soft: rgba(239, 68, 68, 0.12);
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-card: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 14px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #090d16;
                --surface: #131c2e;
                --surface-card: #1c283e;
                --text-primary: #f8fafc;
                --text-secondary: #94a3b8;
                --text-muted: #64748b;
                --border: #233148;
                --border-light: #182335;
                --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
                --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
                --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 40px;
            opacity: 0;
            transition: opacity 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        body.loaded { opacity: 1; }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(248, 250, 252, 0.85);
            padding: calc(env(safe-area-inset-top) + 14px) 24px 14px;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (prefers-color-scheme: dark) {
            header { background: rgba(9, 13, 22, 0.85); }
        }

        .header-left { 
            display: flex; 
            align-items: center; 
        }

        .back-container { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            text-decoration: none; 
            color: var(--text-primary); 
            transition: transform 0.15s ease;
        }
        .back-container:active {
            transform: scale(0.97);
        }
        
        .back-container span { 
            font-size: 1.05rem; 
            font-weight: 700; 
            letter-spacing: -0.01em;
            line-height: 1;
        }

        .back-btn {
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 34px; 
            height: 34px; 
            border-radius: var(--radius-md);
            background: var(--surface); 
            border: 1px solid var(--border);
            color: var(--text-primary); 
            box-shadow: var(--shadow-sm);
            flex-shrink: 0; 
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mode-toggle-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 7px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .mode-toggle-btn.active {
            color: var(--accent);
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .cloud-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cloud-status-dot.synced { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .cloud-status-dot.loading { background-color: var(--accent); transform: scale(1.15); }
        .cloud-status-dot.error { background-color: var(--danger); box-shadow: 0 0 8px var(--danger); }

        main { 
            padding: 20px 16px; 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        .matrix-grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }

        /* Automatische Erkennung für Desktop / Breiten Bildschirm */
        @media (min-width: 900px) {
            .matrix-grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .timeframe-section {
            background: var(--surface); 
            border: 1px solid var(--border);
            border-radius: var(--radius-lg); 
            padding: 20px; 
            box-shadow: var(--shadow-md);
            display: flex; 
            flex-direction: column; 
            gap: 16px;
            height: fit-content;
        }

        .timeframe-title {
            font-size: 0.88rem; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 0.06em; 
            color: var(--text-secondary);
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light); 
            padding-bottom: 12px;
        }

        .category-container { display: flex; flex-direction: column; gap: 14px; }
        
        .category-subheading {
            font-size: 0.72rem; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent); 
            background: var(--accent-soft);
            padding: 4px 10px;
            border-radius: 6px;
            width: fit-content;
            margin-top: 4px; 
            display: flex; 
            align-items: center; 
            gap: 6px;
        }

        .goal-card {
            background: var(--surface-card); 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border);
            padding: 12px 14px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-sm);
        }
        .goal-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        .goal-card.done { 
            opacity: 0.6; 
            border-style: dashed; 
            background: var(--border-light); 
        }
        .goal-card.done:hover {
            transform: none;
        }
        .creation-mode-hidden { display: none !important; }

        .status-circle {
            width: 22px; 
            height: 22px; 
            border-radius: 7px;
            border: 2px solid var(--border); 
            background: var(--surface);
            display: flex; 
            align-items: center; 
            justify-content: center;
            flex-shrink: 0; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .status-circle:hover {
            border-color: var(--accent);
        }
        .goal-card.done .status-circle { background: var(--success); border-color: var(--success); }
        .status-circle::after { content: '✓'; color: white; font-size: 13px; font-weight: bold; display: none; }
        .goal-card.done .status-circle::after { display: block; }

        .goal-content-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .goal-text { 
            font-weight: 600; 
            font-size: 0.92rem; 
            word-break: break-word; 
            line-height: 1.35;
        }

        .timeframe-pill {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        
        .goal-actions { display: flex; gap: 8px; align-items: center; }
        .action-btn {
            background: transparent; border: none; color: var(--text-secondary);
            cursor: pointer; font-size: 0.85rem; padding: 4px;
            border-radius: var(--radius-sm);
            transition: color 0.15s ease;
        }
        .action-btn:hover { color: var(--danger); }

        .add-goal-form {
            display: flex; gap: 8px; margin-top: 2px;
        }
        .add-goal-input {
            flex: 1; 
            background: var(--surface-card); 
            border: 1px solid var(--border);
            border-radius: var(--radius-md); 
            padding: 9px 12px; 
            color: var(--text-primary);
            font-size: 0.88rem; 
            outline: none;
            transition: border-color 0.2s ease;
        }
        .add-goal-input:focus {
            border-color: var(--accent);
        }
        .add-goal-btn {
            background: var(--accent); 
            color: white; 
            border: none;
            border-radius: var(--radius-md); 
            padding: 0 14px; 
            font-weight: 700;
            cursor: pointer; 
            font-size: 1rem;
            transition: opacity 0.2s ease;
        }
        .add-goal-btn:hover {
            opacity: 0.9;
        }

        /* Historie Sektion */
        .history-section {
            background: var(--surface); 
            border: 1px solid var(--border);
            border-radius: var(--radius-lg); 
            padding: 18px 20px; 
            box-shadow: var(--shadow-md);
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-top: 10px;
        }
        .history-header {
            font-size: 0.88rem; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 0.05em; 
            color: var(--text-secondary);
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            user-select: none;
        }
        .history-content { display: none; flex-direction: column; gap: 10px; border-top: 1px solid var(--border-light); padding-top: 14px; }
        .history-section.expanded .history-content { display: flex; }

        .toast-notification {
            position: fixed; top: calc(env(safe-area-inset-top) + 20px);
            left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--success); color: white; padding: 10px 20px;
            border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 700;
            box-shadow: var(--shadow-lg); opacity: 0; z-index: 1000;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
        }
        .toast-notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
    <script src="api.js"></script>
</head>
<body>

<div class="toast-notification" id="toast-notice">Änderung gespeichert</div>

<header>
    <div class="header-left">
        <a href="index.html" class="back-container">
            <div class="back-btn">&larr;</div>
            <span>Ziele</span>
        </a>
    </div>
    <div class="header-right">
        <button class="mode-toggle-btn" id="creation-mode-btn" onclick="toggleCreationMode()" title="Erstellungsmodus ein-/ausschalten">Erstellen: Aus</button>
        <div class="cloud-status-dot" id="cloud-status-dot" title="Cloud-Status"></div>
    </div>
</header>

<main id="main-container">
    <div class="matrix-grid-container" id="matrix-container">
        <!-- Wird dynamisch gefüllt -->
    </div>

    <!-- Historie-Bereich -->
    <div class="history-section" id="history-section-box">
        <div class="history-header" onclick="toggleHistory()">
            <span>Erledigte Ziele (Historie)</span>
            <span id="history-arrow">▼</span>
        </div>
        <div class="history-content" id="history-container">
            <!-- Erledigte Ziele -->
        </div>
    </div>
</main>

<script>
    const categories = ["KARRIERE", "GESUNDHEIT", "LIFESTYLE"];
    const timeframes = [
        { key: "MONAT", label: "Monats-Fokus (1 je Kat.)", limit: 1 },
        { key: "JAHR", label: "Jahres-Meilensteine (2 je Kat.)", limit: 2 },
        { key: "DEKADE", label: "Dekaden-Ziele (3 je Kat.)", limit: 3 },
        { key: "LEBEN", label: "Lebensziele (3 je Kat.)", limit: 3 }
    ];

    let creationModeActive = false;
    let globalGoalsData = [];

    function showToast(text, isError = false) {
        const toast = document.getElementById('toast-notice');
        toast.textContent = text;
        toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function setCloudStatus(status) {
        const dot = document.getElementById('cloud-status-dot');
        if (!dot) return;
        dot.className = "cloud-status-dot " + status;
    }

    function toggleCreationMode() {
        creationModeActive = !creationModeActive;
        const btn = document.getElementById('creation-mode-btn');
        btn.textContent = creationModeActive ? "Erstellen: An" : "Erstellen: Aus";
        btn.classList.toggle('active', creationModeActive);
        renderMatrix(globalGoalsData);
    }

    function toggleHistory() {
        const box = document.getElementById('history-section-box');
        box.classList.toggle('expanded');
        const arrow = document.getElementById('history-arrow');
        arrow.textContent = box.classList.contains('expanded') ? "▲" : "▼";
    }

    function loadAndRenderGoals() {
        setCloudStatus("loading");
        fetchGoals()
            .then(goals => {
                setCloudStatus("synced");
                globalGoalsData = goals;
                renderMatrix(goals);
                document.body.classList.add('loaded');
            })
            .catch(() => setCloudStatus("error"));
    }

    function renderMatrix(goals) {
        const container = document.getElementById('matrix-container');
        const historyContainer = document.getElementById('history-container');
        container.innerHTML = "";
        historyContainer.innerHTML = "";

        let hasCompletedGoals = false;

        timeframes.forEach(tf => {
            let tfSection = document.createElement('div');
            tfSection.className = "timeframe-section";
            
            let tfHeader = document.createElement('div');
            tfHeader.className = "timeframe-title";
            tfHeader.innerHTML = `<span>${tf.label}</span>`;
            tfSection.appendChild(tfHeader);

            let catContainer = document.createElement('div');
            catContainer.className = "category-container";

            categories.forEach(cat => {
                let catSub = document.createElement('div');
                catSub.className = "category-subheading";
                
                const catGoals = goals.filter(g => g.timeframe === tf.key && g.category === cat);
                const openGoals = catGoals.filter(g => !g.status);
                const completedGoals = catGoals.filter(g => g.status);

                catSub.innerHTML = `<span>${cat} (${catGoals.length}/${tf.limit})</span>`;
                catContainer.appendChild(catSub);

                // Nur offene Ziele standardmäßig oben anzeigen
                openGoals.forEach(goal => {
                    let card = document.createElement('div');
                    card.className = `goal-card`;
                    card.innerHTML = `
                        <div class="status-circle" onclick="handleToggle('${goal.id}', true)"></div>
                        <div class="goal-content-box">
                            <div class="goal-text">${escapeHtml(goal.goal_text)}</div>
                            <div class="timeframe-pill">${tf.key} &bull; ${cat}</div>
                        </div>
                        <div class="goal-actions">
                            <button class="action-btn ${creationModeActive ? '' : 'creation-mode-hidden'}" onclick="handleDelete('${goal.id}')" title="Löschen">🗑️</button>
                        </div>
                    `;
                    catContainer.appendChild(card);
                });

                // Erledigte Ziele für die Historie sammeln
                completedGoals.forEach(goal => {
                    hasCompletedGoals = true;
                    let hCard = document.createElement('div');
                    hCard.className = `goal-card done`;
                    hCard.innerHTML = `
                        <div class="status-circle" onclick="handleToggle('${goal.id}', false)"></div>
                        <div class="goal-content-box">
                            <div class="goal-text">${escapeHtml(goal.goal_text)}</div>
                            <div class="timeframe-pill">${tf.key} &bull; ${cat}</div>
                        </div>
                        <div class="goal-actions">
                            <button class="action-btn ${creationModeActive ? '' : 'creation-mode-hidden'}" onclick="handleDelete('${goal.id}')" title="Löschen">🗑️</button>
                        </div>
                    `;
                    historyContainer.appendChild(hCard);
                });

                // Erstellungs-Input nur anzeigen, wenn Modus aktiv und Limit nicht erreicht
                if (catGoals.length < tf.limit) {
                    let formDiv = document.createElement('div');
                    formDiv.className = `add-goal-form ${creationModeActive ? '' : 'creation-mode-hidden'}`;
                    formDiv.innerHTML = `
                        <input type="text" class="add-goal-input" id="input-${tf.key}-${cat}" placeholder="Neues Ziel für ${cat.toLowerCase()}...">
                        <button class="add-goal-btn" onclick="handleAdd('${tf.key}', '${cat}')">+</button>
                    `;
                    catContainer.appendChild(formDiv);
                }
            });

            tfSection.appendChild(catContainer);
            container.appendChild(tfSection);
        });

        if (!hasCompletedGoals) {
            historyContainer.innerHTML = `<div style="font-size: 0.82rem; color: var(--text-muted); padding: 4px;">Noch keine erledigten Ziele in der Historie.</div>`;
        }
    }

    function handleToggle(id, newStatus) {
        setCloudStatus("loading");
        toggleGoalStatus(id, newStatus)
            .then(() => {
                setCloudStatus("synced");
                showToast("Status aktualisiert");
                loadAndRenderGoals();
            })
            .catch(() => setCloudStatus("error"));
    }

    function handleAdd(timeframe, category) {
        const input = document.getElementById(`input-${timeframe}-${category}`);
        const text = input ? input.value.trim() : "";
        if (!text) return;

        setCloudStatus("loading");
        addGoal(timeframe, category, text)
            .then(() => {})
            .catch(() => {})
            .finally(() => {
                setCloudStatus("synced");
                showToast("Ziel hinzugefügt");
                setTimeout(loadAndRenderGoals, 800);
            });
    }

    function handleDelete(id) {
        if (!confirm("Ziel wirklich löschen?")) return;
        setCloudStatus("loading");
        deleteGoal(id)
            .finally(() => {
                setCloudStatus("synced");
                showToast("Ziel gelöscht");
                setTimeout(loadAndRenderGoals, 800);
            });
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.onload = () => {
        loadAndRenderGoals();
    };
</script>
</body>
</html>
