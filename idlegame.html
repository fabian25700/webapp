<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer Tycoon - Idle</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9e6;
            --accent: #ff6b6b; /* Influencer-Rot/Pink */
            --text: #4a4a4a;
            --glass: rgba(255, 255, 255, 0.4);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* Neumorphismus Container */
        .card {
            background: var(--bg);
            border-radius: 30px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
            padding: 20px;
            margin: 20px;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        #click-area {
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
        }

        #click-area:active { transform: scale(0.98); }

        .stats-title { font-size: 0.9rem; color: #888; margin-bottom: 5px; }
        .follower-count { font-size: 2.5rem; font-weight: bold; color: var(--accent); }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 12px;
            background: var(--bg);
            border-radius: 10px;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            margin: 15px 0;
            overflow: hidden;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #feb47b);
            transition: width 0.3s;
        }

        /* Upgrades Liste */
        .upgrade-list { width: 100%; max-width: 500px; padding-bottom: 50px; }
        .upgrade-item {
            background: var(--bg);
            border-radius: 20px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            margin: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .upgrade-item:active { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }
        .upgrade-item.disabled { opacity: 0.6; cursor: not-allowed; }

        .info { text-align: left; }
        .info b { display: block; font-size: 1.1rem; }
        .price { color: var(--accent); font-weight: bold; }

        /* Spezial Event (Golden Button) */
        #special-event {
            position: fixed;
            width: 60px;
            height: 60px;
            background: #ffd700;
            border-radius: 50%;
            display: none;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255,215,0,0.8);
            cursor: pointer;
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .floating-text {
            position: absolute;
            color: var(--accent);
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
        }
        @keyframes floatUp { to { transform: translateY(-50px); opacity: 0; } }

        .multiplier-badge {
            background: #4caf50;
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card" id="click-area">
        <div class="stats-title">Community Größe</div>
        <div class="follower-count" id="follower-display">0</div>
        <div id="pps-display" style="font-size: 0.9rem;">Follower/Sek: 0</div>
        <div class="multiplier-badge" id="mult-badge">🔥 VIRAL: 10x BOOST!</div>
        
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="level-display" style="font-size: 0.8rem; font-weight: bold;">Level: Rookie Influencer</div>
    </div>

    <div class="upgrade-list">
        <div class="upgrade-item" onclick="buyClickPower()">
            <div class="info"><b>Bessere Kamera</b><span id="cp-desc">Klick-Power +1</span></div>
            <div class="price" id="cp-cost">15 Follower</div>
        </div>
        <div class="upgrade-item" onclick="buyAuto(0)">
            <div class="info"><b>Bot-Farm</b><span id="auto0-desc">Generiert 1 Follower/s</span></div>
            <div class="price" id="auto0-cost">50 Follower</div>
        </div>
        <div class="upgrade-item" onclick="buyAuto(1)">
            <div class="info"><b>Cutter einstellen</b><span id="auto1-desc">Generiert 10 Follower/s</span></div>
            <div class="price" id="auto1-cost">500 Follower</div>
        </div>
        <div class="upgrade-item" onclick="buyMultiplier()">
            <div class="info"><b>Marketing Kampagne</b><span>Verdoppelt ALLES permanent</span></div>
            <div class="price" id="mult-cost">5000 Follower</div>
        </div>
    </div>

    <div id="special-event" onclick="triggerSpecial()"></div>

    <script>
        // --- GAME STATE ---
        let game = {
            followers: 0,
            totalFollowers: 0,
            clickPower: 1,
            pps: 0,
            multiplier: 1,
            lastTick: Date.now(),
            upgrades: [
                { id: 0, name: "Bot-Farm", cost: 50, power: 1, count: 0 },
                { id: 1, name: "Cutter einstellen", cost: 500, power: 10, count: 0 }
            ],
            costs: { cp: 15, mult: 5000 },
            level: 1
        };

        let specialActive = false;
        let specialMultiplier = 1;

        // --- CORE LOGIC ---
        function updateDisplay() {
            document.getElementById('follower-display').innerText = Math.floor(game.followers).toLocaleString();
            document.getElementById('pps-display').innerText = `Follower/Sek: ${(game.pps * game.multiplier * specialMultiplier).toFixed(1)}`;
            
            // Progress Bar & Level
            let nextLevel = game.level * 1000 * Math.pow(1.5, game.level);
            let progress = (game.followers / nextLevel) * 100;
            document.getElementById('progress-bar').style.width = Math.min(progress, 100) + "%";
            if(game.followers >= nextLevel) { game.level++; updateLevelName(); }

            // Button Updates
            document.getElementById('cp-cost').innerText = `${game.costs.cp} Follower`;
            document.getElementById('auto0-cost').innerText = `${game.upgrades[0].cost} Follower`;
            document.getElementById('auto1-cost').innerText = `${game.upgrades[1].cost} Follower`;
            document.getElementById('mult-cost').innerText = `${game.costs.mult} Follower`;
        }

        function updateLevelName() {
            const names = ["Rookie", "Micro-Influencer", "Rising Star", "Verified Creator", "Trendsetter", "Global Icon"];
            let name = names[Math.min(game.level - 1, names.length - 1)];
            document.getElementById('level-display').innerText = `Level ${game.level}: ${name}`;
        }

        // --- CLICKING ---
        document.getElementById('click-area').addEventListener('click', (e) => {
            let gain = game.clickPower * game.multiplier * specialMultiplier;
            game.followers += gain;
            game.totalFollowers += gain;
            createFloatingText(e.clientX, e.clientY, `+${gain}`);
            updateDisplay();
            saveGame();
        });

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // --- PURCHASES ---
        function buyClickPower() {
            if(game.followers >= game.costs.cp) {
                game.followers -= game.costs.cp;
                game.clickPower += 1;
                game.costs.cp = Math.floor(game.costs.cp * 1.5);
                updateDisplay();
            }
        }

        function buyAuto(id) {
            let upg = game.upgrades[id];
            if(game.followers >= upg.cost) {
                game.followers -= upg.cost;
                upg.count++;
                game.pps += upg.power;
                upg.cost = Math.floor(upg.cost * 1.3);
                updateDisplay();
            }
        }

        function buyMultiplier() {
            if(game.followers >= game.costs.mult) {
                game.followers -= game.costs.mult;
                game.multiplier *= 2;
                game.costs.mult *= 5;
                updateDisplay();
            }
        }

        // --- SPECIAL EVENT ---
        function spawnSpecial() {
            if(specialActive) return;
            const btn = document.getElementById('special-event');
            btn.style.left = Math.random() * (window.innerWidth - 60) + "px";
            btn.style.top = Math.random() * (window.innerHeight - 60) + "px";
            btn.style.display = "block";
            setTimeout(() => btn.style.display = "none", 5000);
        }

        function triggerSpecial() {
            specialActive = true;
            specialMultiplier = 10;
            document.getElementById('special-event').style.display = "none";
            document.getElementById('mult-badge').style.display = "block";
            setTimeout(() => {
                specialActive = false;
                specialMultiplier = 1;
                document.getElementById('mult-badge').style.display = "none";
            }, 10000);
        }

        // --- SAVE & OFFLINE ---
        function saveGame() { localStorage.setItem('influencerSave', JSON.stringify(game)); }
        
        function loadGame() {
            let saved = localStorage.getItem('influencerSave');
            if(saved) {
                game = JSON.parse(saved);
                let offlineTime = (Date.now() - game.lastTick) / 1000;
                if(offlineTime > 10) {
                    let gain = Math.floor(offlineTime * game.pps * game.multiplier);
                    if(gain > 0) {
                        alert(`Willkommen zurück! Während du weg warst, haben deine Fans ${gain} neue Follower generiert!`);
                        game.followers += gain;
                    }
                }
            }
            updateDisplay();
            updateLevelName();
        }

        // --- GAME LOOP ---
        setInterval(() => {
            game.followers += (game.pps * game.multiplier * specialMultiplier);
            game.lastTick = Date.now();
            updateDisplay();
            if(Math.random() < 0.05) spawnSpecial(); // 5% Chance pro Sekunde
        }, 1000);

        setInterval(saveGame, 10000); // Autosave alle 10 Sek.

        window.onload = loadGame;
    </script>
</body>
</html>
